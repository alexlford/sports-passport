<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Profile | Sports Passport</title><link rel="stylesheet" href="assets/site.css"><style>.team-theme{background:linear-gradient(135deg,var(--team-primary),color-mix(in srgb,var(--team-primary) 78%,#000));color:#fff;border-color:color-mix(in srgb,var(--team-secondary) 55%,transparent);border-bottom:8px solid var(--team-secondary)}.team-theme .kicker{color:#fff!important;opacity:.84}.team-theme .deck{color:rgba(255,255,255,.9)!important}.team-theme .stat{background:rgba(255,255,255,.94);color:var(--ink)}.team-theme .stat span{color:#625d55}.team-swatch{display:inline-flex;gap:5px;vertical-align:middle;margin-left:8px}.team-swatch i{width:12px;height:12px;border-radius:50%;display:block}.team-swatch i:first-child{background:var(--team-primary);border:1px solid rgba(255,255,255,.65)}.team-swatch i:last-child{background:var(--team-secondary);border:1px solid rgba(255,255,255,.65)}</style></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Team Profile</div><nav class="nav"><a href="teams.html">All Teams</a><a href="venues.html">Venues</a><a href="index.html">Archive</a></nav></header><div id="app"></div></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,events=await D.load("events");const target=new URLSearchParams(location.search).get("t"),allTeams=[...new Set(events.flatMap(e=>e.teams))],team=allTeams.find(t=>D.slug(t)===target),app=document.querySelector("#app");if(!team){app.innerHTML='<section class="hero"><h1>Team not found.</h1></section>';return}document.title=`${team} | Sports Passport`;const ev=D.teamEvents(events,team).sort((a,b)=>b.date.localeCompare(a.date)),r=D.recordForTeam(ev,team),sports=D.counts(ev.map(e=>e.sport)),vcounts=D.counts(ev.map(e=>e.venue_key).filter(Boolean)),yrs=ev.map(e=>e.year);const sport=Object.entries(sports).sort((a,b)=>b[1]-a[1])[0]?.[0]||'Other';const sportFallback={Baseball:['#b73b3b','#f4ecdc'],Basketball:['#d97718','#13294b'],Football:['#7a4b2d','#f4ecdc'],Soccer:['#377a55','#f4ecdc'],Hockey:['#4f7f9f','#f4ecdc'],Other:['#112b3c','#c49b48']};const teamColors={
'Illinois Fighting Illini':['#E84A27','#13294B'],'Kansas Jayhawks':['#0051BA','#E8000D'],'Kansas City Chiefs':['#E31837','#FFB81C'],'Kansas City Royals':['#004687','#BD9B60'],'St. Louis Cardinals':['#C41E3A','#0C2340'],'Baltimore Orioles':['#DF4601','#000000'],'Denver Nuggets':['#0E2240','#FEC524'],'Colorado Rockies':['#33006F','#C4CED4'],'Colorado Buffaloes':['#CFB87C','#000000'],'Denver Summit FC':['#174F3B','#F5F2E8'],'Southern Illinois Salukis':['#720000','#FFFFFF'],'UConn Huskies':['#000E2F','#FFFFFF'],'Connecticut Huskies':['#000E2F','#FFFFFF'],'Michigan Wolverines':['#00274C','#FFCB05'],'Arizona Wildcats':['#CC0033','#003366'],'Missouri Tigers':['#F1B82D','#000000'],'Kansas State Wildcats':['#512888','#FFFFFF'],'Iowa State Cyclones':['#C8102E','#F1BE48'],'Oklahoma Sooners':['#841617','#FDF9D8'],'West Virginia Mountaineers':['#002855','#EAAA00'],'Kentucky Wildcats':['#0033A0','#FFFFFF'],'Philadelphia Eagles':['#004C54','#A5ACAF'],'Minnesota Vikings':['#4F2683','#FFC62F'],'Green Bay Packers':['#203731','#FFB612'],'San Francisco 49ers':['#AA0000','#B3995D'],'Pittsburgh Steelers':['#101820','#FFB612'],'Denver Broncos':['#FB4F14','#002244'],'New York Jets':['#125740','#FFFFFF'],'San Diego Chargers':['#0073CF','#FFC20E'],'Oakland Raiders':['#000000','#A5ACAF'],'Miami Dolphins':['#008E97','#FC4C02'],'Tennessee Titans':['#0C2340','#4B92DB'],'Chicago White Sox':['#27251F','#C4CED4'],'New York Yankees':['#0C2340','#C4CED4'],'Minnesota Twins':['#002B5C','#D31145'],'Toronto Blue Jays':['#134A8E','#E8291C'],'Atlanta Braves':['#CE1141','#13274F'],'Houston Astros':['#002D62','#EB6E1F'],'Detroit Tigers':['#0C2340','#FA4616'],'Los Angeles Dodgers':['#005A9C','#EF3E42'],'Cincinnati Reds':['#C6011F','#000000'],'San Diego Padres':['#2F241D','#FFC425'],'Pittsburgh Pirates':['#27251F','#FDB827']};const palette=teamColors[team]||sportFallback[sport]||sportFallback.Other;const timeline=ev.map(e=>`<div class="event"><div class="event-year">${e.year}</div><div><b>${D.matchup(e)} ${D.score(e)}</b><small>${e.date} · ${e.venue_recorded} · ${e.city}</small></div></div>`).join("");const rows=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="leader"><span>${k}</span><strong>${n}</strong></div>`).join("");app.innerHTML=`<section class="hero team-theme" style="--team-primary:${palette[0]};--team-secondary:${palette[1]}"><div class="kicker">Team profile <span class="team-swatch" aria-hidden="true"><i></i><i></i></span></div><h1>${team}</h1><div class="deck">${ev.length} documented appearance${ev.length===1?"":"s"} across ${Math.min(...yrs)}–${Math.max(...yrs)}.</div><div class="stats"><div class="stat"><strong>${ev.length}</strong><span>Appearances</span></div><div class="stat"><strong>${Math.min(...yrs)}–${Math.max(...yrs)}</strong><span>Span</span></div><div class="stat"><strong>${r.w}–${r.l}${r.tie?`–${r.tie}`:""}</strong><span>Archive record</span></div><div class="stat"><strong>${Object.keys(vcounts).length}</strong><span>Venues</span></div><div class="stat"><strong>${Object.keys(sports).length}</strong><span>Sports</span></div></div></section><section class="section grid2"><div class="panel"><div class="kicker">Venues</div><h2>Where you saw them</h2><div class="rank-list" data-density="8">${rows(vcounts)}</div></div><div class="panel"><div class="kicker">Sport mix</div><h2>Contexts</h2><div class="rank-list">${rows(sports)}</div></div></section><section class="section panel"><div class="kicker">Timeline</div><h2>Every appearance</h2><p class="density-note">Most recent first. Long histories open with the latest 12 appearances.</p><div class="timeline-list" data-density="12">${timeline}</div></section>`;D.enhanceDensity(app)})();</script></body></html>
