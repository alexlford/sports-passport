<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Profile | Sports Passport</title><link rel="stylesheet" href="assets/site.css"><style>.team-theme{background:linear-gradient(135deg,var(--team-bg),color-mix(in srgb,var(--team-bg) 78%,#000));color:#fff;border-color:color-mix(in srgb,var(--team-accent) 55%,transparent);border-bottom:8px solid var(--team-accent)}.team-theme .kicker{color:#fff!important;opacity:.84}.team-theme .deck{color:rgba(255,255,255,.9)!important}.team-theme .stat{background:rgba(255,255,255,.94);color:var(--ink)}.team-theme .stat span{color:#625d55}.team-swatch{display:inline-flex;gap:5px;vertical-align:middle;margin-left:8px}.team-swatch i{width:12px;height:12px;border-radius:50%;display:block}.team-swatch i:first-child{background:var(--team-primary);border:1px solid rgba(255,255,255,.65)}.team-swatch i:last-child{background:var(--team-secondary);border:1px solid rgba(255,255,255,.65)}.source-labels{position:relative;z-index:1;margin-top:12px;font-size:.8rem;color:rgba(255,255,255,.72)}.confidence-note{margin-top:14px;padding:12px 14px;border:1px solid rgba(255,255,255,.25);border-radius:12px;background:rgba(0,0,0,.13);color:rgba(255,255,255,.86);font-size:.82rem;line-height:1.45}.event-confidence{display:inline-block;margin-left:7px;padding:2px 6px;border-radius:999px;background:#eee8f2;color:#654875;font-size:.62rem;font-weight:900;text-transform:uppercase}.favorite-badge{display:inline-flex;align-items:center;gap:7px;margin:12px 0 0;padding:7px 11px;border:1px solid rgba(255,255,255,.3);border-radius:999px;background:rgba(255,255,255,.12);font-size:.72rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase}.lore-intro{max-width:850px}.lore-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.lore-card{padding:20px;border:1px solid var(--line);border-top:5px solid var(--team-accent);border-radius:18px;background:#fffdf8}.lore-card h3{margin:4px 0 12px;font-size:1.35rem}.lore-card ul{margin:0;padding-left:19px}.lore-card li{margin:0 0 10px;line-height:1.5}.history-panel{border-left:6px solid var(--team-accent)}.history-panel p{max-width:900px;font-size:1rem;line-height:1.7}.source-links{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:16px}.source-links a{font-size:.78rem;font-weight:850;text-underline-offset:3px}@media(max-width:850px){.lore-grid{grid-template-columns:1fr}}</style></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Team Profile</div><nav class="nav"><a href="teams.html">All Teams</a><a href="venues.html">Venues</a><a href="index.html">Archive</a></nav></header><div id="app"></div></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,[events,teamColors,teamLore]=await Promise.all([D.load("events"),D.load("team-colors"),D.load("team-lore")]);const target=new URLSearchParams(location.search).get("t"),allTeams=[...new Set(events.flatMap(D.eventTeams))],team=allTeams.find(t=>D.slug(t)===target),app=document.querySelector("#app");if(!team){app.innerHTML='<section class="hero"><h1>Team not found.</h1></section>';return}document.title=`${team} | Sports Passport`;const lore=teamLore?.[team]||null,ev=D.teamEvents(events,team).sort((a,b)=>b.date.localeCompare(a.date)),confirmedEv=ev.filter(D.isConfirmedEvent),notional=ev.filter(D.isNotionalEvent).length,r=D.recordForTeam(confirmedEv,team),sports=D.counts(ev.map(e=>e.sport)),vcounts=D.counts(ev.map(e=>e.venue_key).filter(Boolean)),yrs=ev.map(e=>e.year),sourceLabels=[...new Set(ev.flatMap(e=>(e.teams||[]).filter((_,i)=>D.eventTeams(e)[i]===team)))];const sport=Object.entries(sports).sort((a,b)=>b[1]-a[1])[0]?.[0]||'Other';const sportFallback={Baseball:['#b73b3b','#f4ecdc'],Basketball:['#d97718','#13294b'],Football:['#7a4b2d','#f4ecdc'],Soccer:['#377a55','#f4ecdc'],Hockey:['#4f7f9f','#f4ecdc'],Other:['#112b3c','#c49b48']};const palette=D.teamPalette(teamColors,team)||sportFallback[sport]||sportFallback.Other;const lum=hex=>{const n=hex.replace('#',''),rgb=[0,2,4].map(i=>parseInt(n.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2]};const bg=lum(palette[0])<=lum(palette[1])?palette[0]:palette[1],accent=bg===palette[0]?palette[1]:palette[0];const timeline=ev.map(e=>`<div class="event"><div class="event-year">${e.year}</div><div><b>${D.matchup(e)} ${D.score(e)}</b>${D.isNotionalEvent(e)?'<span class="event-confidence">Notional</span>':''}<small>${e.date} · ${e.venue_recorded} · ${e.city}</small></div></div>`).join("");const rows=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="leader"><span>${k}</span><strong>${n}</strong></div>`).join("");const sourceNote=sourceLabels.some(x=>x!==team)?`<div class="source-labels">Source labels preserved in game records: ${sourceLabels.join(' · ')}</div>`:'';const confidenceNote=notional?`<div class="confidence-note"><strong>Confidence policy:</strong> ${notional} pre-2006 appearance${notional===1?' is':'s are'} notional. Appearance and venue counts include the full archive; the win/loss record below uses only confirmed or post-2005 documented events.</div>`:'';const list=items=>`<ul>${(items||[]).map(x=>`<li>${x}</li>`).join('')}</ul>`;const loreSection=lore?`<section class="section"><div class="head"><div><div class="kicker">Favorite team dossier</div><h2>History, championships & lore</h2></div><p class="lore-intro">Context beyond the games in the archive: the history and traditions that make this team part of the personal sports story.</p></div><div class="panel history-panel" style="--team-accent:${accent}"><div class="kicker">History</div><h2>${lore.subtitle||team}</h2><p>${lore.history}</p></div><div class="lore-grid" style="--team-accent:${accent}"><article class="lore-card"><div class="kicker">Trophy case</div><h3>Championships & milestones</h3>${list(lore.championships)}</article><article class="lore-card"><div class="kicker">The stories</div><h3>Lore & tradition</h3>${list(lore.lore)}</article><article class="lore-card"><div class="kicker">Worth knowing</div><h3>Fun facts</h3>${list(lore.fun_facts)}</article></div>${Array.isArray(lore.sources)&&lore.sources.length?`<div class="source-links"><span class="kicker">Official sources</span>${lore.sources.map(s=>`<a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.label} ↗</a>`).join('')}</div>`:''}</section>`:'';app.innerHTML=`<section class="hero team-theme" style="--team-primary:${palette[0]};--team-secondary:${palette[1]};--team-bg:${bg};--team-accent:${accent}"><div class="kicker">Team profile <span class="team-swatch" aria-hidden="true"><i></i><i></i></span></div><h1>${team}</h1><div class="deck">${ev.length} archive appearance${ev.length===1?"":"s"} across ${Math.min(...yrs)}–${Math.max(...yrs)}.</div>${lore?.favorite?'<div class="favorite-badge">★ Favorite team</div>':''}${sourceNote}${confidenceNote}<div class="stats"><div class="stat"><strong>${ev.length}</strong><span>Archive appearances</span></div><div class="stat"><strong>${Math.min(...yrs)}–${Math.max(...yrs)}</strong><span>Span</span></div><div class="stat"><strong>${r.w}–${r.l}${r.tie?`–${r.tie}`:""}</strong><span>Confirmed record</span></div><div class="stat"><strong>${Object.keys(vcounts).length}</strong><span>Venues</span></div><div class="stat"><strong>${Object.keys(sports).length}</strong><span>Sports</span></div></div></section>${loreSection}<section class="section grid2"><div class="panel"><div class="kicker">Venues</div><h2>Where you saw them</h2><div class="rank-list" data-density="8">${rows(vcounts)}</div></div><div class="panel"><div class="kicker">Sport mix</div><h2>Contexts</h2><div class="rank-list">${rows(sports)}</div></div></section><section class="section panel"><div class="kicker">Timeline</div><h2>Every appearance</h2><p class="density-note">Most recent first. Historical source team labels remain visible, and notional early records are explicitly marked.</p><div class="timeline-list" data-density="12">${timeline}</div></section>`;D.enhanceDensity(app)})();</script></body></html>
