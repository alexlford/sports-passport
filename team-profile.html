<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Profile | Sports Passport</title><link rel="stylesheet" href="assets/site.css"></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Team Profile</div><nav class="nav"><a href="teams.html">All Teams</a><a href="venues.html">Venues</a><a href="index.html">Archive</a></nav></header><div id="app"></div></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,events=await D.load("events");const target=new URLSearchParams(location.search).get("t"),allTeams=[...new Set(events.flatMap(e=>e.teams))],team=allTeams.find(t=>D.slug(t)===target),app=document.querySelector("#app");if(!team){app.innerHTML='<section class="hero"><h1>Team not found.</h1></section>';return}document.title=`${team} | Sports Passport`;const ev=D.teamEvents(events,team).sort((a,b)=>a.date.localeCompare(b.date)),r=D.recordForTeam(ev,team),sports=D.counts(ev.map(e=>e.sport)),vcounts=D.counts(ev.map(e=>e.venue_key).filter(Boolean)),yrs=ev.map(e=>e.year);const timeline=ev.map(e=>`<div class="event"><div class="event-year">${e.year}</div><div><b>${D.matchup(e)} ${D.score(e)}</b><small>${e.date} · ${e.venue_recorded} · ${e.city}</small></div></div>`).join("");const rows=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="leader"><span>${k}</span><strong>${n}</strong></div>`).join("");app.innerHTML=`<section class="hero"><div class="kicker">Dynamic team profile</div><h1>${team}</h1><div class="deck">${ev.length} documented appearance${ev.length===1?"":"s"} across ${Math.min(...yrs)}–${Math.max(...yrs)}.</div><div class="stats"><div class="stat"><strong>${ev.length}</strong><span>Appearances</span></div><div class="stat"><strong>${Math.min(...yrs)}–${Math.max(...yrs)}</strong><span>Span</span></div><div class="stat"><strong>${r.w}–${r.l}${r.tie?`–${r.tie}`:""}</strong><span>Archive record</span></div><div class="stat"><strong>${Object.keys(vcounts).length}</strong><span>Venues</span></div><div class="stat"><strong>${Object.keys(sports).length}</strong><span>Sports</span></div></div></section><section class="section grid2"><div class="panel"><div class="kicker">Venues</div><h2>Where you saw them</h2>${rows(vcounts)}</div><div class="panel"><div class="kicker">Sport mix</div><h2>Contexts</h2>${rows(sports)}</div></section><section class="section panel"><div class="kicker">Timeline</div><h2>Every appearance</h2>${timeline}</section>`})();</script></body></html>
