<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life Chapter | Sports Passport</title><link rel="stylesheet" href="assets/site.css"><style>.bars{display:flex;align-items:flex-end;gap:5px;height:230px;overflow-x:auto}.barwrap{min-width:28px;flex:1;text-align:center}.bar{height:var(--h);min-height:3px;background:var(--red);border-radius:5px 5px 2px 2px}.barwrap span{display:block;font-size:.58rem;color:var(--muted);transform:rotate(-55deg);margin-top:13px}.confidence-note{margin-top:16px;padding:13px 15px;border:1px solid var(--line);border-left:5px solid #725b86;border-radius:14px;background:#fffaf0;color:var(--muted);line-height:1.45}</style></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Life Chapter</div><nav class="nav"><a href="index.html">Archive</a><a href="journeys.html">Journeys</a><a href="lifetime-analytics.html">Analytics</a></nav></header><div id="app"></div></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,[events,phases]=await Promise.all([D.load("events"),D.load("phases")]);const key=new URLSearchParams(location.search).get("p"),p=phases.find(x=>x.key===key),app=document.querySelector("#app");if(!p){app.innerHTML='<section class="hero"><h1>Chapter not found.</h1></section>';return}const ev=D.phaseEvents(events,p),confirmed=ev.filter(e=>Number(e.year)>=2006||e.attendance_status==="verified"),notional=ev.filter(e=>e.attendance_status==="notional").length,years=D.counts(ev.map(e=>e.year)),sports=D.counts(ev.map(e=>e.sport)),teams=D.counts(ev.flatMap(D.eventTeams)),venues=D.counts(ev.map(e=>e.venue_key).filter(Boolean));document.title=`${p.title} | Sports Passport`;const rows=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,n])=>`<div class="leader"><span>${k}</span><strong>${n}</strong></div>`).join(""),max=Math.max(1,...Object.values(years)),bars=Object.keys(years).map(Number).sort((a,b)=>a-b).map(y=>`<div class="barwrap"><b>${years[y]}</b><div class="bar" style="--h:${Math.max(3,170*years[y]/max)}px;background:${p.accent}"></div><span>${y}</span></div>`).join(""),confidenceNote=notional?`<div class="confidence-note"><strong>Chapter confidence.</strong> This chapter contains ${notional} explicitly notional early reconstruction${notional===1?'':'s'} and ${confirmed.length} verified or documented record${confirmed.length===1?'':'s'}. The distributions below describe the full archive chapter.</div>`:'';app.innerHTML=`<section class="hero" style="border-top:6px solid ${p.accent}"><div class="kicker">${p.range}</div><h1>${p.title}</h1><div class="deck">${p.deck}</div>${confidenceNote}<div class="stats"><div class="stat"><strong>${ev.length}</strong><span>Archive records</span></div><div class="stat"><strong>${confirmed.length}</strong><span>Confirmed / documented</span></div><div class="stat"><strong>${Object.keys(sports).length}</strong><span>Sports</span></div><div class="stat"><strong>${Object.keys(venues).length}</strong><span>Venues</span></div><div class="stat"><strong>${Object.keys(teams).length}</strong><span>Canonical teams</span></div></div></section><section class="section panel"><div class="kicker">Archive rhythm</div><h2>Records by year</h2><div class="bars">${bars}</div></section><section class="section grid2"><div class="panel"><div class="kicker">Sport mix</div><h2>What filled the chapter</h2>${rows(sports)}</div><div class="panel"><div class="kicker">Teams</div><h2>Most seen</h2>${rows(teams)}</div></section>`})();</script></body></html>
