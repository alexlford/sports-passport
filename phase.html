<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life Chapter | Sports Passport</title><link rel="stylesheet" href="assets/site.css"><style>.bars{display:flex;align-items:flex-end;gap:5px;height:230px;overflow-x:auto}.barwrap{min-width:28px;flex:1;text-align:center}.bar{height:var(--h);min-height:3px;background:var(--red);border-radius:5px 5px 2px 2px}.barwrap span{display:block;font-size:.58rem;color:var(--muted);transform:rotate(-55deg);margin-top:13px}.confidence-note{margin-top:16px;padding:13px 15px;border:1px solid var(--line);border-left:5px solid #725b86;border-radius:14px;background:#fffaf0;color:var(--muted);line-height:1.45}.story{max-width:900px;margin-inline:auto}.story-head{margin-bottom:24px}.story-head h2{font-size:clamp(2rem,5vw,3.6rem);line-height:1.02;margin:.3rem 0}.story-copy{font-size:1.08rem;line-height:1.75}.story-copy p{margin:0 0 1.25em}.pullquote{margin:30px 0 0;padding:22px 24px;border-left:6px solid var(--chapter-accent);background:#fffaf0;border-radius:0 18px 18px 0;font-size:1.3rem;font-weight:800;line-height:1.35}.moments,.traditions,.artifacts-section,.research-section{max-width:1050px;margin-inline:auto}.moment-grid,.tradition-grid,.artifact-grid,.research-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.moment-card,.tradition-card,.artifact-card,.research-card{display:block;padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 8px 24px rgba(20,30,45,.05)}.moment-card,.artifact-card{text-decoration:none;transition:transform .15s ease,box-shadow .15s ease}.moment-card:hover,.artifact-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(20,30,45,.09)}.moment-rank,.tradition-label,.artifact-label,.research-label{font-size:.68rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--chapter-accent)}.moment-card h3,.tradition-card h3,.artifact-card h3,.research-card h3{margin:.35rem 0 .4rem;line-height:1.2}.moment-card p,.tradition-card p,.artifact-card p,.research-card p{margin:0 0 .55rem;color:var(--muted);font-size:.88rem;line-height:1.48}.moment-card .open,.artifact-card .open{display:block;margin-top:12px;font-size:.74rem;font-weight:900}.moments-head,.traditions-head,.artifacts-head,.research-head{margin-bottom:18px}.moments-head p,.traditions-head p,.artifacts-head p,.research-head p{max-width:680px;color:var(--muted)}.tradition-card{border-top:4px solid var(--chapter-accent);background:#fffdf8}.artifact-card{border-top:4px solid #8b5e3c;background:#fffaf0}.artifact-card .artifact-label{color:#8b5e3c}.research-card{border-top:4px solid #725b86;background:#fffdf8}.research-card .research-label{color:#654875}.research-options{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.research-options a{padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;text-decoration:none;font-size:.72rem;font-weight:850}.research-note{margin-top:14px;padding:13px 15px;border-left:5px solid #725b86;border-radius:12px;background:#fffaf0;color:var(--muted);line-height:1.5}@media(max-width:600px){.story-copy{font-size:1rem}.pullquote{font-size:1.12rem;padding:18px}.moment-card,.tradition-card,.artifact-card,.research-card{padding:16px}}</style></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Life Chapter</div><nav class="nav"><a href="/">Archive</a><a href="/journeys/">Journeys</a><a href="/analytics/">Analytics</a><a href="/artifacts/">Artifacts</a></nav></header><div id="app"></div></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,[events,phases,narratives,rankings,artifacts,priorities,venues]=await Promise.all([D.load("events"),D.load("phases"),D.load("phase-narratives"),D.load("curated-rankings"),D.load("artifacts"),D.load("artifact-priorities"),D.load("venues")]);const key=new URLSearchParams(location.search).get("p"),p=phases.find(x=>x.key===key),story=narratives[key],app=document.querySelector("#app");if(!p){app.innerHTML='<section class="hero"><h1>Chapter not found.</h1></section>';return}const ev=D.phaseEvents(events,p),eventIds=new Set(ev.map(e=>e.id)),byId=new Map(events.map(e=>[e.id,e])),chapterMoments=(rankings.sports_experiences||[]).filter(x=>x.event_id&&eventIds.has(x.event_id)),chapterArtifacts=(artifacts||[]).filter(a=>eventIds.has(a.event_id)),chapterResearch=(priorities||[]).filter(x=>x.phase_key===p.key),confirmed=ev.filter(e=>Number(e.year)>=2006||e.attendance_status==="verified"),notional=ev.filter(e=>e.attendance_status==="notional").length,years=D.counts(ev.map(e=>e.year)),sports=D.counts(ev.map(e=>e.sport)),teams=D.counts(ev.flatMap(D.eventTeams)),venueCounts=D.counts(ev.map(e=>e.venue_key).filter(Boolean));document.title=`${p.title} | Sports Passport`;const rows=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,n])=>`<div class="leader"><span>${k}</span><strong>${n}</strong></div>`).join(""),max=Math.max(1,...Object.values(years)),bars=Object.keys(years).map(Number).sort((a,b)=>a-b).map(y=>`<div class="barwrap"><b>${years[y]}</b><div class="bar" style="--h:${Math.max(3,170*years[y]/max)}px;background:${p.accent}"></div><span>${y}</span></div>`).join(""),confidenceNote=notional?`<div class="confidence-note"><strong>Chapter confidence.</strong> This chapter contains ${notional} explicitly notional early reconstruction${notional===1?'':'s'} and ${confirmed.length} verified or documented record${confirmed.length===1?'':'s'}. The distributions below describe the full archive chapter.</div>`:'',storySection=story?`<section class="section story" style="--chapter-accent:${p.accent}"><div class="story-head"><div class="kicker">${story.eyebrow}</div><h2>${story.headline}</h2></div><div class="story-copy">${story.paragraphs.map(x=>`<p>${x}</p>`).join('')}</div><div class="pullquote">${story.pullquote}</div></section>`:'',traditionsSection=story&&Array.isArray(story.traditions)&&story.traditions.length?`<section class="section traditions" style="--chapter-accent:${p.accent}"><div class="traditions-head"><div class="kicker">People & traditions</div><h2>The connections behind the games.</h2><p>Some of the most important parts of this chapter are not scores or venues. They are the people, habits, and traditions that made the experiences matter.</p></div><div class="tradition-grid">${story.traditions.map(t=>`<article class="tradition-card"><span class="tradition-label">${t.label}</span><h3>${t.title}</h3><p>${t.text}</p></article>`).join('')}</div></section>`:'',momentsSection=chapterMoments.length?`<section class="section moments" style="--chapter-accent:${p.accent}"><div class="moments-head"><div class="kicker">Signature moments</div><h2>Games that define this chapter.</h2><p>These chapter events also rank among my Top 10 sports experiences. Each card opens the exact game record; the event passport links onward to its full annual edition.</p></div><div class="moment-grid">${chapterMoments.map(x=>{const e=byId.get(x.event_id);return `<a class="moment-card" href="/events/?event=${encodeURIComponent(e.id)}"><span class="moment-rank">#${x.rank} overall experience</span><h3>${x.title}</h3><p>${x.detail}</p><span class="open">Open exact event passport →</span></a>`}).join('')}</div></section>`:'',artifactSection=chapterArtifacts.length?`<section class="section artifacts-section"><div class="artifacts-head"><div class="kicker">Physical archive</div><h2>Artifacts from this chapter.</h2><p>Surviving tickets, photographs, programs, and keepsakes connect the chapter narrative back to exact events and places.</p></div><div class="artifact-grid">${chapterArtifacts.map(a=>{const e=byId.get(a.event_id),v=e?D.venueByKey(venues,e.venue_key):null;return `<a class="artifact-card" href="/events/?event=${encodeURIComponent(a.event_id)}"><span class="artifact-label">${String(a.type||'artifact').replaceAll('_',' ')} · ${e?.year||''}</span><h3>${a.title}</h3><p>${a.summary}</p><span class="open">${v?.display_name?`${v.display_name} · `:''}Open exact event →</span></a>`}).join('')}</div><p style="margin-top:14px"><a href="/artifacts/"><strong>Open the complete artifact museum →</strong></a></p></section>`:'',researchSection=chapterResearch.length?`<section class="section research-section"><div class="research-head"><div class="kicker">Artifact research</div><h2>Evidence worth looking for in this chapter.</h2><p>These are research priorities, not known physical objects. They stay outside the artifact catalog until a real source is identified and matched.</p></div><div class="research-grid">${chapterResearch.slice().sort((a,b)=>(a.priority||99)-(b.priority||99)).map(r=>{const candidateEvents=(r.event_ids||[]).map(id=>byId.get(id)).filter(Boolean),status=r.status==='needs_exact_event_confirmation'?'Exact event to confirm':r.status==='research_lead'?'Research lead':'Artifact candidate',options=candidateEvents.length>1?`<div class="research-options">${candidateEvents.map(e=>`<a href="/events/?event=${encodeURIComponent(e.id)}">${new Date(e.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</a>`).join('')}</div>`:'',exact=candidateEvents.length===1?`<div class="research-options"><a href="/events/?event=${encodeURIComponent(candidateEvents[0].id)}">Open exact event →</a></div>`:'';return `<article class="research-card"><span class="research-label">${status}</span><h3>${r.title}</h3><p>${r.summary}</p><p><strong>Research note:</strong> ${r.research_note}</p>${options}${exact}</article>`}).join('')}</div><div class="research-note"><strong>Evidence boundary.</strong> A research lead can guide what to look for, but it does not change an event's confidence level and does not become a museum artifact until a real object is identified.</div><p style="margin-top:14px"><a href="/artifacts/"><strong>Open artifact research & collection status →</strong></a></p></section>`:'';app.innerHTML=`<section class="hero" style="border-top:6px solid ${p.accent}"><div class="kicker">${p.range}</div><h1>${p.title}</h1><div class="deck">${p.deck}</div>${confidenceNote}<div class="stats"><div class="stat"><strong>${ev.length}</strong><span>Archive records</span></div><div class="stat"><strong>${confirmed.length}</strong><span>Confirmed / documented</span></div><div class="stat"><strong>${Object.keys(sports).length}</strong><span>Sports</span></div><div class="stat"><strong>${Object.keys(venueCounts).length}</strong><span>Venues</span></div><div class="stat"><strong>${Object.keys(teams).length}</strong><span>Canonical teams</span></div><div class="stat"><strong>${chapterArtifacts.length}</strong><span>Artifacts</span></div><div class="stat"><strong>${chapterResearch.length}</strong><span>Artifact research leads</span></div></div></section>${storySection}${traditionsSection}${momentsSection}${artifactSection}${researchSection}<section class="section panel"><div class="kicker">Archive rhythm</div><h2>Records by year</h2><div class="bars">${bars}</div></section><section class="section grid2"><div class="panel"><div class="kicker">Sport mix</div><h2>What filled the chapter</h2>${rows(sports)}</div><div class="panel"><div class="kicker">Teams</div><h2>Most seen</h2>${rows(teams)}</div></section>`})();</script><script src="assets/clean-urls.js"></script></body></html>
