<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Annual Editions | Sports Passport</title><style>:root{--paper:#f4ecdc;--ink:#112b3c;--muted:#736d64;--line:rgba(17,43,60,.16);--red:#b7443a;--serif:Georgia,serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}a{color:inherit}.shell{max-width:1200px;margin:auto;padding:22px}.hero{padding:60px 0 30px}.hero h1{font:900 clamp(4rem,10vw,8rem)/.82 var(--serif);margin:.15em 0}.deck{max-width:760px;font:1.25rem/1.6 var(--serif);color:#315064}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:30px 0 60px}.card{display:block;min-height:160px;padding:18px;border:1px solid var(--line);border-radius:18px;background:#fffdf8;text-decoration:none}.card strong{display:block;font:900 2.4rem/1 var(--serif)}.card span{display:block;color:var(--muted);margin-top:8px}.card b{display:block;margin-top:20px;font-size:.7rem;color:var(--red);text-transform:uppercase}.card.current{border-top:5px solid var(--red);background:linear-gradient(145deg,#fffdf8,#f2e6d2)}.status{display:inline-block!important;width:auto;margin:0 0 12px!important;padding:5px 9px;border-radius:999px;background:var(--red);color:white!important;font-size:.62rem!important;font-weight:900;letter-spacing:.1em;text-transform:uppercase}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><main class="shell"><header><b>Sports Passport · Annual Editions</b> · <a href="index.html">Archive</a></header><section class="hero"><h1>Year by<br>year.</h1><div class="deck">This archive list is generated directly from the event database. The current season stays visibly in progress until it is closed out.</div></section><div class="grid" id="grid"></div></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,[events,config]=await Promise.all([D.load("events"),D.load("config")]);const counts=D.counts(events.map(e=>e.year)),years=[...new Set([...events.map(e=>Number(e.year)),Number(config.current_year||0)].filter(Boolean))].sort((a,b)=>b-a),grid=document.querySelector("#grid"),current=Number(config.current_year);years.forEach(y=>{const n=counts[y]||0,a=document.createElement("a"),isCurrent=y===current;a.className="card"+(isCurrent?" current":"");a.href=`year.html?y=${y}`;a.innerHTML=`${isCurrent?'<span class="status">In progress</span>':''}<strong>${y}</strong><span>${n} documented event${n===1?"":"s"}</span><b>${isCurrent?(n?"Open live annual edition →":"Current year · ready for events →"):"Open annual edition →"}</b>`;grid.appendChild(a)})})();</script></body></html>
