<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Artifacts | Sports Passport</title>
  <meta name="description" content="Ticket stubs, credentials, programs, seat views, keepsakes, and other physical evidence from Alex Ford's Sports Passport archive.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="assets/site.css">
  <style>
    .artifact-hero{border-top:7px solid #8b5e3c}.artifact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.artifact-card{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:#fffdf8}.artifact-image{min-height:210px;display:grid;place-items:center;padding:24px;background:repeating-linear-gradient(135deg,#f7efdf,#f7efdf 16px,#efe3cf 16px,#efe3cf 32px);border-bottom:1px solid var(--line);text-align:center}.artifact-image span{max-width:180px;color:var(--muted);font-size:.76rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;line-height:1.45}.artifact-image img{width:100%;height:100%;max-height:360px;object-fit:contain}.artifact-body{padding:20px}.artifact-body h3{margin:.35rem 0 .55rem;font-size:1.45rem}.artifact-body p{margin:.45rem 0;color:var(--muted);line-height:1.55}.artifact-meta{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.artifact-chip{display:inline-flex;align-items:center;min-height:30px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:.66rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em}.artifact-chip.evidence{background:#e6f2e9;color:#255d38}.artifact-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}.artifact-actions a{font-weight:900;text-underline-offset:3px}.method{margin-top:20px;padding:16px 18px;border-left:5px solid #8b5e3c;border-radius:14px;background:#fffaf0;color:var(--muted);line-height:1.6}.artifact-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.artifact-filters{display:flex;gap:8px;flex-wrap:wrap}.artifact-filters button{min-height:44px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:#fffdf8;font-weight:850;cursor:pointer}.artifact-filters button.active{background:var(--ink);color:#fff}.artifact-search{width:min(390px,100%);min-height:44px;padding:10px 13px;border:1px solid var(--line);border-radius:999px;background:#fffdf8;font:inherit}.artifact-summary{color:var(--muted);font-size:.78rem;font-weight:800}.artifact-empty{grid-column:1/-1;padding:36px;border:1px dashed var(--line);border-radius:20px;background:#fffaf0;color:var(--muted);text-align:center}.hidden{display:none!important}
    .coverage-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.coverage-card{padding:18px;border:1px solid var(--line);border-radius:18px;background:#fffdf8}.coverage-card strong{display:block;font:900 2rem/1 var(--serif)}.coverage-card span{display:block;margin-top:8px;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}.queue-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.queue-card{padding:18px;border:1px solid var(--line);border-radius:18px;background:#fffdf8}.queue-card.pending{border-top:5px solid #8b5e3c}.queue-card.candidate{border-top:5px solid #c49b48}.queue-card.complete{border-top:5px solid #477a55}.queue-card h3{margin:.4rem 0 .5rem;font-size:1.18rem}.queue-card p{margin:.35rem 0;color:var(--muted);font-size:.86rem;line-height:1.5}.queue-card a{display:inline-block;margin-top:10px;font-weight:900;text-underline-offset:3px}.queue-note{margin:16px 0 0;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fffaf0;color:var(--muted);line-height:1.55}.priority{display:inline-flex;padding:4px 8px;border-radius:999px;background:#f4e6ce;color:#76520b;font-size:.64rem;font-weight:950;letter-spacing:.06em;text-transform:uppercase}.queue-section .head p{max-width:650px}
    @media(max-width:850px){.coverage-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.artifact-grid{grid-template-columns:1fr}.artifact-image{min-height:170px}.artifact-controls{align-items:stretch}.artifact-search{width:100%}.artifact-filters{overflow-x:auto;flex-wrap:nowrap;padding-bottom:3px}.artifact-filters button{white-space:nowrap}.queue-grid{grid-template-columns:1fr}}@media(max-width:430px){.coverage-grid{grid-template-columns:1fr 1fr}.coverage-card{padding:15px}.coverage-card strong{font-size:1.65rem}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top"><div class="brand">Sports Passport · Artifacts</div><nav class="nav"><a href="index.html">Archive</a><a href="annuals.html">Years</a><a href="favorites.html">Top Tens</a><a href="about.html">About</a></nav></header>
  <div id="app"></div>
</main>
<script src="assets/sports-passport-data.js"></script>
<script>
(async()=>{
  const D=window.SportsPassportData;
  const [artifacts,events,venues,rankings]=await Promise.all([D.load('artifacts'),D.load('events'),D.load('venues'),D.load('curated-rankings')]);
  const byId=new Map(events.map(e=>[e.id,e]));
  const ranked=(rankings.sports_experiences||[]).slice().sort((a,b)=>a.rank-b.rank);
  const rankedById=new Map(ranked.map(r=>[r.event_id,r]));
  const linked=artifacts.map(a=>({...a,event:byId.get(a.event_id)})).filter(a=>a.event);
  const artifactEventIds=new Set(linked.map(a=>a.event_id));
  const digitized=linked.filter(a=>a.media).length;
  const pending=linked.filter(a=>!a.media);
  const years=[...new Set(linked.map(a=>a.event.year))];
  const venueCount=new Set(linked.map(a=>a.event.venue_key).filter(Boolean)).size;
  const topTenCovered=ranked.filter(r=>artifactEventIds.has(r.event_id)).length;
  const topTenCandidates=ranked.filter(r=>!artifactEventIds.has(r.event_id));
  const typeLabel=t=>({ticket_stub:'Ticket stub',credential:'Credential',program:'Program',seat_view:'Seat view',keepsake:'Keepsake',photo:'Photo'}[t]||'Artifact');
  const types=[...new Set(linked.map(a=>a.type))].sort();
  const cards=linked.sort((a,b)=>a.event.date.localeCompare(b.event.date)).map(a=>{
    const e=a.event,venue=D.venueByKey(venues,e.venue_key),rank=rankedById.get(e.id),eventHref=`event.html?id=${encodeURIComponent(e.id)}`,venueHref=venue?.slug?`venue-profile.html?v=${encodeURIComponent(venue.slug)}`:null;
    const image=a.media?`<img src="${a.media}" alt="${a.title}">`:`<span>Cataloged artifact<br>Image pending digitization</span>`;
    const status=a.media?'digitized':'pending';
    const search=[a.title,a.summary,a.provenance,typeLabel(a.type),e.year,D.matchup(e),venue?.display_name,e.city].filter(Boolean).join(' ').toLowerCase();
    return `<article class="artifact-card" data-type="${a.type}" data-status="${status}" data-search="${search}"><div class="artifact-image">${image}</div><div class="artifact-body"><div class="kicker">${e.year} · ${typeLabel(a.type)}</div><h3>${a.title}</h3><div class="artifact-meta"><span class="artifact-chip evidence">Archive evidence</span>${rank?`<span class="artifact-chip">Top 10 · #${rank.rank}</span>`:''}<span class="artifact-chip">${a.media?'Digitized':'Image pending'}</span></div><p>${a.summary}</p><p><strong>Provenance:</strong> ${a.provenance}</p><div class="artifact-actions"><a href="${eventHref}">Open exact event →</a>${venueHref?`<a href="${venueHref}">${venue.display_name} →</a>`:''}</div></div></article>`;
  }).join('');
  const filters=['All',...types.map(typeLabel),'Digitized','Image pending'];
  const pendingQueue=pending.map(a=>{const e=a.event,rank=rankedById.get(e.id);return `<article class="queue-card pending"><span class="priority">Digitize next</span><h3>${a.title}</h3><p>${e.year} · ${D.matchup(e)}${rank?` · Top 10 #${rank.rank}`:''}</p><p>The physical object is already cataloged. The remaining step is adding a real scan or photograph.</p><a href="event.html?id=${encodeURIComponent(e.id)}">Open event passport →</a></article>`}).join('');
  const canonQueue=ranked.map(r=>{const e=byId.get(r.event_id),hasArtifact=artifactEventIds.has(r.event_id),artifact=linked.find(a=>a.event_id===r.event_id);return `<article class="queue-card ${hasArtifact?'complete':'candidate'}"><span class="priority">Top 10 · #${r.rank}</span><h3>${r.title}</h3><p>${r.detail}</p>${hasArtifact?`<p><strong>Coverage:</strong> ${artifact?.media?'Artifact digitized':'Artifact cataloged; image pending.'}</p>`:`<p><strong>Coverage:</strong> No artifact is currently cataloged for this event.</p><p>Candidate for a future ticket, credential, program, seat-view photo, or other known source if one is found.</p>`}<a href="event.html?id=${encodeURIComponent(r.event_id)}">Open exact event →</a></article>`}).join('');
  document.querySelector('#app').innerHTML=`<section class="hero artifact-hero"><div class="kicker">The physical archive</div><h1>Artifacts</h1><div class="deck">Ticket stubs, credentials, programs, photographs, seat views, and keepsakes that connect the data record to something tangible.</div><div class="stats"><div class="stat"><strong>${linked.length}</strong><span>Cataloged artifacts</span></div><div class="stat"><strong>${digitized}</strong><span>Images digitized</span></div><div class="stat"><strong>${years.length}</strong><span>Years represented</span></div><div class="stat"><strong>${venueCount}</strong><span>Venues represented</span></div><div class="stat"><strong>${topTenCovered}/10</strong><span>Top 10 with artifacts</span></div></div><div class="method"><strong>Artifact policy.</strong> The catalog only lists objects or evidence known to exist. A visual is shown only after an actual source file has been added; otherwise the item remains transparently marked as awaiting digitization. Candidate moments below are collection priorities, not claims that an object exists.</div></section>
  <section class="section queue-section"><div class="head"><div><div class="kicker">Collection status</div><h2>What is cataloged, digitized, and still worth finding.</h2></div><p>The physical archive now distinguishes between known objects waiting to be scanned and important events where no artifact has yet been identified.</p></div><div class="coverage-grid"><div class="coverage-card"><strong>${linked.length}</strong><span>Known objects</span></div><div class="coverage-card"><strong>${pending.length}</strong><span>Awaiting digitization</span></div><div class="coverage-card"><strong>${digitized}</strong><span>Digitized objects</span></div><div class="coverage-card"><strong>${topTenCandidates.length}</strong><span>Top 10 candidates</span></div></div>${pending.length?`<div class="head" style="margin-top:34px"><div><div class="kicker">Digitization queue</div><h2>Known objects to scan next.</h2></div><p>These are already cataloged physical artifacts. Adding the source image will automatically upgrade their museum case and every connected archive view.</p></div><div class="queue-grid">${pendingQueue}</div>`:''}<div class="head" style="margin-top:42px"><div><div class="kicker">Personal Canon coverage</div><h2>Artifact coverage across the Top 10.</h2></div><p>This is a research and collection queue. “Candidate” means an artifact would strengthen the story if a real source can be found; it does not imply one is currently owned or known to exist.</p></div><div class="queue-grid">${canonQueue}</div><div class="queue-note"><strong>Collection principle.</strong> Sports Passport should prefer provenance over decoration. A real ticket, credential, program, photo, or keepsake can be attached later without changing the event record; until then, the archive stays explicit about what is known and what is merely worth looking for.</div></section>
  <section class="section"><div class="head"><div><div class="kicker">Museum cases</div><h2>Cataloged evidence & keepsakes.</h2></div><p>Filter by artifact type or digitization status, or search by year, game, venue, provenance, or object title.</p></div><div class="artifact-controls"><div class="artifact-filters">${filters.map((label,i)=>`<button type="button" class="${i===0?'active':''}" data-artifact-filter="${label}">${label}</button>`).join('')}</div><input class="artifact-search" id="artifact-q" type="search" placeholder="Search artifacts, games, venues…" aria-label="Search artifacts"><div class="artifact-summary" id="artifact-summary">${linked.length} shown</div></div><div class="artifact-grid" id="artifact-grid">${cards||'<div class="artifact-empty">No artifacts cataloged yet.</div>'}<div class="artifact-empty hidden" id="artifact-empty">No artifacts match this filter.</div></div></section>`;
  let active='All';
  const buttons=[...document.querySelectorAll('[data-artifact-filter]')],items=[...document.querySelectorAll('.artifact-card')],q=document.querySelector('#artifact-q'),summary=document.querySelector('#artifact-summary'),empty=document.querySelector('#artifact-empty');
  function matchesFilter(card){
    if(active==='All')return true;
    if(active==='Digitized')return card.dataset.status==='digitized';
    if(active==='Image pending')return card.dataset.status==='pending';
    const type=types.find(t=>typeLabel(t)===active);
    return !type||card.dataset.type===type;
  }
  function apply(){
    const query=(q?.value||'').trim().toLowerCase();let shown=0;
    items.forEach(card=>{const show=matchesFilter(card)&&(!query||card.dataset.search.includes(query));card.classList.toggle('hidden',!show);if(show)shown++});
    if(summary)summary.textContent=`${shown} of ${items.length} shown`;
    if(empty)empty.classList.toggle('hidden',shown!==0);
  }
  buttons.forEach(button=>button.addEventListener('click',()=>{active=button.dataset.artifactFilter;buttons.forEach(x=>x.classList.toggle('active',x===button));apply()}));
  q?.addEventListener('input',apply);
  apply();
})();
</script>
<script src="assets/clean-urls.js"></script>
</body>
</html>
