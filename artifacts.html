<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Artifacts | Sports Passport</title>
  <meta name="description" content="Ticket stubs, credentials, programs, seat views, keepsakes, and other physical evidence from Alex Ford's Sports Passport archive.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="assets/site.css">
  <style>
    .artifact-hero{border-top:7px solid #8b5e3c}.artifact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.artifact-card{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:#fffdf8}.artifact-image{min-height:210px;display:grid;place-items:center;padding:24px;background:repeating-linear-gradient(135deg,#f7efdf,#f7efdf 16px,#efe3cf 16px,#efe3cf 32px);border-bottom:1px solid var(--line);text-align:center}.artifact-image span{max-width:180px;color:var(--muted);font-size:.76rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;line-height:1.45}.artifact-image img{width:100%;height:100%;max-height:360px;object-fit:contain}.artifact-body{padding:20px}.artifact-body h3{margin:.35rem 0 .55rem;font-size:1.45rem}.artifact-body p{margin:.45rem 0;color:var(--muted);line-height:1.55}.artifact-meta{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.artifact-chip{display:inline-flex;align-items:center;min-height:30px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:.66rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em}.artifact-chip.evidence{background:#e6f2e9;color:#255d38}.artifact-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}.artifact-actions a{font-weight:900;text-underline-offset:3px}.method{margin-top:20px;padding:16px 18px;border-left:5px solid #8b5e3c;border-radius:14px;background:#fffaf0;color:var(--muted);line-height:1.6}.artifact-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.artifact-filters{display:flex;gap:8px;flex-wrap:wrap}.artifact-filters button{min-height:44px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:#fffdf8;font-weight:850;cursor:pointer}.artifact-filters button.active{background:var(--ink);color:#fff}.artifact-search{width:min(390px,100%);min-height:44px;padding:10px 13px;border:1px solid var(--line);border-radius:999px;background:#fffdf8;font:inherit}.artifact-summary{color:var(--muted);font-size:.78rem;font-weight:800}.artifact-empty{grid-column:1/-1;padding:36px;border:1px dashed var(--line);border-radius:20px;background:#fffaf0;color:var(--muted);text-align:center}.hidden{display:none!important}@media(max-width:650px){.artifact-grid{grid-template-columns:1fr}.artifact-image{min-height:170px}.artifact-controls{align-items:stretch}.artifact-search{width:100%}.artifact-filters{overflow-x:auto;flex-wrap:nowrap;padding-bottom:3px}.artifact-filters button{white-space:nowrap}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top"><div class="brand">Sports Passport · Artifacts</div><nav class="nav"><a href="index.html">Archive</a><a href="annuals.html">Years</a><a href="favorites.html">Top Tens</a><a href="about.html">About</a></nav></header>
  <div id="app"></div>
</main>
<script src="assets/sports-passport-data.js"></script>
<script>
(async()=>{
  const D=window.SportsPassportData;
  const [artifacts,events,venues,rankings]=await Promise.all([D.load('artifacts'),D.load('events'),D.load('venues'),D.load('curated-rankings')]);
  const byId=new Map(events.map(e=>[e.id,e]));
  const rankedById=new Map((rankings.sports_experiences||[]).map(r=>[r.event_id,r]));
  const linked=artifacts.map(a=>({...a,event:byId.get(a.event_id)})).filter(a=>a.event);
  const digitized=linked.filter(a=>a.media).length;
  const years=[...new Set(linked.map(a=>a.event.year))];
  const venueCount=new Set(linked.map(a=>a.event.venue_key).filter(Boolean)).size;
  const typeLabel=t=>({ticket_stub:'Ticket stub',credential:'Credential',program:'Program',seat_view:'Seat view',keepsake:'Keepsake',photo:'Photo'}[t]||'Artifact');
  const types=[...new Set(linked.map(a=>a.type))].sort();
  const cards=linked.sort((a,b)=>a.event.date.localeCompare(b.event.date)).map(a=>{
    const e=a.event,venue=D.venueByKey(venues,e.venue_key),rank=rankedById.get(e.id),eventHref=`event.html?id=${encodeURIComponent(e.id)}`,venueHref=venue?.slug?`venue-profile.html?v=${encodeURIComponent(venue.slug)}`:null;
    const image=a.media?`<img src="${a.media}" alt="${a.title}">`:`<span>Cataloged artifact<br>Image pending digitization</span>`;
    const status=a.media?'digitized':'pending';
    const search=[a.title,a.summary,a.provenance,typeLabel(a.type),e.year,D.matchup(e),venue?.display_name,e.city].filter(Boolean).join(' ').toLowerCase();
    return `<article class="artifact-card" data-type="${a.type}" data-status="${status}" data-search="${search}"><div class="artifact-image">${image}</div><div class="artifact-body"><div class="kicker">${e.year} · ${typeLabel(a.type)}</div><h3>${a.title}</h3><div class="artifact-meta"><span class="artifact-chip evidence">Archive evidence</span>${rank?`<span class="artifact-chip">Top 10 · #${rank.rank}</span>`:''}<span class="artifact-chip">${a.media?'Digitized':'Image pending'}</span></div><p>${a.summary}</p><p><strong>Provenance:</strong> ${a.provenance}</p><div class="artifact-actions"><a href="${eventHref}">Open exact event →</a>${venueHref?`<a href="${venueHref}">${venue.display_name} →</a>`:''}</div></div></article>`;
  }).join('');
  const filters=['All',...types.map(typeLabel),'Digitized','Image pending'];
  document.querySelector('#app').innerHTML=`<section class="hero artifact-hero"><div class="kicker">The physical archive</div><h1>Artifacts</h1><div class="deck">Ticket stubs, credentials, programs, photographs, seat views, and keepsakes that connect the data record to something tangible.</div><div class="stats"><div class="stat"><strong>${linked.length}</strong><span>Cataloged artifacts</span></div><div class="stat"><strong>${digitized}</strong><span>Images digitized</span></div><div class="stat"><strong>${years.length}</strong><span>Years represented</span></div><div class="stat"><strong>${venueCount}</strong><span>Venues represented</span></div></div><div class="method"><strong>Artifact policy.</strong> The catalog only lists objects or evidence known to exist. A visual is shown only after an actual source file has been added; otherwise the item remains transparently marked as awaiting digitization.</div></section><section class="section"><div class="head"><div><div class="kicker">Museum cases</div><h2>Cataloged evidence & keepsakes.</h2></div><p>Filter by artifact type or digitization status, or search by year, game, venue, provenance, or object title.</p></div><div class="artifact-controls"><div class="artifact-filters">${filters.map((label,i)=>`<button type="button" class="${i===0?'active':''}" data-artifact-filter="${label}">${label}</button>`).join('')}</div><input class="artifact-search" id="artifact-q" type="search" placeholder="Search artifacts, games, venues…" aria-label="Search artifacts"><div class="artifact-summary" id="artifact-summary">${linked.length} shown</div></div><div class="artifact-grid" id="artifact-grid">${cards||'<div class="artifact-empty">No artifacts cataloged yet.</div>'}<div class="artifact-empty hidden" id="artifact-empty">No artifacts match this filter.</div></div></section>`;
  let active='All';
  const buttons=[...document.querySelectorAll('[data-artifact-filter]')],items=[...document.querySelectorAll('.artifact-card')],q=document.querySelector('#artifact-q'),summary=document.querySelector('#artifact-summary'),empty=document.querySelector('#artifact-empty');
  function matchesFilter(card){
    if(active==='All')return true;
    if(active==='Digitized')return card.dataset.status==='digitized';
    if(active==='Image pending')return card.dataset.status==='pending';
    const type=types.find(t=>typeLabel(t)===active);
    return !type||card.dataset.type===type;
  }
  function apply(){
    const query=(q?.value||'').trim().toLowerCase();let shown=0;
    items.forEach(card=>{const show=matchesFilter(card)&&(!query||card.dataset.search.includes(query));card.classList.toggle('hidden',!show);if(show)shown++});
    if(summary)summary.textContent=`${shown} of ${items.length} shown`;
    if(empty)empty.classList.toggle('hidden',shown!==0);
  }
  buttons.forEach(button=>button.addEventListener('click',()=>{active=button.dataset.artifactFilter;buttons.forEach(x=>x.classList.toggle('active',x===button));apply()}));
  q?.addEventListener('input',apply);
  apply();
})();
</script>
</body>
</html>
