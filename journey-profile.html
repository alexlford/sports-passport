<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journey | Sports Passport</title><link rel="stylesheet" href="assets/site.css"><style>.confidence-note{margin-top:16px;padding:13px 15px;border:1px solid var(--line);border-left:5px solid #725b86;border-radius:14px;background:#fffaf0;color:var(--muted);line-height:1.45}.event-confidence{display:inline-block;margin-left:7px;padding:2px 6px;border-radius:999px;background:#eee8f2;color:#654875;font-size:.62rem;font-weight:900;text-transform:uppercase}.signature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.signature{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;padding:18px;border:1px solid var(--line);border-top:5px solid #c49b48;border-radius:18px;background:#fffdf8;text-decoration:none}.signature-rank{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-weight:950}.signature h3{margin:2px 0 6px;font-size:1.2rem}.signature p{margin:0;color:var(--muted)}.event a{color:inherit;text-decoration:none}.event a:hover,.event a:focus-visible{text-decoration:underline}.top10{display:inline-block;margin-left:7px;padding:2px 6px;border-radius:999px;background:#fff4cf;color:#72580c;font-size:.62rem;font-weight:900;text-transform:uppercase}@media(max-width:700px){.signature-grid{grid-template-columns:1fr}}</style></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Journey</div><nav class="nav"><a href="journeys.html">All Journeys</a><a href="index.html">Archive</a></nav></header><div id="app"></div></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,[events,journeys,venues,rankings]=await Promise.all([D.load("events"),D.load("journeys"),D.load("venues"),D.load("curated-rankings")]);const key=new URLSearchParams(location.search).get("j"),j=journeys.find(x=>x.key===key),app=document.querySelector("#app");if(!j){app.innerHTML='<section class="hero"><h1>Journey not found.</h1></section>';return}const ev=D.journeyEvents(events,j).sort((a,b)=>a.date.localeCompare(b.date)),confirmed=ev.filter(D.isConfirmedEvent),notional=ev.filter(D.isNotionalEvent).length,yrs=ev.map(e=>e.year),byId=new Map(ev.map(e=>[e.id,e])),rankByEvent=new Map((rankings.sports_experiences||[]).filter(r=>byId.has(r.event_id)).map(r=>[r.event_id,r])),signature=(rankings.sports_experiences||[]).filter(r=>byId.has(r.event_id)).sort((a,b)=>a.rank-b.rank);document.title=`${j.title} | Sports Passport`;const timeline=ev.map(e=>{const rank=rankByEvent.get(e.id),v=venues.find(x=>x.key===e.venue_key),venueText=v?.display_name||e.venue_recorded||'Venue not recorded',venueHref=v?.slug?`venue-profile.html?v=${encodeURIComponent(v.slug)}`:null;return `<div class="event"><div class="event-year"><a href="year.html?y=${e.year}">${e.year}</a></div><div><b><a href="year.html?y=${e.year}">${D.matchup(e)} ${D.score(e)}</a></b>${rank?`<span class="top10">Top 10 #${rank.rank}</span>`:''}${D.isNotionalEvent(e)?'<span class="event-confidence">Notional</span>':''}<small>${e.date} · ${venueHref?`<a href="${venueHref}">${venueText}</a>`:venueText} · ${e.city}</small></div></div>`}).join(""),confidenceNote=notional?`<div class="confidence-note"><strong>Journey confidence.</strong> ${notional} event${notional===1?' is':'s are'} part of the explicitly notional pre-2006 reconstruction. The timeline keeps those records visible but labels them rather than treating them as confirmed attendance.</div>`:'';const signatures=signature.length?`<section class="section"><div class="head"><div><div class="kicker">Signature moments</div><h2>Top 10 experiences in this thread.</h2></div><p>Curated favorites that also belong to this recurring journey.</p></div><div class="signature-grid">${signature.map(r=>{const e=byId.get(r.event_id);return `<a class="signature" href="year.html?y=${e.year}"><span class="signature-rank">${r.rank}</span><div><div class="kicker">Top 10 sports experience</div><h3>${r.title}</h3><p>${r.detail||`${D.matchup(e)} · ${e.year}`}</p></div></a>`}).join('')}</div></section>`:'';app.innerHTML=`<section class="hero"><div class="kicker">Recurring story thread</div><h1>${j.title}</h1><div class="deck">${j.description}</div>${confidenceNote}<div class="stats"><div class="stat"><strong>${ev.length}</strong><span>Archive records</span></div><div class="stat"><strong>${confirmed.length}</strong><span>Confirmed / documented</span></div><div class="stat"><strong>${yrs.length?Math.min(...yrs):"—"}–${yrs.length?Math.max(...yrs):"—"}</strong><span>Span</span></div><div class="stat"><strong>${new Set(ev.map(e=>e.venue_key).filter(Boolean)).size}</strong><span>Venues</span></div><div class="stat"><strong>${signature.length}</strong><span>Top 10 moments</span></div></div></section>${signatures}<section class="section panel"><div class="kicker">Timeline</div><h2>The thread, event by event.</h2><p class="density-note">Years open annual editions; venue names open venue profiles; Top 10 experiences are marked inline.</p>${timeline||"<p>No events yet.</p>"}</section>`})();</script></body></html>
