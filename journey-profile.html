<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journey | Sports Passport</title><link rel="stylesheet" href="assets/site.css"><style>.confidence-note{margin-top:16px;padding:13px 15px;border:1px solid var(--line);border-left:5px solid #725b86;border-radius:14px;background:#fffaf0;color:var(--muted);line-height:1.45}.event-confidence{display:inline-block;margin-left:7px;padding:2px 6px;border-radius:999px;background:#eee8f2;color:#654875;font-size:.62rem;font-weight:900;text-transform:uppercase}</style></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Journey</div><nav class="nav"><a href="journeys.html">All Journeys</a><a href="index.html">Archive</a></nav></header><div id="app"></div></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,[events,journeys]=await Promise.all([D.load("events"),D.load("journeys")]);const key=new URLSearchParams(location.search).get("j"),j=journeys.find(x=>x.key===key),app=document.querySelector("#app");if(!j){app.innerHTML='<section class="hero"><h1>Journey not found.</h1></section>';return}const ev=D.journeyEvents(events,j).sort((a,b)=>a.date.localeCompare(b.date)),confirmed=ev.filter(e=>Number(e.year)>=2006||e.attendance_status==="verified"),notional=ev.filter(e=>e.attendance_status==="notional").length,yrs=ev.map(e=>e.year);document.title=`${j.title} | Sports Passport`;const timeline=ev.map(e=>`<div class="event"><div class="event-year">${e.year}</div><div><b>${D.matchup(e)} ${D.score(e)}</b>${e.attendance_status==="notional"?'<span class="event-confidence">Notional</span>':''}<small>${e.date} · ${e.venue_recorded} · ${e.city}</small></div></div>`).join(""),confidenceNote=notional?`<div class="confidence-note"><strong>Journey confidence.</strong> ${notional} event${notional===1?' is':'s are'} part of the explicitly notional pre-2006 reconstruction. The timeline keeps those records visible but labels them rather than treating them as confirmed attendance.</div>`:'';app.innerHTML=`<section class="hero"><div class="kicker">Dynamic journey</div><h1>${j.title}</h1><div class="deck">${j.description}</div>${confidenceNote}<div class="stats"><div class="stat"><strong>${ev.length}</strong><span>Archive records</span></div><div class="stat"><strong>${confirmed.length}</strong><span>Confirmed / documented</span></div><div class="stat"><strong>${yrs.length?Math.min(...yrs):"—"}–${yrs.length?Math.max(...yrs):"—"}</strong><span>Span</span></div><div class="stat"><strong>${new Set(ev.map(e=>e.venue_key).filter(Boolean)).size}</strong><span>Venues</span></div><div class="stat"><strong>${new Set(ev.map(e=>e.city).filter(Boolean)).size}</strong><span>Cities</span></div></div></section><section class="section panel"><div class="kicker">Timeline</div><h2>The thread, event by event.</h2><p class="density-note">Source event wording remains intact. Notional early records are explicitly marked.</p>${timeline||"<p>No events yet.</p>"}</section>`})();</script></body></html>
