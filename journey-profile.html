<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journey | Sports Passport</title><link rel="stylesheet" href="assets/site.css"></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Journey</div><nav class="nav"><a href="journeys.html">All Journeys</a><a href="index.html">Archive</a></nav></header><div id="app"></div></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,[events,journeys]=await Promise.all([D.load("events"),D.load("journeys")]);const key=new URLSearchParams(location.search).get("j"),j=journeys.find(x=>x.key===key),app=document.querySelector("#app");if(!j){app.innerHTML='<section class="hero"><h1>Journey not found.</h1></section>';return}const ev=D.journeyEvents(events,j).sort((a,b)=>a.date.localeCompare(b.date)),yrs=ev.map(e=>e.year);document.title=`${j.title} | Sports Passport`;const timeline=ev.map(e=>`<div class="event"><div class="event-year">${e.year}</div><div><b>${D.matchup(e)} ${D.score(e)}</b><small>${e.date} · ${e.venue_recorded} · ${e.city}</small></div></div>`).join("");app.innerHTML=`<section class="hero"><div class="kicker">Dynamic journey</div><h1>${j.title}</h1><div class="deck">${j.description}</div><div class="stats"><div class="stat"><strong>${ev.length}</strong><span>Events</span></div><div class="stat"><strong>${yrs.length?Math.min(...yrs):"—"}–${yrs.length?Math.max(...yrs):"—"}</strong><span>Span</span></div><div class="stat"><strong>${new Set(ev.map(e=>e.venue_key)).size}</strong><span>Venues</span></div><div class="stat"><strong>${new Set(ev.map(e=>e.city)).size}</strong><span>Cities</span></div><div class="stat"><strong>${new Set(ev.map(e=>e.sport)).size}</strong><span>Sports</span></div></div></section><section class="section panel"><div class="kicker">Timeline</div><h2>The thread, event by event.</h2>${timeline||"<p>No events yet.</p>"}</section>`})();</script></body></html>
