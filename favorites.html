<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Favorite Sports Experiences | Sports Passport</title><meta name="description" content="Alex Ford's favorite games and live sports experiences, connected to the Sports Passport archive."><link rel="canonical" href="https://sports.alexlford.com/favorites.html"><link rel="stylesheet" href="assets/site.css"><link rel="stylesheet" href="assets/favorites.css"></head><body><main class="shell"><header class="site-header"><div class="brand"><a href="index.html">Sports Passport</a></div></header><div id="app"></div><footer class="site-footer"></footer></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,[favorites,events]=await Promise.all([D.load('favorite-experiences'),D.load('events')]);const byId=new Map(events.map(e=>[e.id,e])),app=document.querySelector('#app');const cards=favorites.map(f=>{const e=f.event_id?byId.get(f.event_id):null;const eventDetail=e?`${e.date} · ${D.matchup(e)}${D.score(e)?` · ${D.score(e)}`:''} · ${e.venue_recorded}`:`${f.year}${f.date?` · ${f.date}`:''}`;const annual=`year.html?y=${f.year}`;const sourceLink=f.source_url?`<a href="${f.source_url}" target="_blank" rel="noopener">${f.source_label||'Source'} ↗</a>`:'';return `<article class="fav-card sport-${f.category.toLowerCase()}" id="${f.key}" data-year="${f.year}" data-sport="${f.category}"><div class="kicker">${f.label}</div><h2>${f.title}</h2><div class="fav-meta"><span class="fav-chip">${f.category}</span><span class="fav-chip">${f.year}</span>${e?'<span class="fav-chip">Archive matched</span>':'<span class="fav-chip">Personal memory</span>'}</div><p>${f.description}</p><p><strong>${eventDetail}</strong></p>${f.note?`<div class="fav-note">${f.note}</div>`:''}<div class="fav-actions">${e?`<a class="primary" href="${annual}">Open ${f.year} annual →</a>`:''}${sourceLink}${f.verification_url?`<a href="${f.verification_url}" target="_blank" rel="noopener">Event source ↗</a>`:''}</div></article>`}).join('');app.innerHTML=`<section class="hero"><div class="kicker">Personal canon</div><h1>Favorite<br>Experiences</h1><div class="deck">The games and sports moments that stand above the rest. This is Alex's curated list, not a visitor ballot.</div><div class="stats"><div class="stat"><strong>${favorites.length}</strong><span>Signature experiences</span></div><div class="stat"><strong>${favorites.filter(f=>f.event_id&&byId.has(f.event_id)).length}</strong><span>Archive matched</span></div><div class="stat"><strong>${Math.min(...favorites.map(f=>f.year))}</strong><span>Earliest favorite</span></div><div class="stat"><strong>${Math.max(...favorites.map(f=>f.year))}</strong><span>Latest favorite</span></div><div class="stat"><strong>Alex</strong><span>Selection basis</span></div></div></section><section class="section"><div class="head"><div><div class="kicker">The short list</div><h2>Games I still talk about.</h2></div><p>These are personal selections layered on top of the objective attendance archive.</p></div><div class="fav-grid">${cards}</div><div class="source-note"><strong>Source policy.</strong> Favorites can come from alexlford.com or direct user confirmation. When a favorite maps to a documented Sports Passport event, it is tied to that exact archive entry. Illinois at the 2026 Final Four is matched to the April 4, 2026 Illinois–UConn national semifinal at Lucas Oil Stadium.</div></section>`})();</script></body></html>
