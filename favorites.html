<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Canon | Sports Passport</title><meta name="description" content="Alex Ford's curated top sports experiences, favorite venues, and best venues visited."><link rel="canonical" href="https://sports.alexlford.com/favorites.html"><link rel="stylesheet" href="assets/site.css"><link rel="stylesheet" href="assets/favorites.css"><style>.ranking-intro{max-width:760px}.ranking-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.ranking-panel{scroll-margin-top:90px;background:var(--card,#fff);border:1px solid rgba(20,30,45,.12);border-radius:22px;padding:22px;box-shadow:0 12px 35px rgba(20,30,45,.06)}.ranking-panel h2{margin:.15rem 0 .35rem}.ranking-panel .ranking-deck{margin:0 0 18px;color:var(--muted,#667085);font-size:.94rem}.ranking-list{list-style:none;padding:0;margin:0;display:grid;gap:9px}.ranking-item{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-top:1px solid rgba(20,30,45,.09)}.ranking-item:first-child{border-top:0}.ranking-number{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:rgba(20,30,45,.07)}.ranking-item strong{display:block;line-height:1.18;overflow-wrap:anywhere}.ranking-item small{display:block;margin-top:3px;color:var(--muted,#667085);line-height:1.3}.ranking-item.podium{margin:2px -8px;padding:12px 8px;border-radius:14px;border-top-color:transparent;background:rgba(20,30,45,.035)}.ranking-item.podium .ranking-number{font-size:.92rem;box-shadow:0 3px 10px rgba(20,30,45,.12)}.ranking-item.rank-1{background:rgba(212,166,37,.12)}.ranking-item.rank-1 .ranking-number{background:#d4a625;color:#241d0b}.ranking-item.rank-2 .ranking-number{background:#a9afb8;color:#18202b}.ranking-item.rank-3 .ranking-number{background:#b9794f;color:#fff}.ranking-item.rank-1 strong{font-size:1.06rem}.rank-links{display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:5px}.rank-link{display:inline-block;font-size:.72rem;font-weight:900;text-decoration:none;border-bottom:1px solid currentColor}.ranking-panel.experiences{border-top:5px solid #e67e22}.ranking-panel.favorite-venues{border-top:5px solid #1d4ed8}.ranking-panel.best-venues{border-top:5px solid #0f766e}.review-note{margin-top:18px;padding:14px 16px;border-radius:14px;background:rgba(20,30,45,.045);font-size:.9rem;color:var(--muted,#667085)}@media(max-width:900px){.ranking-grid{grid-template-columns:1fr}.ranking-panel{padding:18px}.ranking-item{grid-template-columns:32px minmax(0,1fr)}.ranking-item.podium{margin-left:-5px;margin-right:-5px}}</style></head><body><main class="shell"><header class="site-header"><div class="brand"><a href="index.html">Sports Passport</a></div></header><div id="app"></div><footer class="site-footer"></footer></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData;const [rankings,events]=await Promise.all([D.load('curated-rankings'),D.load('events')]);const byId=new Map(events.map(e=>[e.id,e])),app=document.querySelector('#app');const list=(items,{linkEvents=false,linkVenues=false}={})=>`<ol class="ranking-list">${items.map(x=>{const e=linkEvents&&x.event_id?byId.get(x.event_id):null;const venueLinks=linkVenues&&Array.isArray(x.venue_slugs)?x.venue_slugs.map((slug,i)=>`<a class="rank-link" href="venue-profile.html?v=${encodeURIComponent(slug)}">${x.venue_slugs.length>1?`Venue profile ${i+1}`:'Open venue profile'} →</a>`).join(''):'';const podium=x.rank<=3?` podium rank-${x.rank}`:'';return `<li class="ranking-item${podium}"><span class="ranking-number">${x.rank}</span><div><strong>${x.title}</strong>${x.detail?`<small>${x.detail}</small>`:''}${x.note?`<small>${x.note}</small>`:''}${e?`<div class="rank-links"><a class="rank-link" href="year.html?y=${e.year}">Open ${e.year} annual record →</a></div>`:''}${venueLinks?`<div class="rank-links">${venueLinks}</div>`:''}</div></li>`}).join('')}</ol>`;app.innerHTML=`<section class="hero"><div class="kicker">Personal canon</div><h1>Top Tens</h1><div class="deck ranking-intro">Three different ways of remembering a lifetime of live sports: the experiences that meant the most, the venues I personally love, and the best sports venues I have visited on their own merits.</div><div class="stats"><div class="stat"><strong>10</strong><span>Sports experiences</span></div><div class="stat"><strong>10</strong><span>Favorite venues</span></div><div class="stat"><strong>10</strong><span>Best venues</span></div><div class="stat"><strong>Annual</strong><span>Review cadence</span></div></div></section><section class="section"><div class="head"><div><div class="kicker">Curated rankings</div><h2>The personal canon.</h2></div><p>Favorite and best are intentionally separate. Personal connection drives one venue list; the quality of the venue itself drives the other.</p></div><div class="ranking-grid"><article class="ranking-panel experiences" id="top-experiences"><div class="kicker">The moments</div><h2>Top 10 Sports Experiences</h2><p class="ranking-deck">The games and live sports moments I would most want to relive. Every ranked experience is linked to its exact archive event.</p>${list(rankings.sports_experiences,{linkEvents:true})}</article><article class="ranking-panel favorite-venues" id="favorite-venues"><div class="kicker">Personal connection</div><h2>10 Favorite Venues</h2><p class="ranking-deck">The places that mean the most to me. History, memories, teams and desire to return all count.</p>${list(rankings.favorite_venues,{linkVenues:true})}</article><article class="ranking-panel best-venues" id="best-venues"><div class="kicker">Venue quality</div><h2>10 Best Venues Visited</h2><p class="ranking-deck">The strongest venues on architecture, atmosphere, setting, history, uniqueness and overall sports experience.</p>${list(rankings.best_venues,{linkVenues:true})}</article></div><div class="review-note"><strong>Living lists.</strong> These rankings are intentionally curated rather than algorithmic and are revisited as new seasons, games and venues are added to Sports Passport.</div></section>`})();</script></body></html>
