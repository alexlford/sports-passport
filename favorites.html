<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Canon | Sports Passport</title><meta name="description" content="Alex Ford's curated top sports experiences, favorite venues, and best venues visited."><link rel="canonical" href="https://sports.alexlford.com/favorites.html"><link rel="stylesheet" href="assets/site.css"><link rel="stylesheet" href="assets/favorites.css"></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Personal Canon</div><nav class="nav"><a href="index.html">Archive</a><a href="hall-of-fame.html">Hall of Fame</a><a href="venues.html">Venues</a><a href="journeys.html">Journeys</a></nav></header><div id="app"></div><footer class="site-footer"></footer></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData;const [rankings,events]=await Promise.all([D.load('curated-rankings'),D.load('events')]);const byId=new Map(events.map(e=>[e.id,e])),app=document.querySelector('#app');const list=(items,{linkEvents=false,linkVenues=false}={})=>`<ol class="ranking-list">${items.map(x=>{const e=linkEvents&&x.event_id?byId.get(x.event_id):null;const venueLinks=linkVenues&&Array.isArray(x.venue_slugs)?x.venue_slugs.map((slug,i)=>`<a class="rank-link" href="venue-profile.html?v=${encodeURIComponent(slug)}">${x.venue_slugs.length>1?`Venue profile ${i+1}`:'Open venue profile'} →</a>`).join(''):'';const podium=x.rank<=3?` podium rank-${x.rank}`:'';return `<li class="ranking-item${podium}"><span class="ranking-number">${x.rank}</span><div><strong>${x.title}</strong>${x.detail?`<small>${x.detail}</small>`:''}${x.note?`<small>${x.note}</small>`:''}${e?`<div class="rank-links"><a class="rank-link" href="event.html?id=${encodeURIComponent(e.id)}">Open exact event passport →</a><a class="rank-link" href="year.html?y=${e.year}">See ${e.year} annual edition →</a></div>`:''}${venueLinks?`<div class="rank-links">${venueLinks}</div>`:''}</div></li>`}).join('')}</ol>`;app.innerHTML=`<section class="hero"><div class="kicker">Personal canon</div><h1>Top Tens</h1><div class="deck ranking-intro">Three different ways of remembering a lifetime of live sports: the experiences that meant the most, the venues I personally love, and the best sports venues I have visited on their own merits.</div><div class="stats"><div class="stat"><strong>${(rankings.sports_experiences||[]).length}</strong><span>Sports experiences</span></div><div class="stat"><strong>${(rankings.favorite_venues||[]).length}</strong><span>Favorite venues</span></div><div class="stat"><strong>${(rankings.best_venues||[]).length}</strong><span>Best venues</span></div><div class="stat"><strong>Annual</strong><span>Review cadence</span></div></div></section><section class="section"><div class="head"><div><div class="kicker">Curated rankings</div><h2>The personal canon.</h2></div><p>Favorite and best are intentionally separate. Personal connection drives one venue list; the quality of the venue itself drives the other.</p></div><div class="ranking-grid"><article class="ranking-panel experiences" id="top-experiences"><div class="kicker">The moments</div><h2>Top 10 Sports Experiences</h2><p class="ranking-deck">The games and live sports moments I would most want to relive. Every ranked experience links to its exact archive event and its annual edition.</p>${list(rankings.sports_experiences,{linkEvents:true})}</article><article class="ranking-panel favorite-venues" id="favorite-venues"><div class="kicker">Personal connection</div><h2>10 Favorite Venues</h2><p class="ranking-deck">The places that mean the most to me. History, memories, teams and desire to return all count.</p>${list(rankings.favorite_venues,{linkVenues:true})}</article><article class="ranking-panel best-venues" id="best-venues"><div class="kicker">Venue quality</div><h2>10 Best Venues Visited</h2><p class="ranking-deck">The strongest venues on architecture, atmosphere, setting, history, uniqueness and overall sports experience.</p>${list(rankings.best_venues,{linkVenues:true})}</article></div><div class="review-note"><strong>Living lists.</strong> These rankings are intentionally curated rather than algorithmic and are revisited at the end of each year as new seasons, games and venues are added to Sports Passport.</div></section>`})();</script></body></html>
