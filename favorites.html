<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Favorite Sports Experiences | Sports Passport</title><meta name="description" content="Alex Ford's favorite games and live sports experiences, curated from alexlford.com and connected to the Sports Passport archive where possible."><link rel="canonical" href="https://sports.alexlford.com/favorites.html"><link rel="stylesheet" href="assets/site.css"><link rel="stylesheet" href="assets/favorites.css"></head><body><main class="shell"><header class="site-header"><div class="brand"><a href="index.html">Sports Passport</a></div></header><div id="app"></div><footer class="site-footer"></footer></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,[favorites,events]=await Promise.all([D.load('favorite-experiences'),D.load('events')]);const byId=new Map(events.map(e=>[e.id,e])),app=document.querySelector('#app');const cards=favorites.map(f=>{const e=f.event_id?byId.get(f.event_id):null;const eventDetail=e?`${e.date} · ${D.matchup(e)}${D.score(e)?` · ${D.score(e)}`:''} · ${e.venue_recorded}`:`${f.year}${f.date?` · ${f.date}`:''}`;const annual=`year.html?y=${f.year}`;return `<article class="fav-card" id="${f.key}" data-year="${f.year}"><div class="kicker">${f.label}</div><h2>${f.title}</h2><div class="fav-meta"><span class="fav-chip">${f.category}</span><span class="fav-chip">${f.year}</span>${e?'<span class="fav-chip">Archive matched</span>':'<span class="fav-chip">Personal-site memory</span>'}</div><p>${f.description}</p><p><strong>${eventDetail}</strong></p>${f.note?`<div class="fav-note">${f.note}</div>`:''}<div class="fav-actions">${e?`<a class="primary" href="${annual}">Open ${f.year} annual →</a>`:''}<a href="${f.source_url}" target="_blank" rel="noopener">Personal-site source ↗</a>${f.verification_url?`<a href="${f.verification_url}" target="_blank" rel="noopener">Historical source ↗</a>`:''}</div></article>`}).join('');app.innerHTML=`<section class="hero"><div class="kicker">Personal canon</div><h1>Favorite<br>Experiences</h1><div class="deck">The games and sports moments that stand above the rest. These selections are pulled from alexlford.com and connected to the attendance archive when the source record is specific enough to match confidently.</div><div class="stats"><div class="stat"><strong>${favorites.length}</strong><span>Signature experiences</span></div><div class="stat"><strong>${favorites.filter(f=>f.event_id&&byId.has(f.event_id)).length}</strong><span>Archive matched</span></div><div class="stat"><strong>${Math.min(...favorites.map(f=>f.year))}</strong><span>Earliest favorite</span></div><div class="stat"><strong>${Math.max(...favorites.map(f=>f.year))}</strong><span>Latest favorite</span></div><div class="stat"><strong>Personal</strong><span>Selection basis</span></div></div></section><section class="section"><div class="head"><div><div class="kicker">The short list</div><h2>Games I still talk about.</h2></div><p>Favorites are intentionally separate from objective archive records. This is the personal layer.</p></div><div class="fav-grid">${cards}</div><div class="source-note"><strong>Source policy.</strong> The personal descriptions come from alexlford.com. Where a favorite maps cleanly to a documented Sports Passport event, the card links into that annual edition. Illinois at the 2005 Final Four is included as a favorite sports experience, but remains intentionally unbound to a specific attendance record because the personal-site source identifies the Final Four experience rather than a particular game or session.</div></section>`})();</script></body></html>
