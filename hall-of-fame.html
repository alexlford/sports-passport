<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hall of Fame | Sports Passport</title><link rel="stylesheet" href="assets/site.css"><style>.canon-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.canon{padding:22px;border:1px solid var(--line);border-top:5px solid var(--sport-accent,var(--red));border-radius:19px;background:#fffdf8c9}.canon h3{font-size:1.6rem;margin:7px 0}.canon p{color:var(--muted)}.canon a{font-weight:900;text-underline-offset:3px}@media(max-width:700px){.canon-grid{grid-template-columns:1fr}}</style></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Hall of Fame</div><nav class="nav"><a href="index.html">Archive</a><a href="favorites.html">Favorites</a><a href="lifetime-analytics.html">Analytics</a></nav></header><div id="records"></div><section class="section"><div class="head"><div><div class="kicker">Alex's personal canon</div><h2>My Hall of Fame.</h2></div><p>No visitor ballot, comments, or saved preferences. These are Alex's selections.</p></div><div class="canon-grid" id="canon"></div></section></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,[events,favorites]=await Promise.all([D.load("events"),D.load("favorite-experiences")]),scored=events.filter(e=>e.scores?.length===2&&e.scores.every(Number.isFinite)).map(e=>({...e,combined:e.scores[0]+e.scores[1],margin:Math.abs(e.scores[0]-e.scores[1])})),years=D.counts(events.map(e=>e.year)),teams=D.counts(events.flatMap(e=>e.teams)),venues=D.counts(events.map(e=>e.venue_key).filter(Boolean));const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0],high=[...scored].sort((a,b)=>b.combined-a.combined)[0],margin=[...scored].sort((a,b)=>b.margin-a.margin)[0],close=[...scored].filter(e=>e.margin>0).sort((a,b)=>a.margin-b.margin)[0];document.querySelector("#records").innerHTML=`<section class="hero"><div class="kicker">Live record book</div><h1>Hall of<br>Fame</h1><div class="deck">Objective archive records alongside Alex's own favorite sports experiences.</div><div class="stats"><div class="stat"><strong>${events.length}</strong><span>Events</span></div><div class="stat"><strong>${top(years)[0]}</strong><span>Busiest year</span></div><div class="stat"><strong>${high?.combined||"—"}</strong><span>Highest combined score</span></div><div class="stat"><strong>${margin?.margin||"—"}</strong><span>Largest margin</span></div><div class="stat"><strong>${close?.margin||"—"}</strong><span>Closest finish</span></div></div></section><section class="section grid3"><div class="card"><div class="kicker">Most-seen team</div><h3>${top(teams)[0]}</h3><p>${top(teams)[1]} appearances</p></div><div class="card"><div class="kicker">Most-visited venue</div><h3>${top(venues)[0]}</h3><p>${top(venues)[1]} visits</p></div><div class="card"><div class="kicker">Busiest year</div><h3>${top(years)[0]}</h3><p>${top(years)[1]} documented events</p></div></section>`;document.querySelector('#canon').innerHTML=favorites.map(f=>`<article class="canon sport-${f.category.toLowerCase()}" data-sport="${f.category}"><div class="kicker">${f.label}</div><h3>${f.title}</h3><p>${f.description}</p><a href="favorites.html#${f.key}">Open favorite →</a></article>`).join('')})();</script></body></html>
