<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hall of Fame | Sports Passport</title><link rel="stylesheet" href="assets/site.css"><style>.hall-stats{grid-template-columns:repeat(6,minmax(0,1fr))}.canon-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.canon{padding:22px;border:1px solid var(--line);border-top:5px solid var(--red);border-radius:19px;background:#fffdf8c9;display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px}.canon-rank{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:white;font-weight:950}.canon:nth-child(1) .canon-rank{background:#d4a625;color:#241d0b}.canon:nth-child(2) .canon-rank{background:#a9afb8;color:#18202b}.canon:nth-child(3) .canon-rank{background:#b9794f;color:#fff}.canon h3{font-size:1.45rem;line-height:1.1;margin:2px 0 6px}.canon p{color:var(--muted);margin:0}.canon-link{display:inline-block;margin-top:10px;margin-right:10px;font-weight:900;text-underline-offset:3px}.method-note{margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-left:5px solid #725b86;border-radius:14px;background:#fffaf0;color:var(--muted);line-height:1.5}.record-card{display:block;text-decoration:none}.record-card:hover h3{text-decoration:underline;text-underline-offset:3px}.record-card .open{display:block;margin-top:9px;font-size:.76rem;font-weight:900;color:var(--red)}@media(max-width:1000px){.hall-stats{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.canon-grid{grid-template-columns:1fr}.hall-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.canon{padding:17px;grid-template-columns:38px minmax(0,1fr)}.canon-rank{width:34px;height:34px}.canon h3{font-size:1.2rem}}</style></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Hall of Fame</div><nav class="nav"><a href="index.html">Archive</a><a href="favorites.html">Top Tens</a><a href="lifetime-analytics.html">Analytics</a><a href="venues.html">Venues</a></nav></header><div id="records"></div><section class="section"><div class="head"><div><div class="kicker">Alex's personal canon</div><h2>Top 10 Sports Experiences.</h2></div><p>The same curated ranking used on the Top Tens page, kept separate from the objective record book.</p></div><div class="canon-grid" id="canon"></div><a class="canon-link" href="favorites.html">Open all three Top 10 lists →</a></section></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,[events,rankings,venues]=await Promise.all([D.load("events"),D.load("curated-rankings"),D.load("venues")]),byId=new Map(events.map(e=>[e.id,e])),confirmed=D.confirmedEvents(events),notional=D.notionalEvents(events).length,scored=confirmed.filter(e=>e.scores?.length===2&&e.scores.every(Number.isFinite)).map(e=>({...e,combined:e.scores[0]+e.scores[1],margin:Math.abs(e.scores[0]-e.scores[1])})),years=D.counts(confirmed.map(e=>e.year)),teams=D.counts(confirmed.flatMap(D.eventTeams)),venueCounts=D.counts(confirmed.map(e=>e.venue_key).filter(Boolean));const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0]||["—",0],high=[...scored].sort((a,b)=>b.combined-a.combined)[0],margin=[...scored].sort((a,b)=>b.margin-a.margin)[0],close=[...scored].filter(e=>e.margin>0).sort((a,b)=>a.margin-b.margin)[0],topTeam=top(teams),topVenue=top(venueCounts),topYear=top(years),topVenueRecord=D.venueByKey(venues,topVenue[0]);document.querySelector("#records").innerHTML=`<section class="hero"><div class="kicker">Live record book</div><h1>Hall of<br>Fame</h1><div class="deck">Confirmed and documented archive records alongside Alex's curated Top 10 sports experiences. Team records use canonical franchise and program identities.</div><div class="stats hall-stats"><div class="stat"><strong>${events.length}</strong><span>Archive records</span></div><div class="stat"><strong>${confirmed.length}</strong><span>Confirmed / documented</span></div><div class="stat"><strong>${topYear[0]}</strong><span>Busiest confirmed year</span></div><div class="stat"><strong>${high?.combined||"—"}</strong><span>Highest combined score</span></div><div class="stat"><strong>${margin?.margin||"—"}</strong><span>Largest margin</span></div><div class="stat"><strong>${close?.margin||"—"}</strong><span>Closest finish</span></div></div><div class="method-note"><strong>Record-book methodology.</strong> The ${notional} explicitly notional pre-2006 reconstruction${notional===1?" is":"s are"} preserved in the archive but excluded from objective Hall of Fame leaders and scoring records.</div></section><section class="section grid3"><a class="card record-card" href="team-profile.html?t=${encodeURIComponent(D.slug(topTeam[0]))}"><div class="kicker">Most-seen team</div><h3>${topTeam[0]}</h3><p>${topTeam[1]} confirmed/documented appearances</p><span class="open">Open team dossier →</span></a><a class="card record-card" href="${topVenueRecord?.slug?`venue-profile.html?v=${encodeURIComponent(topVenueRecord.slug)}`:'venues.html'}"><div class="kicker">Most-visited venue</div><h3>${topVenueRecord?.display_name||topVenue[0]}</h3><p>${topVenue[1]} confirmed/documented visits</p><span class="open">Open venue profile →</span></a><a class="card record-card" href="year.html?y=${topYear[0]}"><div class="kicker">Busiest year</div><h3>${topYear[0]}</h3><p>${topYear[1]} confirmed/documented events</p><span class="open">Open annual edition →</span></a></section>`;document.querySelector('#canon').innerHTML=(rankings.sports_experiences||[]).map(f=>{const e=f.event_id?byId.get(f.event_id):null;return `<article class="canon"><span class="canon-rank">${f.rank}</span><div><div class="kicker">#${f.rank} · Personal canon</div><h3>${f.title}</h3>${f.detail?`<p>${f.detail}</p>`:''}${e?`<a class="canon-link" href="event.html?id=${encodeURIComponent(e.id)}">Open exact event →</a><a class="canon-link" href="year.html?y=${e.year}">See ${e.year} edition →</a>`:''}</div></article>`}).join('')})();</script></body></html>
