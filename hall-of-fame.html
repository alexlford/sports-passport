<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hall of Fame | Sports Passport</title><link rel="stylesheet" href="assets/site.css"><style>.ballot textarea{width:100%;min-height:92px;margin-top:10px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fffaf0;font:inherit}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.actions button{border:0;border-radius:999px;padding:10px 15px;background:var(--ink);color:#fff;font-weight:900;cursor:pointer}.actions button.secondary{background:#fffdf8;color:var(--ink);border:1px solid var(--line)}</style></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Hall of Fame</div><nav class="nav"><a href="index.html">Archive</a><a href="lifetime-analytics.html">Analytics</a><a href="journeys.html">Journeys</a></nav></header><div id="records"></div><section class="section"><div class="head"><div><div class="kicker">Personal ballot</div><h2>Your Hall of Fame.</h2></div><p>Objective records are computed from the archive. These subjective choices remain yours and save locally in this browser.</p></div><div class="grid2 ballot" id="ballot"></div><div class="actions" style="margin-top:16px"><button id="save">Save ballot</button><button class="secondary" id="clear">Clear</button><span id="state"></span></div></section></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,events=await D.load("events"),scored=events.filter(e=>e.scores?.length===2&&e.scores.every(Number.isFinite)).map(e=>({...e,combined:e.scores[0]+e.scores[1],margin:Math.abs(e.scores[0]-e.scores[1])})),years=D.counts(events.map(e=>e.year)),teams=D.counts(events.flatMap(e=>e.teams)),venues=D.counts(events.map(e=>e.venue_key).filter(Boolean));const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0],high=[...scored].sort((a,b)=>b.combined-a.combined)[0],margin=[...scored].sort((a,b)=>b.margin-a.margin)[0],close=[...scored].filter(e=>e.margin>0).sort((a,b)=>a.margin-b.margin)[0];document.querySelector("#records").innerHTML=`<section class="hero"><div class="kicker">Live record book</div><h1>Hall of<br>Fame</h1><div class="deck">Objective records recalculate automatically from the archive. Personal selections remain separate.</div><div class="stats"><div class="stat"><strong>${events.length}</strong><span>Events</span></div><div class="stat"><strong>${top(years)[0]}</strong><span>Busiest year</span></div><div class="stat"><strong>${high?.combined||"—"}</strong><span>Highest combined score</span></div><div class="stat"><strong>${margin?.margin||"—"}</strong><span>Largest margin</span></div><div class="stat"><strong>${close?.margin||"—"}</strong><span>Closest finish</span></div></div></section><section class="section grid3"><div class="card"><div class="kicker">Most-seen team</div><h3>${top(teams)[0]}</h3><p>${top(teams)[1]} appearances</p></div><div class="card"><div class="kicker">Most-visited venue</div><h3>${top(venues)[0]}</h3><p>${top(venues)[1]} visits</p></div><div class="card"><div class="kicker">Busiest year</div><h3>${top(years)[0]}</h3><p>${top(years)[1]} documented events</p></div></section>`;const fields=["Greatest Game","Best Atmosphere","Favorite Venue","Best Road Trip","Toughest Loss","Favorite Player Seen Live","Most Meaningful Memory","Wild Card Induction"];const ballot=document.querySelector("#ballot");ballot.innerHTML=fields.map(x=>`<label class="panel"><b>${x}</b><textarea data-key="${x}" placeholder="Add your selection and why it belongs here"></textarea></label>`).join("");const K="sports-passport-hof-v2";try{const x=JSON.parse(localStorage.getItem(K)||"{}");document.querySelectorAll("textarea").forEach(t=>t.value=x[t.dataset.key]||"")}catch(e){}document.querySelector("#save").onclick=()=>{const x={};document.querySelectorAll("textarea").forEach(t=>x[t.dataset.key]=t.value);localStorage.setItem(K,JSON.stringify(x));document.querySelector("#state").textContent="Saved in this browser."};document.querySelector("#clear").onclick=()=>{localStorage.removeItem(K);document.querySelectorAll("textarea").forEach(t=>t.value="");document.querySelector("#state").textContent="Cleared."}})();</script></body></html>
