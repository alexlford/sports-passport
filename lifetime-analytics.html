<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lifetime Analytics | Sports Passport</title><link rel="stylesheet" href="assets/site.css"><link rel="stylesheet" href="assets/lifetime-analytics.css"></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Lifetime Analytics</div><nav class="nav"><a href="index.html">Archive</a><a href="teams.html">Teams</a><a href="venues.html">Venues</a><a href="journeys.html">Journeys</a></nav></header><div id="app"></div></main><script src="assets/sports-passport-data.js"></script><script>
(async()=>{
const D=window.SportsPassportData;
const [events,venues,phases,teamLore]=await Promise.all([D.load("events"),D.load("venues"),D.load("phases"),D.load("team-lore")]);
const confirmed=events.filter(D.isConfirmedEvent).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id)),notional=events.filter(D.isNotionalEvent).length;
const years=D.counts(events.map(e=>e.year)),sports=D.counts(events.map(e=>e.sport)),teams=D.counts(events.flatMap(D.eventTeams)),cities=D.counts(events.map(e=>e.city).filter(Boolean)),venueCounts=D.counts(events.map(e=>e.venue_key).filter(Boolean)),venueByKey=Object.fromEntries(venues.map(v=>[v.key,v]));
const ykeys=Object.keys(years).map(Number).sort((a,b)=>a-b),max=Math.max(...Object.values(years)),top=(obj,n=10)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]||String(a[0]).localeCompare(String(b[0]))).slice(0,n);
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const dateLabel=value=>{const d=new Date(value+'T12:00:00');return isNaN(d)?value:d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})};
const bars=ykeys.map(y=>`<div class="barwrap"><a href="year.html?y=${y}"><b>${years[y]}</b><div class="bar" style="--h:${Math.max(3,180*years[y]/max)}px"></div><span>${y}</span></a></div>`).join("");
const teamRows=Object.entries(teams).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="leader"><span><a class="leader-link" href="team-profile.html?t=${encodeURIComponent(D.slug(k))}">${k}</a></span><strong>${v}</strong></div>`).join("");
const cityRows=Object.entries(cities).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="leader"><span><a class="leader-link" href="geography.html">${k}</a></span><strong>${v}</strong></div>`).join("");
const venueRows=Object.entries(venueCounts).sort((a,b)=>b[1]-a[1]).map(([key,count])=>{const v=venueByKey[key],label=v?.display_name||key,href=v?.slug?`venue-profile.html?v=${encodeURIComponent(v.slug)}`:null;return `<div class="leader"><span>${href?`<a class="leader-link" href="${href}">${label}</a>`:label}</span><strong>${count}</strong></div>`}).join("");
const sportRows=Object.entries(sports).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="leader sport-row" data-sport="${k}"><span>${k}</span><strong>${v}</strong></div>`).join("");
const busiest=top(years,1)[0],topTeam=top(teams,1)[0],topCity=top(cities,1)[0],topVenue=top(venueCounts,1)[0],topVenueObj=topVenue?venueByKey[topVenue[0]]:null;

// Confirmed-archive expansion: first visits versus returns.
const venueYears=new Map(),seenVenues=new Set();
confirmed.filter(e=>e.venue_key).forEach(e=>{const year=Number(e.year),bucket=venueYears.get(year)||{newCount:0,repeatCount:0};if(seenVenues.has(e.venue_key))bucket.repeatCount++;else{bucket.newCount++;seenVenues.add(e.venue_key)}venueYears.set(year,bucket)});
const expansionRows=[...venueYears.entries()].sort((a,b)=>a[0]-b[0]).map(([year,b])=>{const total=b.newCount+b.repeatCount,pct=total?Math.round(100*b.newCount/total):0;return `<div class="insight-row"><strong><a href="year.html?y=${year}">${year}</a></strong><span>${b.newCount} new</span><span>${b.repeatCount} repeat</span><b>${pct}% new</b></div>`}).join('');
const confirmedVenueVisits=confirmed.filter(e=>e.venue_key).length,newVenueRate=confirmedVenueVisits?Math.round(100*seenVenues.size/confirmedVenueVisits):0;

// State footprint from confirmed venue/event geography.
const stateStats=new Map();
confirmed.forEach(e=>{const city=venueByKey[e.venue_key]?.city||e.city||'',m=city.match(/,\s*([A-Z]{2})$/);if(!m)return;const state=m[1],bucket=stateStats.get(state)||{events:0,venues:new Set()};bucket.events++;if(e.venue_key)bucket.venues.add(e.venue_key);stateStats.set(state,bucket)});
const stateRows=[...stateStats.entries()].sort((a,b)=>b[1].events-a[1].events||a[0].localeCompare(b[0])).map(([state,b])=>`<div class="leader"><span>${state}</span><strong>${b.events} events · ${b.venues.size} venues</strong></div>`).join('');

// Sport mix and city leaders over time by decade.
const decadeMap=new Map();
confirmed.forEach(e=>{const decade=Math.floor(Number(e.year)/10)*10,bucket=decadeMap.get(decade)||{sports:{},cities:{},events:0};bucket.events++;bucket.sports[e.sport]=(bucket.sports[e.sport]||0)+1;if(e.city)bucket.cities[e.city]=(bucket.cities[e.city]||0)+1;decadeMap.set(decade,bucket)});
const decadeCards=[...decadeMap.entries()].sort((a,b)=>a[0]-b[0]).map(([decade,b])=>{const sportTop=top(b.sports,3),cityTop=top(b.cities,1)[0];return `<article class="insight-card"><div class="kicker">${decade}s</div><h3>${b.events} confirmed events</h3><div class="mini-list">${sportTop.map(([sport,count])=>`<div><span>${sport}</span><strong>${count}</strong></div>`).join('')}</div><p>${cityTop?`Top city: <strong>${escapeHtml(cityTop[0])}</strong> · ${cityTop[1]} events`:'No city leader recorded.'}</p></article>`}).join('');

// Team leaders inside each life chapter.
const phaseCards=(phases||[]).map(phase=>{const chapterEvents=D.phaseEvents(confirmed,phase),chapterTeams=D.counts(chapterEvents.flatMap(D.eventTeams)),leaders=top(chapterTeams,3);return `<a class="insight-card linked" href="phase.html?p=${encodeURIComponent(phase.key)}"><div class="kicker">${escapeHtml(phase.range)}</div><h3>${escapeHtml(phase.title)}</h3><div class="mini-list">${leaders.length?leaders.map(([team,count])=>`<div><span>${escapeHtml(team)}</span><strong>${count}</strong></div>`).join(''):'<p>No confirmed events.</p>'}</div></a>`}).join('');

// Favorite-team results by venue, confirmed records with numeric scores only.
const favoriteTeams=new Set(Object.entries(teamLore||{}).filter(([,value])=>value?.favorite).map(([team])=>team));
const favoriteVenueRecords=new Map();
confirmed.forEach(e=>{const canonical=D.eventTeams(e);if(!Array.isArray(e.scores)||e.scores.length!==2||!e.scores.every(Number.isFinite)||!e.venue_key)return;canonical.forEach((team,i)=>{if(!favoriteTeams.has(team))return;const key=`${team}|||${e.venue_key}`,r=favoriteVenueRecords.get(key)||{team,venueKey:e.venue_key,w:0,l:0,t:0,g:0};r.g++;if(e.scores[i]>e.scores[1-i])r.w++;else if(e.scores[i]<e.scores[1-i])r.l++;else r.t++;favoriteVenueRecords.set(key,r)})});
const favoriteRecordRows=[...favoriteVenueRecords.values()].sort((a,b)=>b.g-a.g||a.team.localeCompare(b.team)).slice(0,14).map(r=>{const venue=venueByKey[r.venueKey],record=`${r.w}-${r.l}${r.t?`-${r.t}`:''}`,venueLabel=venue?.display_name||r.venueKey,venueLink=venue?.slug?`<a href="venue-profile.html?v=${encodeURIComponent(venue.slug)}">${escapeHtml(venueLabel)}</a>`:escapeHtml(venueLabel);return `<div class="record-insight"><span><a href="team-profile.html?t=${encodeURIComponent(D.slug(r.team))}">${escapeHtml(r.team)}</a><small>${venueLink}</small></span><strong>${record}</strong><b>${r.g} games</b></div>`}).join('');

// First/last, longest gap, and longest consecutive active-year streak.
const first=confirmed[0],last=confirmed.at(-1);let longestGap=null;
for(let i=1;i<confirmed.length;i++){const a=confirmed[i-1],b=confirmed[i],days=Math.round((new Date(b.date+'T12:00:00')-new Date(a.date+'T12:00:00'))/86400000);if(!longestGap||days>longestGap.days)longestGap={days,a,b}}
const activeYears=[...new Set(confirmed.map(e=>Number(e.year)))].sort((a,b)=>a-b);let bestStreak={start:null,end:null,length:0},streakStart=null,prev=null;
activeYears.forEach(year=>{if(streakStart===null||prev===null||year!==prev+1)streakStart=year;const length=year-streakStart+1;if(length>bestStreak.length)bestStreak={start:streakStart,end:year,length};prev=year});
const milestoneCards=[
 first?`<a class="milestone-card" href="event.html?id=${encodeURIComponent(first.id)}"><span>First confirmed event</span><strong>${dateLabel(first.date)}</strong><b>${escapeHtml(D.matchup(first))}</b></a>`:'',
 last?`<a class="milestone-card" href="event.html?id=${encodeURIComponent(last.id)}"><span>Latest confirmed event</span><strong>${dateLabel(last.date)}</strong><b>${escapeHtml(D.matchup(last))}</b></a>`:'',
 longestGap?`<div class="milestone-card"><span>Longest gap</span><strong>${longestGap.days.toLocaleString()} days</strong><b>${dateLabel(longestGap.a.date)} → ${dateLabel(longestGap.b.date)}</b></div>`:'',
 bestStreak.length?`<div class="milestone-card"><span>Longest active-year streak</span><strong>${bestStreak.length} years</strong><b>${bestStreak.start} → ${bestStreak.end}</b></div>`:''
].join('');

document.querySelector("#app").innerHTML=`<section class="hero"><div class="kicker">Live archive view</div><h1>Lifetime<br>Analytics</h1><div class="deck">The cumulative archive, recalculated whenever the page loads. Historical team names roll into canonical franchise and program identities, while early-record confidence remains explicit.</div><div class="stats"><div class="stat"><strong>${events.length}</strong><span>Archive records</span></div><div class="stat"><strong>${confirmed.length}</strong><span>Confirmed / documented</span></div><div class="stat"><strong>${new Set(events.map(e=>e.year)).size}</strong><span>Years represented</span></div><div class="stat"><strong>${venues.length}</strong><span>Physical venues</span></div><div class="stat"><strong>${Object.keys(cities).length}</strong><span>Cities</span></div></div><div class="method-note"><strong>Analytics methodology.</strong> The opening distributions describe the full ${events.length}-record archive, including ${notional} explicitly notional pre-2006 reconstruction${notional===1?'':'s'}. The deeper longitudinal insights below use the ${confirmed.length}-record confirmed/documented archive so venue expansion, intervals, records, and streaks are not presented with false precision.</div></section>
<section class="section"><div class="head"><div class="kicker">Timeline</div><h2>Archive records by year</h2></div><div class="panel"><div class="bars">${bars}</div></div></section>
<section class="section grid2"><div class="panel"><div class="kicker">Sport mix</div><h2>What filled the archive</h2><div class="rank-list">${sportRows}</div></div><div class="panel"><div class="kicker">Teams</div><h2>Most seen</h2><p class="density-note">Tap a team to open its dossier. Archive appearance counts include the early notional reconstruction.</p><div class="rank-list" data-density="8">${teamRows}</div></div></section>
<section class="section grid2"><div class="panel"><div class="kicker">Venues</div><h2>Most visited</h2><p class="density-note">Tap any venue to open its full profile.</p><div class="rank-list" data-density="8">${venueRows}</div></div><div class="panel"><div class="kicker">Geography</div><h2>Most common cities</h2><p class="density-note">City leaders connect back to the Geography desk.</p><div class="rank-list" data-density="8">${cityRows}</div></div></section>
<section class="section insight-section" id="venue-expansion"><div class="head"><div><div class="kicker">Archive expansion · confirmed records</div><h2>New places versus return visits.</h2></div><p>${seenVenues.size} distinct confirmed venues across ${confirmedVenueVisits} venue visits. ${newVenueRate}% of confirmed venue visits introduced a place not previously seen in the documented timeline.</p></div><div class="insight-summary"><div class="insight-stat"><strong>${seenVenues.size}</strong><span>Confirmed venues collected</span></div><div class="insight-stat"><strong>${confirmedVenueVisits-seenVenues.size}</strong><span>Repeat venue visits</span></div><div class="insight-stat"><strong>${newVenueRate}%</strong><span>First-visit share</span></div></div><div class="panel insight-table"><div class="insight-row insight-header"><strong>Year</strong><span>New</span><span>Repeat</span><b>Share new</b></div>${expansionRows}</div></section>
<section class="section insight-section" id="sport-over-time"><div class="head"><div><div class="kicker">Time slices · confirmed records</div><h2>How the archive changed by decade.</h2></div><p>Sport mix and city leadership evolve as home base, schools, teams, and travel patterns change.</p></div><div class="insight-card-grid">${decadeCards}</div></section>
<section class="section grid2 insight-section"><div class="panel"><div class="kicker">State footprint · confirmed records</div><h2>Where the games happened.</h2><p class="density-note">Event and distinct-venue counts use the state suffix on resolved venue/event locations.</p><div class="rank-list" data-density="10">${stateRows}</div></div><div class="panel"><div class="kicker">Life chapters · confirmed records</div><h2>Teams that defined each chapter.</h2><div class="chapter-insight-grid">${phaseCards}</div></div></section>
<section class="section insight-section" id="favorite-records"><div class="head"><div><div class="kicker">Favorite-team records · confirmed scores</div><h2>Home fields, road trips, and results.</h2></div><p>Win-loss records are calculated only where a favorite team appears in a confirmed event with a two-team numeric score.</p></div><div class="panel record-insight-list">${favoriteRecordRows||'<p>No scored favorite-team records available.</p>'}</div></section>
<section class="section insight-section" id="streaks"><div class="head"><div><div class="kicker">Continuity · confirmed records</div><h2>Firsts, lasts, streaks, and gaps.</h2></div><p>Chronological interval metrics use confirmed/documented events only.</p></div><div class="milestone-grid">${milestoneCards}</div></section>
<section class="section"><div class="head"><div><div class="kicker">Current edge</div><h2>Open the leaders.</h2></div></div><div class="status-links"><a class="status-link" href="year.html?y=${Math.max(...ykeys)}"><span>Latest year represented</span><strong>${Math.max(...ykeys)}</strong></a><a class="status-link" href="year.html?y=${busiest[0]}"><span>Busiest archive year</span><strong>${busiest[0]} · ${busiest[1]} records</strong></a><a class="status-link" href="team-profile.html?t=${encodeURIComponent(D.slug(topTeam?.[0]||''))}"><span>Most-seen team</span><strong>${topTeam?.[0]||'—'} · ${topTeam?.[1]||0}</strong></a>${topVenueObj?`<a class="status-link" href="venue-profile.html?v=${encodeURIComponent(topVenueObj.slug)}"><span>Most-visited venue</span><strong>${topVenueObj.display_name} · ${topVenue[1]}</strong></a>`:''}<a class="status-link" href="geography.html"><span>Most common city</span><strong>${topCity?.[0]||'—'} · ${topCity?.[1]||0}</strong></a></div></section>`;
D.enhanceDensity(document.querySelector('#app'));
})();
</script></body></html>
