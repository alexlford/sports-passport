<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lifetime Analytics | Sports Passport</title><style>:root{--paper:#f4ecdc;--white:#fffdf8;--ink:#112b3c;--muted:#736d64;--line:rgba(17,43,60,.16);--red:#b7443a;--blue:#315f84;--serif:Georgia,"Times New Roman",serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit}.shell{max-width:1240px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand,.kicker{font-size:.72rem;font-weight:950;letter-spacing:.16em;text-transform:uppercase}.kicker{color:var(--red)}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:#fffdf8aa;text-decoration:none;font-size:.75rem;font-weight:850}.hero{margin:22px 0 48px;padding:clamp(36px,7vw,78px);border:1px solid var(--line);border-radius:30px;background:linear-gradient(135deg,#fffdf8,#eadfca)}.hero h1,h2,h3{font-family:var(--serif)}.hero h1{font-size:clamp(3.8rem,9vw,7.6rem);line-height:.84;letter-spacing:-.055em;margin:18px 0}.deck{max-width:790px;font:1.28rem/1.55 var(--serif);color:#315064}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:30px}.stat,.panel{border:1px solid var(--line);background:#fffdf8c9;border-radius:19px}.stat{padding:16px}.stat strong{display:block;font:900 1.8rem/1 var(--serif)}.stat span{display:block;margin-top:7px;color:var(--muted);font-size:.66rem;text-transform:uppercase}.section{margin:58px 0}.head h2{font-size:clamp(2.3rem,5vw,3.8rem);margin:6px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{padding:22px}.leader{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.bars{display:flex;align-items:flex-end;gap:5px;height:230px;overflow-x:auto}.barwrap{min-width:24px;flex:1;text-align:center}.bar{height:var(--h);min-height:3px;background:var(--blue);border-radius:5px 5px 2px 2px}.barwrap span{display:block;font-size:.58rem;color:var(--muted);transform:rotate(-55deg);margin-top:13px}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.shell{padding:14px}}</style></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Lifetime Analytics</div><nav class="nav"><a href="index.html">Archive</a><a href="teams.html">Teams</a><a href="venues.html">Venues</a><a href="journeys.html">Journeys</a></nav></header><div id="app"></div></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,[events,venues]=await Promise.all([D.load("events"),D.load("venues")]);const years=D.counts(events.map(e=>e.year)),sports=D.counts(events.map(e=>e.sport)),teams=D.counts(events.flatMap(e=>e.teams)),cities=D.counts(events.map(e=>e.city).filter(Boolean));const ykeys=Object.keys(years).map(Number).sort((a,b)=>a-b),max=Math.max(...Object.values(years));const top=(obj,n=10)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n);const bars=ykeys.map(y=>`<div class="barwrap"><b>${years[y]}</b><div class="bar" style="--h:${Math.max(3,180*years[y]/max)}px"></div><span>${y}</span></div>`).join("");const rows=obj=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="leader"><span>${k}</span><strong>${v}</strong></div>`).join("");const sportRows=Object.entries(sports).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="leader sport-row" data-sport="${k}"><span>${k}</span><strong>${v}</strong></div>`).join("");const busiest=top(years,1)[0];document.querySelector("#app").innerHTML=`<section class="hero"><div class="kicker">Live data view</div><h1>Lifetime<br>Analytics</h1><div class="deck">The cumulative record, recalculated from the central event archive whenever the page loads.</div><div class="stats"><div class="stat"><strong>${events.length}</strong><span>Events</span></div><div class="stat"><strong>${new Set(events.map(e=>e.year)).size}</strong><span>Years represented</span></div><div class="stat"><strong>${Object.keys(sports).length}</strong><span>Sports</span></div><div class="stat"><strong>${venues.length}</strong><span>Venues</span></div><div class="stat"><strong>${Object.keys(cities).length}</strong><span>Cities</span></div></div></section><section class="section"><div class="head"><div class="kicker">Timeline</div><h2>Games by year</h2></div><div class="panel"><div class="bars">${bars}</div></div></section><section class="section grid2"><div class="panel"><div class="kicker">Sport mix</div><h2>What filled the calendar</h2><div class="rank-list">${sportRows}</div></div><div class="panel"><div class="kicker">Teams</div><h2>Most seen</h2><p class="density-note">The top eight are shown first; the full team ranking remains available.</p><div class="rank-list" data-density="8">${rows(teams)}</div></div></section><section class="section grid2"><div class="panel"><div class="kicker">Geography</div><h2>Most common cities</h2><p class="density-note">The top eight are shown first; expand for the complete city ranking.</p><div class="rank-list" data-density="8">${rows(cities)}</div></div><div class="panel"><div class="kicker">Current edge</div><h2>Archive status</h2><div class="leader"><span>Latest year represented</span><strong>${Math.max(...ykeys)}</strong></div><div class="leader"><span>Busiest year</span><strong>${busiest[0]}</strong></div><div class="leader"><span>Busiest-year events</span><strong>${busiest[1]}</strong></div><div class="leader"><span>Most-seen team</span><strong>${top(teams,1)[0]?.[0]||'—'}</strong></div><div class="leader"><span>Most common city</span><strong>${top(cities,1)[0]?.[0]||'—'}</strong></div></div></section>`;D.enhanceDensity(document.querySelector('#app'))})();</script></body></html>
