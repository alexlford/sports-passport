<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lifetime Analytics | Sports Passport</title><style>:root{--paper:#f4ecdc;--white:#fffdf8;--ink:#112b3c;--muted:#736d64;--line:rgba(17,43,60,.16);--red:#b7443a;--blue:#315f84;--serif:Georgia,"Times New Roman",serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit}.shell{max-width:1240px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand,.kicker{font-size:.72rem;font-weight:950;letter-spacing:.16em;text-transform:uppercase}.kicker{color:var(--red)}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:#fffdf8aa;text-decoration:none;font-size:.75rem;font-weight:850}.hero{margin:22px 0 48px;padding:clamp(36px,7vw,78px);border:1px solid var(--line);border-radius:30px;background:linear-gradient(135deg,#fffdf8,#eadfca)}.hero h1,h2,h3{font-family:var(--serif)}.hero h1{font-size:clamp(3.8rem,9vw,7.6rem);line-height:.84;letter-spacing:-.055em;margin:18px 0}.deck{max-width:810px;font:1.28rem/1.55 var(--serif);color:#315064}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:30px}.stat,.panel{border:1px solid var(--line);background:#fffdf8c9;border-radius:19px}.stat{padding:16px;min-width:0}.stat strong{display:block;font:900 1.8rem/1 var(--serif);overflow-wrap:anywhere}.stat span{display:block;margin-top:7px;color:var(--muted);font-size:.66rem;line-height:1.3;text-transform:uppercase}.method-note{margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-left:5px solid #725b86;border-radius:14px;background:#fffaf0;color:var(--muted);line-height:1.5}.section{margin:58px 0}.head h2{font-size:clamp(2.3rem,5vw,3.8rem);margin:6px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{padding:22px}.leader{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.leader-link{color:inherit;text-decoration:none;font-weight:800}.leader-link:hover,.leader-link:focus-visible{text-decoration:underline}.bars{display:flex;align-items:flex-end;gap:5px;height:242px;padding-top:16px;overflow-x:auto}.barwrap{min-width:24px;flex:1;text-align:center}.barwrap a{display:block;text-decoration:none}.barwrap a:hover span,.barwrap a:focus-visible span{text-decoration:underline}.bar{height:var(--h);min-height:3px;background:var(--blue);border-radius:5px 5px 2px 2px}.barwrap span{display:block;font-size:.58rem;color:var(--muted);transform:rotate(-55deg);margin-top:13px}.status-links{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.status-link{display:block;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fffdf8;text-decoration:none}.status-link span{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase}.status-link strong{display:block;margin-top:6px;font:900 1.12rem var(--serif)}@media(max-width:900px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.status-links{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.shell{padding:14px}.status-links{grid-template-columns:1fr}}</style></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Lifetime Analytics</div><nav class="nav"><a href="index.html">Archive</a><a href="teams.html">Teams</a><a href="venues.html">Venues</a><a href="journeys.html">Journeys</a></nav></header><div id="app"></div></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,[events,venues]=await Promise.all([D.load("events"),D.load("venues")]);const confirmed=events.filter(D.isConfirmedEvent),notional=events.filter(D.isNotionalEvent).length,years=D.counts(events.map(e=>e.year)),sports=D.counts(events.map(e=>e.sport)),teams=D.counts(events.flatMap(D.eventTeams)),cities=D.counts(events.map(e=>e.city).filter(Boolean)),venueCounts=D.counts(events.map(e=>e.venue_key).filter(Boolean)),venueByKey=Object.fromEntries(venues.map(v=>[v.key,v]));const ykeys=Object.keys(years).map(Number).sort((a,b)=>a-b),max=Math.max(...Object.values(years));const top=(obj,n=10)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n);const bars=ykeys.map(y=>`<div class="barwrap"><a href="year.html?y=${y}"><b>${years[y]}</b><div class="bar" style="--h:${Math.max(3,180*years[y]/max)}px"></div><span>${y}</span></a></div>`).join("");const teamRows=Object.entries(teams).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="leader"><span><a class="leader-link" href="team-profile.html?t=${encodeURIComponent(D.slug(k))}">${k}</a></span><strong>${v}</strong></div>`).join("");const cityRows=Object.entries(cities).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="leader"><span><a class="leader-link" href="geography.html">${k}</a></span><strong>${v}</strong></div>`).join("");const venueRows=Object.entries(venueCounts).sort((a,b)=>b[1]-a[1]).map(([key,count])=>{const v=venueByKey[key],label=v?.display_name||key,href=v?.slug?`venue-profile.html?v=${encodeURIComponent(v.slug)}`:null;return `<div class="leader"><span>${href?`<a class="leader-link" href="${href}">${label}</a>`:label}</span><strong>${count}</strong></div>`}).join("");const sportRows=Object.entries(sports).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="leader sport-row" data-sport="${k}"><span>${k}</span><strong>${v}</strong></div>`).join("");const busiest=top(years,1)[0],topTeam=top(teams,1)[0],topCity=top(cities,1)[0],topVenue=top(venueCounts,1)[0],topVenueObj=topVenue?venueByKey[topVenue[0]]:null;document.querySelector("#app").innerHTML=`<section class="hero"><div class="kicker">Live archive view</div><h1>Lifetime<br>Analytics</h1><div class="deck">The cumulative archive, recalculated whenever the page loads. Historical team names roll into canonical franchise and program identities, while early-record confidence remains explicit.</div><div class="stats"><div class="stat"><strong>${events.length}</strong><span>Archive records</span></div><div class="stat"><strong>${confirmed.length}</strong><span>Confirmed / documented</span></div><div class="stat"><strong>${new Set(events.map(e=>e.year)).size}</strong><span>Years represented</span></div><div class="stat"><strong>${venues.length}</strong><span>Physical venues</span></div><div class="stat"><strong>${Object.keys(cities).length}</strong><span>Cities</span></div></div><div class="method-note"><strong>Analytics methodology.</strong> These lifetime distributions and rankings intentionally describe the full ${events.length}-record archive, including ${notional} explicitly notional pre-2006 reconstruction${notional===1?'':'s'}. The Hall of Fame record book excludes notional records from objective scoring and leader statistics.</div></section><section class="section"><div class="head"><div class="kicker">Timeline</div><h2>Archive records by year</h2></div><div class="panel"><div class="bars">${bars}</div></div></section><section class="section grid2"><div class="panel"><div class="kicker">Sport mix</div><h2>What filled the archive</h2><div class="rank-list">${sportRows}</div></div><div class="panel"><div class="kicker">Teams</div><h2>Most seen</h2><p class="density-note">Tap a team to open its dossier. Archive appearance counts include the early notional reconstruction.</p><div class="rank-list" data-density="8">${teamRows}</div></div></section><section class="section grid2"><div class="panel"><div class="kicker">Venues</div><h2>Most visited</h2><p class="density-note">Tap any venue to open its full profile.</p><div class="rank-list" data-density="8">${venueRows}</div></div><div class="panel"><div class="kicker">Geography</div><h2>Most common cities</h2><p class="density-note">City leaders connect back to the Geography desk.</p><div class="rank-list" data-density="8">${cityRows}</div></div></section><section class="section"><div class="head"><div><div class="kicker">Current edge</div><h2>Open the leaders.</h2></div></div><div class="status-links"><a class="status-link" href="year.html?y=${Math.max(...ykeys)}"><span>Latest year represented</span><strong>${Math.max(...ykeys)}</strong></a><a class="status-link" href="year.html?y=${busiest[0]}"><span>Busiest archive year</span><strong>${busiest[0]} · ${busiest[1]} records</strong></a><a class="status-link" href="team-profile.html?t=${encodeURIComponent(D.slug(topTeam?.[0]||''))}"><span>Most-seen team</span><strong>${topTeam?.[0]||'—'} · ${topTeam?.[1]||0}</strong></a>${topVenueObj?`<a class="status-link" href="venue-profile.html?v=${encodeURIComponent(topVenueObj.slug)}"><span>Most-visited venue</span><strong>${topVenueObj.display_name} · ${topVenue[1]}</strong></a>`:''}<a class="status-link" href="geography.html"><span>Most common city</span><strong>${topCity?.[0]||'—'} · ${topCity?.[1]||0}</strong></a></div></section>`;D.enhanceDensity(document.querySelector('#app'))})();</script></body></html>
