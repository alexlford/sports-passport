</style></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Annual Media Guide</div><nav class="nav"><a href="index.html">Archive</a><a href="annuals.html">All Years</a><a href="lifetime-analytics.html">Analytics</a><a href="journeys.html">Journeys</a></nav></header><div id="app"></div></main><script src="assets/sports-passport-data.js"></script><script>
(async()=>{const D=window.SportsPassportData,[events,config]=await Promise.all([D.load("events"),D.load("config")]);const requested=Number(new URLSearchParams(location.search).get("y")),dataYears=[...new Set(events.map(e=>Number(e.year)))],year=requested||Math.max(...dataYears),current=Number(config.current_year),isCurrent=year===current,ev=D.yearEvents(events,year).sort((a,b)=>b.date.localeCompare(a.date));document.title=`${year} Year in Sports${isCurrent?' · In Progress':''} | Sports Passport`;const sports=D.counts(ev.map(e=>e.sport)),venues=D.counts(ev.map(e=>e.venue_key).filter(Boolean)),cities=D.counts(ev.map(e=>e.city).filter(Boolean)),teams=D.counts(ev.flatMap(e=>e.teams)),allYears=[...new Set([...dataYears,current].filter(Boolean))].sort((a,b)=>b-a);const nav=allYears.map(y=>`<a class="${y===year?"current":""}" href="year.html?y=${y}">${y}</a>`).join(""),colors={Baseball:"#315f84",Basketball:"#c49b48",Football:"#b7443a",Hockey:"#74527d",Soccer:"#426d5d"};function card(e){const d=new Date(e.date+"T12:00:00"),mon=isNaN(d)?"":d.toLocaleString("en-US",{month:"short"}).toUpperCase(),day=isNaN(d)?"":String(d.getDate()).padStart(2,"0"),label=e.league||e.sport,tm=(e.teams||[]).map((t,i)=>`<div class="team"><strong>${t}</strong><strong>${Number.isFinite(e.scores?.[i])?e.scores[i]:""}</strong></div>`).join("");return `<article class="event-card" data-sport="${e.sport}" data-search="${`${e.teams?.join(" ")} ${e.venue_recorded} ${e.city} ${label}`.toLowerCase()}" style="--accent:${colors[e.sport]||"#777"}"><div class="date"><span>${mon}</span><b>${day}</b><span>${label}</span></div><div class="body"><div class="meta"><span>${label}</span><span>${e.city||""}</span></div><div class="match">${tm}</div><div class="venue">${e.venue_recorded||"Venue not recorded"} · ${e.date}</div></div></article>`}const monthCounts=Array(12).fill(0);ev.forEach(e=>{const d=new Date(e.date+"T12:00:00");if(!isNaN(d))monthCounts[d.getMonth()]++});const mm=Math.max(1,...monthCounts),mn=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],bars=monthCounts.map((n,i)=>`<div class="bar-col"><b>${n}</b><div class="bar" style="--h:${n?180*n/mm:3}px"></div><span>${mn[i]}</span></div>`).join(""),rows=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="leader"><span>${k}</span><strong>${n}</strong></div>`).join(""),rots=[-5,3,-2,6,1,-4],stamps=Object.entries(cities).sort((a,b)=>b[1]-a[1]).map(([c,n],i)=>`<div class="stamp" style="--r:${rots[i%rots.length]}deg"><div><b>${c}</b>${n} ${n===1?"game":"games"}</div></div>`).join(""),most=Object.entries(sports).sort((a,b)=>b[1]-a[1])[0]?.[0]||"—",latest=ev.length?ev.map(e=>e.date).sort().at(-1):null;document.querySelector("#app").innerHTML=`<section class="hero" data-year="${year}"><div class="kicker">${isCurrent?'<span class="status-pill">In progress</span>':''}Year in Sports · ${year}</div><h1>${year}</h1><div class="deck">${ev.length?(isCurrent?`The live ${year} edition currently includes ${ev.length} documented event${ev.length===1?"":"s"}${latest?` through ${new Date(latest+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric'})}`:''}. It will keep growing as the season continues.`:`A data-driven annual edition built from ${ev.length} documented event${ev.length===1?"":"s"}.`):`No documented events are in the archive for ${year} yet. This page is ready to populate automatically.`}</div><div class="stats"><div class="stat"><strong>${ev.length}</strong><span>Games attended</span></div><div class="stat"><strong>${Object.keys(sports).length}</strong><span>Sports</span></div><div class="stat"><strong>${Object.keys(venues).length}</strong><span>Venues</span></div><div class="stat"><strong>${Object.keys(cities).length}</strong><span>Cities</span></div><div class="stat"><strong>${Object.keys(teams).length}</strong><span>Teams seen</span></div><div class="stat"><strong>${most}</strong><span>Most watched</span></div></div></section><div class="year-nav">${nav}</div><section class="section"><div class="head"><div><div class="kicker">01 · Ticket Book</div><h2>Every gate.</h2></div><p>Filter by sport or search any team, venue, league, or city.</p></div>${ev.length?`<div class="controls"><div class="chips">${["All",...Object.keys(sports).sort()].map((s,i)=>`<button class="${i===0?"active":""}" data-filter="${s}">${s}</button>`).join("")}</div><input class="search" id="q" placeholder="Search team, venue, league, city…"><div><b id="shown">${ev.length}</b> shown</div></div><div class="events">${ev.map(card).join("")}</div>`:`<div class="empty">Add ${year} events to the event archive and they will appear here automatically.</div>`}</section>${ev.length?`<section class="section"><div class="head"><div><div class="kicker">02 · Analytics</div><h2>The shape of the year.</h2></div></div><div class="analytics"><div class="panel"><h3>Games by month</h3><div class="bars">${bars}</div></div><div class="panel"><h3>Sport mix</h3>${rows(sports)}<h3 style="margin-top:26px">Venue leaders</h3>${rows(venues)}</div></div></section><section class="section"><div class="head"><div><div class="kicker">03 · Passport Stamps</div><h2>Places collected.</h2></div></div><div class="passport">${stamps}</div></section>`:""}`;let active="All";const buttons=[...document.querySelectorAll("[data-filter]")],cards=[...document.querySelectorAll(".event-card")],q=document.querySelector("#q"),shown=document.querySelector("#shown");function apply(){const query=(q?.value||"").toLowerCase();let n=0;cards.forEach(c=>{const ok=(active==="All"||c.dataset.sport===active)&&(!query||c.dataset.search.includes(query));c.classList.toggle("hidden",!ok);if(ok)n++});if(shown)shown.textContent=n}buttons.forEach(b=>b.onclick=()=>{active=b.dataset.filter;buttons.forEach(x=>x.classList.toggle("active",x===b));apply()});if(q)q.oninput=apply})();
</script></body></html>
