:#eee8f2;color:#654875}.match{margin:12px 0}.team{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:4px 0}.team strong:first-child{font-family:var(--serif);overflow-wrap:anywhere}.venue{color:var(--muted);font-size:.78rem;border-top:1px solid var(--line);padding-top:10px;line-height:1.4}.hidden{display:none!important}.analytics{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.panel{padding:24px;min-width:0}.bars{display:flex;align-items:flex-end;gap:8px;height:230px;padding-top:24px;overflow-x:auto}.bar-col{min-width:38px;flex:1;text-align:center}.bar{height:var(--h);min-height:3px;background:#315064;border-radius:7px 7px 2px 2px}.bar-col b{display:block;margin-bottom:7px;font-size:.85rem}.bar-col span{display:block;margin-top:6px;font-size:.62rem;color:var(--muted)}.leader{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.passport{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stamp{min-height:104px;border:1px solid var(--line);border-left:5px solid #b7443a;border-radius:18px;display:flex;align-items:center;padding:17px 18px;background:#fffaf0;box-shadow:0 6px 18px rgba(17,43,60,.035)}.stamp b{display:block;font:900 1.05rem/1.18 var(--serif);margin-bottom:7px;overflow-wrap:anywhere}.stamp span{color:var(--muted);font-size:.78rem}.empty{padding:42px;border:1px dashed var(--line);border-radius:22px;background:#fffaf0;color:var(--muted);text-align:center}@media(max-width:900px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.events{grid-template-columns:1fr}.analytics{grid-template-columns:1fr}}@media(max-width:650px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.event-card{grid-template-columns:76px minmax(0,1fr)}.shell{padding:14px}.hero{padding:30px 22px}.head{display:block}.bars{height:210px;padding-top:28px}.passport{grid-template-columns:1fr 1fr}.stamp{min-height:96px;padding:14px}.stamp b{font-size:.96rem}}@media(max-width:390px){.p (async()=>{const D=window.SportsPassportData,[events,config]=await Promise.all([D.load("events"),D.load("config")]);const requested=Number(new URLSearchParams(location.search).get("y")),dataYears=[...new Set(events.map(e=>Number(e.year)))],year=requested||Math.max(...dataYears),current=Number(config.current_year),isCurrent=year===current,isEarly=year<2006,ev=D.yearEvents(events,year).sort((a,b)=>b.date.localeCompare(a.date));document.title=`${year} Year in Sports${isCurrent?' · In Progress':''} | Sports Passport`;const sports=D.counts(ev.map(e=>e.sport)),venues=D.counts(ev.map(e=>e.venue_key).filter(Boolean)),cities=D.counts(ev.map(e=>e.city).filter(Boolean)),teams=D.counts(ev.flatMap(D.eventTeams)),verified=ev.filter(e=>e.attendance_status==="verified").length,notional=ev.filter(e=>e.attendance_status==="notional").length,allYears=[...new Set([...dataYears,current].filter(Boolean))].sort((a,b)=>b-a);const nav=allYears.map(y=>`<a class="${y===year?"current":""}" href="year.html?y=${y}">${y}</a>`).join(""),colors={Baseball:"#b73b3b",Basketball:"#d97718",Football:"#7a4b2d",Hockey:"#4f7f9f",Soccer:"#377a55",Other:"#725b86"};function card(e){const d=new Date(e.date+"T12:00:00"),mon=isNaN(d)?"":d.toLocaleString("en-US",{month:"short"}).toUpperCase(),day=isNaN(d)?"":String(d.getDate()).padStart(2,"0"),label=e.league||e.sport,tm=(e.teams||[]).map((t,i)=>`<div class="team"><strong>${t}</strong><strong>${Number.isFinite(e.scores?.[i])?e.scores[i]:""}</strong></div>`).join(""),confidence=e.attendance_status?`<span class="confidence-badge ${e.attendance_status}">${e.attendance_status==="verified"?"Verified":"Notional"}</span>`:"";return `<article class="event-card" data-sport="${e.sport}" data-search="${`${e.teams?.join(" ")} ${D.eventTeams(e).join(" ")} ${e.venue_recorded} ${e.city} ${label}`.toLowerCase()}" style="--accent:${colors[e.sport]||colors.Other}"><div class="date"><span>${mon}</span><b>${day}</b><span>${label}</span></div><div class="body"><div class="meta"><span>${label}</span><span>${e.city||""}</span>${confidence}</div><div class="match">${tm}</div><div class="venue">${e.venue_recorded||"Venue not recorded"} · ${e.date}</div></div></article>`}const monthCounts=Array(12).fill(0);ev.forEach(e=>{const d=new Date(e.date+"T12:00:00");if(!isNaN(d))monthCounts[d.getMonth()]++});const mm=Math.max(1,...monthCounts),mn=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],bars=monthCounts.map((n,i)=>`<div class="bar-col"><b>${n}</b><div class="bar" style="--h:${n?150*n/mm:3}px"></div><span>${mn[i]}</span></div>`).join(""),rows=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="leader"><span>${k}</span><strong>${n}</strong></div>`).join(""),stamps=Object.entries(cities).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<div class="stamp"><div><b>${c}</b><span>${n} ${n===1?"game":"games"}</span></div></div>`).join(""),most=Object.entries(sports).sort((a,b)=>b[1]-a[1])[0]?.[0]||"—",latest=ev.length?ev.map(e=>e.date).sort().at(-1):null,recordWord=isEarly?"archive record":"documented event",confidenceCopy=isEarly?` This reconstructed early edition contains ${verified} verified and ${notional} notional record${notional===1?"":"s"}; notional entries preserve the shape of the early sports timeline without claiming exact attendance certainty.`:"";document.querySelector("#app").innerHTML=`<section class="hero" data-year="${year}"><div class="kicker">${isCurrent?'<span class="status-pill">In progress</span>':''}Year in Sports · ${year}</div><h1>${year}</h1><div class="deck">${ev.length?(isCurrent?`The live ${year} edition currently includes ${ev.length} documented event${ev.length===1?"":"s"}${latest?` through ${new Date(latest+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric'})}`:''}. It will keep growing as the season continues.`:`A data-driven annual edition built from ${ev.length} ${recordWord}${ev.length===1?"":"s"}.${confidenceCopy}`):`No archive records are available for ${year} yet. This page is ready to populate automatically.`}</div><div class="stats"><div class="stat"><strong>${ev.length}</strong><span>${isEarly?"Archive records":"Games attended"}</span></div><div class="stat"><strong>${Object.keys(sports).length}</strong><span>Sports</span></div><div class="stat"><strong>${Object.keys(venues).length}</strong><span>Venues</span></div><div class="stat"><strong>${Object.keys(cities).length}</strong><span>Cities</span></div><div class="stat"><strong>${Object.keys(teams).length}</strong><span>Teams seen</span></div><div class="stat"><strong>${most}</strong><span>Most watched</span></div></div></section><div class="year-nav">${nav}</div><section class="section"><div class="head"><div><div class="kicker">01 · Ticket Book</div><h2>Every gate.</h2></div><p>${isEarly?"Early records are labeled Verified or Notional. Source team and venue wording is preserved on every card.":"Recent games appear first. Source team labels stay on the ticket cards; search also recognizes canonical team identities."}</p></div>${ev.length?`<div class="controls"><div class="chips">${["All",...Object.keys(sports).sort()].map((s,i)=>`<button class="${i===0?"active":""}" data-filter="${s}">${s}</button>`).join("")}</div><input class="search" id="q" placeholder="Search team, venue, league, city…"><div id="shown-summary">${Math.min(ev.length,12)}${ev.length>12?` of ${ev.length}`:''} shown</div></div>${isEarly?`<div class="confidence-note"><strong>Early-archive confidence:</strong> ${verified} verified · ${notional} notional. Verified records have surviving evidence or direct confirmation; notional records are plausible reconstructions and are not presented as exact attendance facts.</div>`:""}<div class="events">${ev.map(card).join("")}</div>${ev.length>12?`<div class="events-density-control"><button class="density-toggle" id="year-expand" type="button">Show all ${ev.length}</button></div>`:''}`:`<div class="empty">Add ${year} events to the event archive and they will appear here automatically.</div>`}</section>${ev.length?`<section class="section"><div class="head"><div><div class="kicker">02 · Analytics</div><h2>The shape of the year.</h2></div></div><div class="analytics"><div class="panel"><h3>Games by month</h3><div class="bars">${bars}</div></div><div class="panel"><h3>Sport mix</h3>${rows(sports)}<h3 style="margin-top:26px">Venue leaders</h3>${rows(venues)}</div></div></section><section class="section"><div class="head"><div><div class="kicker">03 · Places Collected</div><h2>Cities on the passport.</h2></div></div><div class="passport">${stamps}</div></section>`:""}`;let active="All",expanded=false;const limit=12,buttons=[...document.querySelectorAll("[data-filter]")],cards=[...document.querySelectorAll(".event-card")],q=document.querySelector("#q"),summary=document.querySelector("#shown-summary"),expand=document.querySelector("#year-expand");function apply(){const query=(q?.value||"").toLowerCase(),filteredMode=active!=="All"||!!query;const matches=cards.filter(c=>(active==="All"||c.dataset.sport===active)&&(!query||c.dataset.search.includes(query)));cards.forEach(c=>c.classList.add("hidden"));const visible=(filteredMode||expanded)?matches:matches.slice(0,limit);visible.forEach(c=>c.classList.remove("hidden"));if(summary)summary.textContent=filteredMode?`${visible.length} matched`:(visible.length<matches.length?`${visible.length} of ${matches.length} shown`:`${visible.length} shown`);if(expand){expand.classList.toggle("hidden",filteredMode||matches.length<=limit);expand.textContent=expanded?`Show recent ${limit}`:`Show all ${matches.length}`}}buttons.forEach(b=>b.onclick=()=>{active=b.dataset.filter;buttons.forEach(x=>x.classList.toggle("active",x===b));apply()});if(q)q.oninput=apply;if(expand)expand.onclick=()=>{expanded=!expanded;apply()};apply()})();
