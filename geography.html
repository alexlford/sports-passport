<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geography | Sports Passport</title><link rel="stylesheet" href="assets/site.css"></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Geography</div><nav class="nav"><a href="index.html">Archive</a><a href="venue-map.html">Venue Map</a><a href="venues.html">Venue Profiles</a></nav></header><div id="app"></div></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,[events,venues]=await Promise.all([D.load("events"),D.load("venues")]);const cities=D.counts(events.map(e=>e.city).filter(Boolean)),vcounts=D.counts(events.map(e=>e.venue_key).filter(Boolean));const rows=(obj,n=12)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([k,v])=>`<div class="leader"><span>${k}</span><strong>${v}</strong></div>`).join("");const mapped=venues.filter(v=>Number.isFinite(v.latitude)&&Number.isFinite(v.longitude)).length;document.querySelector("#app").innerHTML=`<section class="hero"><div class="kicker">Live geography desk</div><h1>Places<br>collected.</h1><div class="deck">Cities, physical venues, and stadium coordinates are derived from the same event archive that powers the annual pages.</div><div class="stats"><div class="stat"><strong>${Object.keys(cities).length}</strong><span>Cities</span></div><div class="stat"><strong>${venues.length}</strong><span>Physical venues</span></div><div class="stat"><strong>${mapped}</strong><span>Mapped venues</span></div><div class="stat"><strong>${Object.values(vcounts).reduce((a,b)=>a+b,0)}</strong><span>Venue visits</span></div><div class="stat"><strong>${Math.max(...events.map(e=>e.year))}</strong><span>Latest year</span></div></div></section><section class="section grid2"><div class="panel"><div class="kicker">City leaders</div><h2>Most visited cities</h2>${rows(cities)}</div><div class="panel"><div class="kicker">Venue leaders</div><h2>Most visited venues</h2>${rows(vcounts)}</div></section><section class="section"><div class="cards"><a class="card" href="venue-map.html"><div class="kicker">Interactive</div><h3>Venue Atlas</h3><p>Exact physical venue points, visit counts, and links to every venue profile.</p></a><a class="card" href="venues.html"><div class="kicker">Museum</div><h3>Venue Profiles</h3><p>Visit timelines, recurring teams, coordinates, and artifact cases for every stadium and arena.</p></a></div></section>`})();</script></body></html>
