<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geography | Sports Passport</title><link rel="stylesheet" href="assets/site.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
.geo-map-card{overflow:hidden;border:1px solid var(--line);border-radius:26px;background:#fffdf8;box-shadow:0 14px 40px rgba(17,43,60,.08)}.geo-map-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;background:var(--ink);color:#fff}.geo-map-toolbar b{font-family:var(--serif);font-size:1.05rem}.geo-map-toolbar button{min-height:40px;padding:8px 12px;border:1px solid rgba(255,255,255,.32);border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-weight:850;cursor:pointer}.geo-map{height:clamp(430px,56vw,640px);width:100%;background:#dbe8e7}.geo-map .leaflet-control-attribution{font-size:.68rem}.geo-map .leaflet-popup-content-wrapper{border-radius:16px;box-shadow:0 12px 34px rgba(17,43,60,.2)}.geo-map .leaflet-popup-content{margin:15px 17px;line-height:1.45}.geo-popup-title{font:900 1.05rem var(--serif);color:var(--ink);margin-bottom:5px}.geo-popup-meta{color:var(--muted);font-size:.82rem}.geo-popup-link{display:inline-block;margin-top:9px;font-weight:900;color:var(--ink)}.geo-popup-ranks{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.rank-chip{display:inline-flex;padding:4px 7px;border-radius:999px;background:#efe6d6;color:var(--ink);font-size:.68rem;font-weight:900}.venue-marker{display:grid;place-items:center;border:2px solid #fff;border-radius:999px;background:var(--red);color:#fff;font-weight:950;box-shadow:0 3px 10px rgba(0,0,0,.32);font-size:.68rem}.venue-marker.frequent{background:var(--ink)}.venue-marker.ranked{box-shadow:0 0 0 3px #d5a72d,0 3px 10px rgba(0,0,0,.32)}.map-legend{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;padding:13px 16px;color:var(--muted);font-size:.82rem;background:#fffdf8}.map-legend a{font-weight:900}.legend-chip{display:inline-flex;align-items:center;gap:7px}.legend-dot{width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid #fff;box-shadow:0 0 0 1px rgba(17,43,60,.16)}.legend-dot.ranked{box-shadow:0 0 0 3px #d5a72d}.confidence-note{margin-top:16px;padding:13px 15px;border:1px solid var(--line);border-left:5px solid #725b86;border-radius:14px;background:#fffaf0;color:var(--muted);line-height:1.45}.venue-leader-link{color:inherit;text-decoration:none;font-weight:800}.venue-leader-link:hover,.venue-leader-link:focus-visible{text-decoration:underline}@media(max-width:700px){.geo-map{height:470px}.geo-map-toolbar{align-items:flex-start}.geo-map-toolbar b{font-size:.95rem}.map-legend{display:block}.map-legend a{display:block;margin-top:10px}}
</style></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Geography</div><nav class="nav"><a href="index.html">Archive</a><a href="venue-map.html">Venue Map</a><a href="venues.html">Venue Profiles</a></nav></header><div id="app"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,[events,venues,rankings]=await Promise.all([D.load("events"),D.load("venues"),D.load("curated-rankings")]);const confirmed=events.filter(e=>Number(e.year)>=2006||e.attendance_status==="verified"),notional=events.filter(e=>e.attendance_status==="notional").length,cities=D.counts(events.map(e=>e.city).filter(Boolean)),vcounts=D.counts(events.map(e=>e.venue_key).filter(Boolean)),venueByKey=Object.fromEntries(venues.map(v=>[v.key,v]));const favoriteBySlug=new Map((rankings.favorite_venues||[]).flatMap(r=>(r.venue_slugs||[]).map(s=>[s,r.rank]))),bestBySlug=new Map((rankings.best_venues||[]).flatMap(r=>(r.venue_slugs||[]).map(s=>[s,r.rank]))),rankedSlugs=new Set([...favoriteBySlug.keys(),...bestBySlug.keys()]);const rows=(obj,n=12)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([k,v])=>`<div class="leader"><span>${k}</span><strong>${v}</strong></div>`).join("");const venueRows=(obj,n=12)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([key,count])=>{const v=venueByKey[key],label=v?.display_name||key,href=v?.slug?`venue-profile.html?v=${encodeURIComponent(v.slug)}`:null;return `<div class="leader"><span>${href?`<a class="venue-leader-link" href="${href}">${label}</a>`:label}</span><strong>${count}</strong></div>`}).join("");const mappedVenues=venues.filter(v=>Number.isFinite(v.latitude)&&Number.isFinite(v.longitude)),mapped=mappedVenues.length,rankedMapped=mappedVenues.filter(v=>rankedSlugs.has(v.slug)).length;document.querySelector("#app").innerHTML=`<section class="hero"><div class="kicker">Live geography desk</div><h1>Places<br>collected.</h1><div class="deck">Cities, physical venues, exact stadium coordinates, and the personal venue canon are derived from the same archive.</div><div class="stats"><div class="stat"><strong>${Object.keys(cities).length}</strong><span>Archive cities</span></div><div class="stat"><strong>${venues.length}</strong><span>Physical venues</span></div><div class="stat"><strong>${mapped}</strong><span>Mapped venues</span></div><div class="stat"><strong>${rankedMapped}</strong><span>Ranked venues mapped</span></div><div class="stat"><strong>${confirmed.filter(e=>e.venue_key).length}</strong><span>Confirmed / documented</span></div></div><div class="confidence-note"><strong>Geography methodology.</strong> The map and leaderboards describe the full archive footprint, including ${notional} explicitly notional pre-2006 reconstruction${notional===1?'':'s'}. Gold-ringed markers are venues appearing in either the Favorite Venues or Best Venues Top 10.</div></section><section class="section"><div class="head"><div><div class="kicker">Stadium atlas</div><h2>Where the archive happened.</h2></div><p>A geographic map of every registered stadium and arena in the archive. Pan, zoom, and tap a marker for venue history, rankings, and its profile.</p></div><div class="geo-map-card"><div class="geo-map-toolbar"><b>Archive venue footprint</b><button id="reset-map" type="button">Reset view</button></div><div class="geo-map" id="geo-map" aria-label="Interactive map of sports venues"></div><div class="map-legend"><span class="legend-chip"><i class="legend-dot"></i>marker number = archive visits · dark = 10+ visits</span><span class="legend-chip"><i class="legend-dot ranked"></i>gold ring = Top 10 venue</span><a href="venue-map.html">Open the full Venue Atlas →</a></div></div></section><section class="section grid2"><div class="panel"><div class="kicker">City leaders</div><h2>Most common archive cities</h2>${rows(cities)}</div><div class="panel"><div class="kicker">Venue leaders</div><h2>Most common archive venues</h2>${venueRows(vcounts)}</div></section><section class="section"><div class="cards"><a class="card" href="favorites.html#favorite-venues"><div class="kicker">Personal canon</div><h3>Ranked Venues</h3><p>Compare the venues I personally love with the best venues I have visited on their own merits.</p></a><a class="card" href="venue-map.html"><div class="kicker">Interactive</div><h3>Full Venue Atlas</h3><p>Explore the same exact venue points in a larger map with direct links to every venue profile.</p></a><a class="card" href="venues.html"><div class="kicker">Museum</div><h3>Venue Profiles</h3><p>Archive and confirmed visit counts, timelines, recurring canonical teams, rankings, and artifact cases for every stadium and arena.</p></a></div></section>`;
const map=L.map('geo-map',{scrollWheelZoom:false,zoomControl:true});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);const bounds=[];mappedVenues.forEach(v=>{const n=vcounts[v.key]||0,size=n>=10?34:n>=4?28:23,fav=favoriteBySlug.get(v.slug),best=bestBySlug.get(v.slug),ranked=!!(fav||best);const icon=L.divIcon({className:'',html:`<div class="venue-marker ${n>=10?'frequent':''} ${ranked?'ranked':''}" style="width:${size}px;height:${size}px">${n||''}</div>`,iconSize:[size,size],iconAnchor:[size/2,size/2],popupAnchor:[0,-size/2]});const marker=L.marker([v.latitude,v.longitude],{icon,title:v.display_name,alt:v.display_name,keyboard:true}).addTo(map);const venueEvents=D.venueEvents(events,v.key),confirmedVisits=venueEvents.filter(e=>Number(e.year)>=2006||e.attendance_status==="verified").length,ranks=`${fav?`<span class="rank-chip">#${fav} Favorite Venue</span>`:''}${best?`<span class="rank-chip">#${best} Best Venue</span>`:''}`;marker.bindPopup(`<div class="geo-popup-title">${v.display_name}</div><div class="geo-popup-meta">${v.city} · ${n} archive visit${n===1?'':'s'} · ${confirmedVisits} confirmed/documented<br>${v.latitude.toFixed(5)}, ${v.longitude.toFixed(5)}</div>${ranks?`<div class="geo-popup-ranks">${ranks}</div>`:''}<a class="geo-popup-link" href="venue-profile.html?v=${encodeURIComponent(v.slug)}">Open venue profile →</a>`);bounds.push([v.latitude,v.longitude])});const fit=()=>{if(bounds.length)map.fitBounds(bounds,{padding:[28,28],maxZoom:5})};fit();document.querySelector('#reset-map').addEventListener('click',fit);setTimeout(()=>map.invalidateSize(),100)})();</script></body></html>
