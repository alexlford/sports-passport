<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geography | Sports Passport</title><link rel="stylesheet" href="assets/site.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
.geo-map-card{overflow:hidden;border:1px solid var(--line);border-radius:26px;background:#fffdf8;box-shadow:0 14px 40px rgba(17,43,60,.08)}.geo-map-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;background:var(--ink);color:#fff}.geo-map-toolbar b{font-family:var(--serif);font-size:1.05rem}.geo-map-toolbar button{min-height:40px;padding:8px 12px;border:1px solid rgba(255,255,255,.32);border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-weight:850;cursor:pointer}.geo-map{height:clamp(430px,56vw,640px);width:100%;background:#dbe8e7}.geo-map .leaflet-control-attribution{font-size:.68rem}.geo-map .leaflet-popup-content-wrapper{border-radius:16px;box-shadow:0 12px 34px rgba(17,43,60,.2)}.geo-map .leaflet-popup-content{margin:15px 17px;line-height:1.45}.geo-popup-title{font:900 1.05rem var(--serif);color:var(--ink);margin-bottom:5px}.geo-popup-meta{color:var(--muted);font-size:.82rem}.geo-popup-link{display:inline-block;margin-top:9px;font-weight:900;color:var(--ink)}.venue-marker{display:grid;place-items:center;border:2px solid #fff;border-radius:999px;background:var(--red);color:#fff;font-weight:950;box-shadow:0 3px 10px rgba(0,0,0,.32);font-size:.68rem}.venue-marker.frequent{background:var(--ink)}.map-legend{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;padding:13px 16px;color:var(--muted);font-size:.82rem;background:#fffdf8}.map-legend a{font-weight:900}.legend-chip{display:inline-flex;align-items:center;gap:7px}.legend-dot{width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid #fff;box-shadow:0 0 0 1px rgba(17,43,60,.16)}@media(max-width:700px){.geo-map{height:470px}.geo-map-toolbar{align-items:flex-start}.geo-map-toolbar b{font-size:.95rem}.map-legend{display:block}.map-legend a{display:block;margin-top:10px}}
</style></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Geography</div><nav class="nav"><a href="index.html">Archive</a><a href="venue-map.html">Venue Map</a><a href="venues.html">Venue Profiles</a></nav></header><div id="app"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,[events,venues]=await Promise.all([D.load("events"),D.load("venues")]);const cities=D.counts(events.map(e=>e.city).filter(Boolean)),vcounts=D.counts(events.map(e=>e.venue_key).filter(Boolean));const rows=(obj,n=12)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([k,v])=>`<div class="leader"><span>${k}</span><strong>${v}</strong></div>`).join("");const mappedVenues=venues.filter(v=>Number.isFinite(v.latitude)&&Number.isFinite(v.longitude)),mapped=mappedVenues.length;document.querySelector("#app").innerHTML=`<section class="hero"><div class="kicker">Live geography desk</div><h1>Places<br>collected.</h1><div class="deck">Cities, physical venues, and exact stadium coordinates are derived from the same event archive that powers the annual pages.</div><div class="stats"><div class="stat"><strong>${Object.keys(cities).length}</strong><span>Cities</span></div><div class="stat"><strong>${venues.length}</strong><span>Physical venues</span></div><div class="stat"><strong>${mapped}</strong><span>Mapped venues</span></div><div class="stat"><strong>${Object.values(vcounts).reduce((a,b)=>a+b,0)}</strong><span>Venue visits</span></div><div class="stat"><strong>${Math.max(...events.map(e=>e.year))}</strong><span>Latest year</span></div></div></section><section class="section"><div class="head"><div><div class="kicker">Stadium atlas</div><h2>Where the archive happened.</h2></div><p>A real geographic map of the stadiums and arenas in the archive. Pan, zoom, and tap a marker for the venue profile.</p></div><div class="geo-map-card"><div class="geo-map-toolbar"><b>Venue footprint</b><button id="reset-map" type="button">Reset view</button></div><div class="geo-map" id="geo-map" aria-label="Interactive map of sports venues"></div><div class="map-legend"><span class="legend-chip"><i class="legend-dot"></i>${mapped} mapped physical venues · dark markers = 10+ visits</span><a href="venue-map.html">Open the full Venue Atlas →</a></div></div></section><section class="section grid2"><div class="panel"><div class="kicker">City leaders</div><h2>Most visited cities</h2>${rows(cities)}</div><div class="panel"><div class="kicker">Venue leaders</div><h2>Most visited venues</h2>${rows(vcounts)}</div></section><section class="section"><div class="cards"><a class="card" href="venue-map.html"><div class="kicker">Interactive</div><h3>Full Venue Atlas</h3><p>Explore the same exact venue points in a larger map with direct links to every venue profile.</p></a><a class="card" href="venues.html"><div class="kicker">Museum</div><h3>Venue Profiles</h3><p>Visit timelines, recurring teams, coordinates, and artifact cases for every stadium and arena.</p></a></div></section>`;
const map=L.map('geo-map',{scrollWheelZoom:false,zoomControl:true});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);const bounds=[];mappedVenues.forEach(v=>{const n=vcounts[v.key]||0,size=n>=10?34:n>=4?28:23;const icon=L.divIcon({className:'',html:`<div class="venue-marker ${n>=10?'frequent':''}" style="width:${size}px;height:${size}px">${n||''}</div>`,iconSize:[size,size],iconAnchor:[size/2,size/2],popupAnchor:[0,-size/2]});const marker=L.marker([v.latitude,v.longitude],{icon,title:v.display_name,alt:v.display_name,keyboard:true}).addTo(map);marker.bindPopup(`<div class="geo-popup-title">${v.display_name}</div><div class="geo-popup-meta">${v.city} · ${n} visit${n===1?'':'s'}<br>${v.latitude.toFixed(5)}, ${v.longitude.toFixed(5)}</div><a class="geo-popup-link" href="venue-profile.html?v=${encodeURIComponent(v.slug)}">Open venue profile →</a>`);bounds.push([v.latitude,v.longitude])});const fit=()=>{if(bounds.length)map.fitBounds(bounds,{padding:[28,28],maxZoom:5})};fit();document.querySelector('#reset-map').addEventListener('click',fit);setTimeout(()=>map.invalidateSize(),100)})();</script></body></html>
