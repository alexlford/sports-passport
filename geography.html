<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geography | Sports Passport</title><link rel="stylesheet" href="assets/site.css"><style>
.geo-map-shell{position:relative;aspect-ratio:1000/560;border-radius:28px;overflow:hidden;background:linear-gradient(#e7efe9,#f8f2e7);border:1px solid var(--line);box-shadow:inset 0 0 0 1px #fff8}.geo-land{position:absolute;inset:6% 4%;opacity:.38}.geo-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(17,43,60,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(17,43,60,.045) 1px,transparent 1px);background-size:10% 10%;pointer-events:none}.geo-pin{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:var(--red);box-shadow:0 3px 9px #0004;cursor:pointer;padding:0;z-index:3}.geo-pin.hot{width:34px;height:34px}.geo-pin span{display:none}.geo-pin.hot span{display:block;color:#fff;font-size:.66rem;font-weight:950}.geo-pin:hover,.geo-pin:focus-visible{outline:3px solid #112b3c66;z-index:8}.geo-tip{position:absolute;z-index:12;display:none;width:min(330px,84%);background:#fffdf8;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 14px 34px #0003;pointer-events:none}.geo-tip b{font-family:var(--serif);font-size:1.05rem}.geo-tip small{display:block;color:var(--muted);margin-top:5px;line-height:1.45}.map-legend{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:.82rem}.map-legend a{font-weight:900}.map-dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:-1px}@media(max-width:800px){.geo-map-shell{aspect-ratio:4/3}.geo-pin{width:19px;height:19px}.geo-pin.hot{width:29px;height:29px}.geo-land{inset:10% 2%}}
</style></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Geography</div><nav class="nav"><a href="index.html">Archive</a><a href="venue-map.html">Venue Map</a><a href="venues.html">Venue Profiles</a></nav></header><div id="app"></div></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,[events,venues]=await Promise.all([D.load("events"),D.load("venues")]);const cities=D.counts(events.map(e=>e.city).filter(Boolean)),vcounts=D.counts(events.map(e=>e.venue_key).filter(Boolean));const rows=(obj,n=12)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([k,v])=>`<div class="leader"><span>${k}</span><strong>${v}</strong></div>`).join("");const mappedVenues=venues.filter(v=>Number.isFinite(v.latitude)&&Number.isFinite(v.longitude)),mapped=mappedVenues.length;document.querySelector("#app").innerHTML=`<section class="hero"><div class="kicker">Live geography desk</div><h1>Places<br>collected.</h1><div class="deck">Cities, physical venues, and stadium coordinates are derived from the same event archive that powers the annual pages.</div><div class="stats"><div class="stat"><strong>${Object.keys(cities).length}</strong><span>Cities</span></div><div class="stat"><strong>${venues.length}</strong><span>Physical venues</span></div><div class="stat"><strong>${mapped}</strong><span>Mapped venues</span></div><div class="stat"><strong>${Object.values(vcounts).reduce((a,b)=>a+b,0)}</strong><span>Venue visits</span></div><div class="stat"><strong>${Math.max(...events.map(e=>e.year))}</strong><span>Latest year</span></div></div></section><section class="section"><div class="head"><div><div class="kicker">Stadium atlas</div><h2>Where the archive happened.</h2></div><p>Each marker is a physical stadium or arena, not a city-center approximation. Larger numbered markers are your most frequently visited venues.</p></div><div class="geo-map-shell" id="geo-map"><div class="geo-grid"></div><svg class="geo-land" viewBox="0 0 1000 560" aria-hidden="true"><path fill="#9fb4a5" stroke="#617a6b" stroke-width="2" d="M56 90 L128 64 210 72 268 54 336 68 405 58 472 75 530 65 590 82 640 74 692 92 736 82 788 112 842 118 900 154 930 208 910 250 930 300 895 326 860 320 832 352 800 374 760 366 735 404 700 416 668 454 620 462 590 444 550 468 510 454 475 474 432 458 392 470 350 448 310 454 270 430 230 438 200 410 166 408 142 378 112 370 94 334 72 318 80 282 60 252 72 220 52 188 66 152 50 126 Z"/></svg><div class="geo-tip" id="geo-tip"></div></div><div class="map-legend"><span><i class="map-dot"></i>${mapped} exact venue points · tap a marker to open its profile</span><a href="venue-map.html">Open the full Venue Atlas →</a></div></section><section class="section grid2"><div class="panel"><div class="kicker">City leaders</div><h2>Most visited cities</h2>${rows(cities)}</div><div class="panel"><div class="kicker">Venue leaders</div><h2>Most visited venues</h2>${rows(vcounts)}</div></section><section class="section"><div class="cards"><a class="card" href="venue-map.html"><div class="kicker">Interactive</div><h3>Full Venue Atlas</h3><p>Explore exact physical venue points, visit counts, coordinates, and links to every venue profile.</p></a><a class="card" href="venues.html"><div class="kicker">Museum</div><h3>Venue Profiles</h3><p>Visit timelines, recurring teams, coordinates, and artifact cases for every stadium and arena.</p></a></div></section>`;
const map=document.querySelector('#geo-map'),tip=document.querySelector('#geo-tip');const counts=Object.fromEntries(venues.map(v=>[v.key,D.venueEvents(events,v.key).length]));function xy(lat,lon){return[(lon+125)/59*100,(50-lat)/26*100]}mappedVenues.forEach(v=>{const[x,y]=xy(v.latitude,v.longitude),n=counts[v.key]||0,p=document.createElement('button');p.className='geo-pin'+(n>=10?' hot':'');p.style.left=x+'%';p.style.top=y+'%';p.setAttribute('aria-label',`${v.display_name}, ${n} visits`);p.innerHTML=`<span>${n}</span>`;const show=()=>{tip.innerHTML=`<b>${v.display_name}</b><small>${v.city} · ${n} visit${n===1?'':'s'}<br>${v.latitude.toFixed(5)}, ${v.longitude.toFixed(5)}</small>`;tip.style.display='block';let tx=p.offsetLeft+18,ty=p.offsetTop+18;if(tx+340>map.clientWidth)tx=p.offsetLeft-320;if(ty+110>map.clientHeight)ty=p.offsetTop-105;tip.style.left=Math.max(8,tx)+'px';tip.style.top=Math.max(8,ty)+'px'};p.addEventListener('mouseenter',show);p.addEventListener('focus',show);p.addEventListener('mouseleave',()=>tip.style.display='none');p.addEventListener('blur',()=>tip.style.display='none');p.addEventListener('click',()=>location.href=`venue-profile.html?v=${encodeURIComponent(v.slug)}`);map.appendChild(p)})})();</script></body></html>
