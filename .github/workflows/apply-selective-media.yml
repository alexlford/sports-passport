name: Apply Selective Archive Media

on:
  push:
    branches: [audit/selective-media-artifacts]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/selective-media-artifacts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply selective media integration
        run: python tools/apply_selective_media.py
      - name: Refresh data cache version
        run: python tools/generate_cache_manifest.py
      - name: Regenerate first-class routes
        run: python tools/generate_routes.py
      - name: Validate selective media integration
        run: |
          python tools/validate_artifacts.py
          python tools/validate_event_passports.py
          python tools/validate_cache_policy.py
          python tools/validate_site.py
      - name: Commit generated tranche
        run: |
          rm tools/apply_selective_media.py .github/workflows/apply-selective-media.yml
          git config user.name "sports-passport-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add selective archive media and artifact context"
          git push origin HEAD:audit/selective-media-artifacts
