name: Extract Final Public CSS

on:
  push:
    branches: [refactor/final-public-css]

permissions:
  contents: write

concurrency:
  group: extract-final-public-css
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/final-public-css
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Move remaining public page-local CSS into owning stylesheets
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          targets = {
              'event.html': 'event.css',
              'team-profile.html': 'team-profile.css',
              'venue-profile.html': 'venue-profile.css',
              'journey-profile.html': 'journey-profile.css',
              'phase.html': 'phase.css',
              'hall-of-fame.html': 'hall-of-fame.css',
          }
          pattern = re.compile(r'<style(?:\s[^>]*)?>(.*?)</style>', re.I | re.S)

          for html_name, css_name in targets.items():
              path = root / html_name
              text = path.read_text(encoding='utf-8')
              match = pattern.search(text)
              if not match:
                  print(f'SKIP {html_name}: no inline style block')
                  continue
              css = match.group(1).strip() + '\n'
              css_path = root / 'assets' / css_name
              if css_path.exists():
                  raise SystemExit(f'Refusing to overwrite existing {css_path}')
              css_path.write_text(css, encoding='utf-8')
              links = ''
              if 'href="assets/site.css"' not in text and "href='assets/site.css'" not in text:
                  links += '<link rel="stylesheet" href="assets/site.css">'
              links += f'<link rel="stylesheet" href="assets/{css_name}">'
              text = text[:match.start()] + links + text[match.end():]
              path.write_text(text, encoding='utf-8')
              print(f'EXTRACT {html_name} -> assets/{css_name}')

          core_public_templates = [
              'index.html', 'annuals.html', 'year.html', 'event.html',
              'teams.html', 'team-profile.html', 'venues.html', 'venue-profile.html',
              'geography.html', 'venue-map.html', 'journeys.html', 'journey-profile.html',
              'phase.html', 'favorites.html', 'lifetime-analytics.html',
              'hall-of-fame.html', 'about.html',
          ]
          remaining = [name for name in core_public_templates if pattern.search((root / name).read_text(encoding='utf-8'))]
          if remaining:
              raise SystemExit('Core public templates still contain inline <style> blocks: ' + ', '.join(remaining))
      - name: Regenerate clean routes
        run: python tools/generate_routes.py
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/extract-final-public-css.yml
          git config user.name "sports-passport-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Extract final public page styles"
          git push origin HEAD:refactor/final-public-css
