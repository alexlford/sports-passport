name: Validate Sports Passport

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate archive data
        run: python tools/validate_data.py
      - name: Validate Personal Canon and cross-links
        run: python tools/validate_canon.py
      - name: Validate exact event passports
        run: python tools/validate_event_passports.py
      - name: Validate artifact catalog
        run: python tools/validate_artifacts.py
      - name: Validate clean public URLs
        run: python tools/validate_clean_urls.py
      - name: Validate data cache policy
        run: python tools/validate_cache_policy.py
      - name: Validate public route identities
        run: python tools/validate_route_identities.py
      - name: Validate generated archive freshness
        run: |
          python tools/generate_cache_manifest.py
          python tools/generate_routes.py
          git diff --exit-code -- data/cache-manifest.json about analytics chapters events favorites geography hall-of-fame journeys teams venues years sitemap.xml
      - name: Validate static fragment targets
        run: python tools/validate_fragments.py
      - name: Validate generated link targets
        run: python tools/validate_generated_links.py
      - name: Validate public navigation polish
        run: python tools/validate_navigation.py
      - name: Validate public storytelling polish
        run: python tools/validate_public_copy.py
      - name: Validate visual hierarchy and density
        run: python tools/validate_visual_polish.py
      - name: Validate site integrity
        run: python tools/validate_site.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser-test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare diagnostics
        run: mkdir -p diagnostics
      - name: Desktop route rendering and overflow
        id: desktop_routes
        continue-on-error: true
        run: npx playwright test tests/browser/smoke.spec.js --project=desktop --grep "renders without overflow"
      - name: Tablet route rendering and overflow
        id: tablet_routes
        if: always()
        continue-on-error: true
        run: npx playwright test tests/browser/smoke.spec.js --project=tablet --grep "renders without overflow"
      - name: Phone route rendering and overflow
        id: phone_routes
        if: always()
        continue-on-error: true
        run: npx playwright test tests/browser/smoke.spec.js --project=phone --grep "renders without overflow"
      - name: Desktop interaction regressions
        id: desktop_interactions
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/browser/smoke.spec.js --project=desktop --grep-invert "renders without overflow|mobile navigation" 2>&1 | tee diagnostics/desktop-interactions.log
      - name: Mobile navigation regression
        id: mobile_navigation
        if: always()
        continue-on-error: true
        run: npx playwright test tests/browser/smoke.spec.js --project=phone --grep "mobile navigation"
      - name: Critical accessibility scan
        id: accessibility
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/browser/accessibility.spec.js --project=desktop 2>&1 | tee diagnostics/accessibility.log
      - name: Upload browser diagnostics
        if: ${{ always() && (steps.desktop_routes.outcome == 'failure' || steps.tablet_routes.outcome == 'failure' || steps.phone_routes.outcome == 'failure' || steps.desktop_interactions.outcome == 'failure' || steps.mobile_navigation.outcome == 'failure' || steps.accessibility.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            diagnostics/
            test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Require desktop routes
        if: always()
        run: test "${{ steps.desktop_routes.outcome }}" = "success"
      - name: Require tablet routes
        if: always()
        run: test "${{ steps.tablet_routes.outcome }}" = "success"
      - name: Require phone routes
        if: always()
        run: test "${{ steps.phone_routes.outcome }}" = "success"
      - name: Require desktop interactions
        if: always()
        run: test "${{ steps.desktop_interactions.outcome }}" = "success"
      - name: Require mobile navigation
        if: always()
        run: test "${{ steps.mobile_navigation.outcome }}" = "success"
      - name: Require accessibility
        if: always()
        run: test "${{ steps.accessibility.outcome }}" = "success"
