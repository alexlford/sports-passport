name: Validate Sports Passport

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate archive data
        run: python tools/validate_data.py
      - name: Validate Personal Canon and cross-links
        run: python tools/validate_canon.py
      - name: Validate exact event passports
        run: python tools/validate_event_passports.py
      - name: Validate artifact catalog
        run: python tools/validate_artifacts.py
      - name: Validate clean public URLs
        run: python tools/validate_clean_urls.py
      - name: Validate public route identities
        run: python tools/validate_route_identities.py
      - name: Validate static fragment targets
        run: python tools/validate_fragments.py
      - name: Validate generated link targets
        run: python tools/validate_generated_links.py
      - name: Validate public navigation polish
        run: python tools/validate_navigation.py
      - name: Validate public storytelling polish
        run: python tools/validate_public_copy.py
      - name: Validate visual hierarchy and density
        run: python tools/validate_visual_polish.py
      - name: Validate site integrity
        run: python tools/validate_site.py
