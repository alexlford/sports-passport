name: Finish Event Passport

on:
  push:
    branches:
      - audit/event-passport-atomic

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/event-passport-atomic
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Event Passport changes
        run: python tools/apply_event_passport_atomic.py
      - name: Regenerate first-class routes
        run: python tools/generate_routes.py
      - name: Validate Event Passport changes
        run: |
          python tools/validate_event_passports.py
          python tools/validate_site.py
      - name: Remove helper files and commit
        run: |
          rm tools/apply_event_passport_atomic.py
          rm .github/workflows/finish-event-passport.yml
          git config user.name "sports-passport-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Make Event Passport the atomic archive unit"
          git push origin HEAD:audit/event-passport-atomic
