name: Apply Archive Desk Guide

on:
  push:
    branches: [audit/clarify-archive-desks]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/clarify-archive-desks
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire archive desk guide
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/sports-passport-data.js')
          s=p.read_text()
          anchor="  ensureStyle('/assets/accessibility.css', 'data-sports-passport-accessibility');\n"
          addition="""  ensureStyle('/assets/accessibility.css', 'data-sports-passport-accessibility');

  if (!document.querySelector('script[data-sports-passport-archive-desks]')) {
    const deskGuide = document.createElement('script');
    deskGuide.src = '/assets/archive-desks.js';
    deskGuide.defer = true;
    deskGuide.dataset.sportsPassportArchiveDesks = 'true';
    document.head.appendChild(deskGuide);
  }
"""
          if addition not in s:
              if anchor not in s: raise SystemExit('archive desk injection anchor missing')
              s=s.replace(anchor, addition, 1)
          p.write_text(s)
          PY
      - name: Commit runtime wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sports-passport-data.js
          git commit -m "Load archive desk guide"
          git push origin HEAD:audit/clarify-archive-desks
