name: Generate Static Routes

on:
  push:
    branches: [audit/static-routing]

permissions:
  contents: write

concurrency:
  group: static-route-generation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/static-routing
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate first-class route pages
        run: python tools/generate_routes.py
      - name: Commit generated route pages
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Generated routes are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about analytics chapters events favorites geography hall-of-fame journeys teams venues years sitemap.xml
          git commit -m "Generate static route pages"
          git push origin HEAD:audit/static-routing
