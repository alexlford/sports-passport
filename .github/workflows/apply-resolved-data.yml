name: Apply Resolved Public Data

on:
  push:
    branches: [audit/compiled-resolved-data]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/compiled-resolved-data
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Integrate compiled runtime
        run: python tools/apply_resolved_runtime.py
      - name: Build resolved data
        run: python tools/build_resolved_data.py
      - name: Refresh data cache version
        run: python tools/generate_cache_manifest.py
      - name: Regenerate first-class routes
        run: python tools/generate_routes.py
      - name: Validate resolved runtime
        run: |
          python tools/build_resolved_data.py --check
          python tools/validate_resolved_runtime.py
          python tools/validate_data.py
          python tools/validate_cache_policy.py
          python tools/validate_site.py
      - name: Commit generated tranche
        run: |
          rm tools/apply_resolved_runtime.py .github/workflows/apply-resolved-data.yml
          git config user.name "sports-passport-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Compile authoring overlays into resolved public data"
          git push origin HEAD:audit/compiled-resolved-data
