name: Apply Record Book
on:
  push:
    branches: [audit/record-book]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/record-book
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update homepage label and generated route
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('<a href="hall-of-fame.html">Hall of Fame</a>','<a href="hall-of-fame.html">Record Book</a>')
          p.write_text(s)
          PY
          python tools/generate_routes.py
          python tools/apply_event_indexing.py
          python tools/generate_sitemap.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hall-of-fame sitemap.xml events
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate Record Book route"
          git push origin HEAD:audit/record-book
