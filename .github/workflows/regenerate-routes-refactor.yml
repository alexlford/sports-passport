name: Regenerate Static Route Refactor

on:
  push:
    branches: [refactor/venue-atlas-css]

permissions:
  contents: write

concurrency:
  group: regenerate-static-route-refactor
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/venue-atlas-css
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python tools/generate_cache_manifest.py
          python tools/generate_routes.py
      - shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geography sitemap.xml data/cache-manifest.json
          git commit -m "Regenerate Venue Atlas route"
          git push origin HEAD:refactor/venue-atlas-css
