name: Finish Global Search

on:
  push:
    branches: [audit/global-search]

permissions:
  contents: write

concurrency:
  group: finish-global-search
  cancel-in-progress: true

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/global-search
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire search route, chrome, validation, and tests
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root=Path('.')
          def replace(path, old, new, count=1):
              p=root/path
              text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected token in {path}: {old[:100]}')
              p.write_text(text.replace(old,new,count),encoding='utf-8')

          # Generated static search route.
          replace('tools/generate_routes.py', '    "/hall-of-fame/": "hall-of-fame.html",\n}', '    "/hall-of-fame/": "hall-of-fame.html",\n    "/search/": "search.html",\n}')
          replace('tools/generate_routes.py', '"favorites", "analytics", "hall-of-fame"):', '"favorites", "analytics", "hall-of-fame", "search"):')

          # Clean route normalization while leaving the five primary destinations unchanged.
          replace('assets/clean-urls.js', "    '/journeys/','/chapters/','/favorites/','/analytics/','/hall-of-fame/'\n", "    '/journeys/','/chapters/','/favorites/','/analytics/','/hall-of-fame/','/search/'\n")
          replace('assets/clean-urls.js', "    else if (file === 'hall-of-fame.html') path = '/hall-of-fame/';\n", "    else if (file === 'hall-of-fame.html') path = '/hall-of-fame/';\n    else if (file === 'search.html') path = '/search/';\n")
          replace('assets/clean-urls.js', "    if (pathname.startsWith('/about/')) return 'about';\n", "    if (pathname.startsWith('/about/')) return 'about';\n    if (pathname.startsWith('/search/')) return 'search';\n")
          replace('assets/clean-urls.js', "      });\n    }\n\n    const footer = document.querySelector('.site-footer');", "      });\n      const search = header.querySelector('.global-search-link');\n      if (search) {\n        search.setAttribute('href','/search/');\n        search.classList.toggle('active', active === 'search');\n        if (active === 'search') search.setAttribute('aria-current','page');\n        else search.removeAttribute('aria-current');\n      }\n    }\n\n    const footer = document.querySelector('.site-footer');")

          # Shared runtime: publication metadata + a utility Search control outside primary nav.
          replace('assets/sports-passport-data.js', "      'hall-of-fame.html':['Hall of Fame | Sports Passport','Confirmed archive records and Alex Ford’s curated Personal Canon of top live-sports experiences.']\n", "      'hall-of-fame.html':['Hall of Fame | Sports Passport','Confirmed archive records and Alex Ford’s curated Personal Canon of top live-sports experiences.'],\n      'search.html':['Archive Search | Sports Passport','Search Alex Ford’s Sports Passport archive across live events, teams, venues, cities, and years.']\n")
          replace('assets/sports-passport-data.js', "    const toggle = header.querySelector('.menu-toggle');\n", "    const toggle = header.querySelector('.menu-toggle');\n    const tools = document.createElement('div');\n    tools.className = 'site-header-tools';\n    const searchLink = document.createElement('a');\n    searchLink.className = 'global-search-link';\n    searchLink.href = '/search/';\n    searchLink.textContent = 'Search';\n    tools.appendChild(searchLink);\n    if (toggle) tools.appendChild(toggle);\n    header.appendChild(tools);\n")

          chrome=root/'assets/chrome.css'
          chrome_text=chrome.read_text(encoding='utf-8')
          addition="""\n.site-header .site-header-tools{display:flex;align-items:center;gap:5px;margin-left:2px}\n.site-header .global-search-link{min-height:40px;display:inline-flex;align-items:center;padding:9px 11px;border:1px solid var(--line,rgba(17,43,60,.16));border-radius:999px;background:rgba(255,253,248,.7);color:var(--ink,#112b3c);text-decoration:none;font-size:.78rem;font-weight:850;white-space:nowrap}\n.site-header .global-search-link:hover,.site-header .global-search-link:focus-visible{background:rgba(17,43,60,.08)}\n.site-header .global-search-link.active{background:var(--ink,#112b3c);color:#fff}\n@media(max-width:1040px){.site-header .site-header-tools{margin-left:auto}.site-header .global-search-link{min-height:44px;padding:10px 12px}}\n@media(max-width:430px){.site-header .site-header-tools{gap:4px}.site-header .global-search-link{padding:10px}}\n"""
          if '.global-search-link' not in chrome_text:
              chrome.write_text(chrome_text.rstrip()+addition,encoding='utf-8')

          # Sitemap publishes the new first-class utility route.
          sitemap=root/'sitemap.xml'
          tree=ET.parse(sitemap)
          ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          ET.register_namespace('',ns['sm'])
          urls=[n.text.strip() for n in tree.findall('sm:url/sm:loc',ns) if n.text]
          search_url='https://sports.alexlford.com/search/'
          if search_url not in urls:
              node=ET.SubElement(tree.getroot(),f"{{{ns['sm']}}}url")
              ET.SubElement(node,f"{{{ns['sm']}}}loc").text=search_url
              ET.indent(tree,space='  ')
              sitemap.write_text('<?xml version="1.0" encoding="UTF-8"?>\n'+ET.tostring(tree.getroot(),encoding='unicode')+'\n',encoding='utf-8')

          # Source validators know Search is a clean public utility route.
          replace('tools/validate_clean_urls.py', "'/favorites/','/analytics/','/hall-of-fame/'):", "'/favorites/','/analytics/','/hall-of-fame/','/search/'):")
          replace('tools/validate_site.py', '    "favorites/index.html","analytics/index.html","hall-of-fame/index.html",\n', '    "favorites/index.html","analytics/index.html","hall-of-fame/index.html","search/index.html",\n')
          replace('tools/validate_site.py', '        f"{PUBLIC_ORIGIN}/teams/", f"{PUBLIC_ORIGIN}/venues/",\n', '        f"{PUBLIC_ORIGIN}/teams/", f"{PUBLIC_ORIGIN}/venues/", f"{PUBLIC_ORIGIN}/search/",\n')
          replace('tools/validate_navigation.py', '    "if (pathname.startsWith(\'/hall-of-fame/\')) return \'hof\';",\n', '    "if (pathname.startsWith(\'/hall-of-fame/\')) return \'hof\';",\n    "if (pathname.startsWith(\'/search/\')) return \'search\';",\n    "header.querySelector(\'.global-search-link\')",\n')

          # Browser smoke + interaction coverage.
          replace('tests/browser/smoke.spec.js', "  ['about', '/about/', /Why this\\s*exists/i]\n];", "  ['about', '/about/', /Why this\\s*exists/i],\n  ['search', '/search/', /Find a game|Search/i]\n];")
          marker="test('archive JSON requests use the revalidated cache manifest version', async ({ page }) => {"
          search_test="""test('global archive search spans entities and preserves filters in the URL', async ({ page }) => {\n  await page.goto('/search/?q=Chiefs', { waitUntil: 'domcontentloaded' });\n  await expect(page.locator('#global-search')).toHaveValue('Chiefs');\n  await expect(page.locator('.search-result[data-result-type=\"team\"]', { hasText: 'Kansas City Chiefs' })).toBeVisible();\n  expect(await page.locator('.search-result[data-result-type=\"event\"]').count()).toBeGreaterThan(0);\n  await expect(page.locator('.global-search-link')).toHaveAttribute('href', '/search/');\n\n  await page.locator('#type-filters button[data-type=\"team\"]').click();\n  await expect(page).toHaveURL(/type=team/);\n  expect(await page.locator('.search-result:not([data-result-type=\"team\"])').count()).toBe(0);\n\n  await page.locator('#global-search').fill('Arrowhead');\n  await page.locator('#type-filters button[data-type=\"venue\"]').click();\n  await expect(page.locator('.search-result[data-result-type=\"venue\"]', { hasText: 'Arrowhead Stadium' })).toBeVisible();\n\n  await page.locator('#global-search').fill('Denver');\n  await page.locator('#type-filters button[data-type=\"city\"]').click();\n  await expect(page.locator('.search-result[data-result-type=\"city\"]', { hasText: 'Denver, CO' })).toBeVisible();\n\n  await page.locator('#global-search').fill('2026');\n  await page.locator('#type-filters button[data-type=\"year\"]').click();\n  await expect(page.locator('.search-result[data-result-type=\"year\"]', { hasText: '2026' })).toHaveAttribute('href', '/years/2026/');\n});\n\n"""
          replace('tests/browser/smoke.spec.js',marker,search_test+marker)
          replace('tests/browser/accessibility.spec.js', "  '/favorites/'\n];", "  '/favorites/',\n  '/search/?q=Chiefs'\n];")

      - name: Regenerate first-class routes
        run: python tools/generate_routes.py
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/finish-global-search.yml
          git config user.name "sports-passport-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add full archive search"
          git push origin HEAD:audit/global-search
