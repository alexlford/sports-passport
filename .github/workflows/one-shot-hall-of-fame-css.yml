name: One-shot Hall of Fame CSS extraction

on:
  push:
    branches: [refactor/hall-of-fame-css]

permissions:
  contents: write

jobs:
  refactor-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/hall-of-fame-css
      - name: Replace inline Hall of Fame styles and regenerate clean routes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('hall-of-fame.html')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'<style>.*?</style>',
              '<link rel="stylesheet" href="assets/hall-of-fame.css">',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Expected inline Hall of Fame stylesheet was not found')
          path.write_text(updated, encoding='utf-8')
          PY
          python tools/generate_routes.py
          if grep -q '<style>' hall-of-fame.html; then
            echo 'Inline Hall of Fame stylesheet remains' >&2
            exit 1
          fi
      - name: Commit generated refactor
        run: |
          git config user.name "sports-passport-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hall-of-fame.html hall-of-fame/index.html sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "Load Hall of Fame styles from page stylesheet"
          git push origin HEAD:refactor/hall-of-fame-css
