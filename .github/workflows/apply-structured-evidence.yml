name: Apply Structured Event Evidence

on:
  push:
    branches: [audit/structured-event-evidence]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/structured-event-evidence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Migrate structured event evidence
        run: python tools/apply_structured_evidence.py
      - name: Refresh data cache version
        run: python tools/generate_cache_manifest.py
      - name: Regenerate first-class routes
        run: python tools/generate_routes.py
      - name: Validate structured evidence
        run: |
          python tools/validate_data.py
          python tools/validate_event_passports.py
          python tools/validate_artifacts.py
          python tools/validate_cache_policy.py
          python tools/validate_site.py
      - name: Commit generated tranche
        run: |
          rm tools/apply_structured_evidence.py .github/workflows/apply-structured-evidence.yml
          git config user.name "sports-passport-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Structure event evidence and richer context fields"
          git push origin HEAD:audit/structured-event-evidence
