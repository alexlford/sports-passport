name: Finalize Terminology Generated Assets

on:
  push:
    branches: [audit/terminology]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/terminology
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate production archive artifacts
        run: |
          python tools/generate_cache_manifest.py
          python tools/generate_routes.py
          python tools/apply_event_indexing.py
          python tools/generate_sitemap.py
          python tools/validate_terminology.py
      - name: Commit generated artifacts
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache-manifest.json about analytics chapters events favorites geography hall-of-fame journeys teams venues years sitemap.xml
          git commit -m "Finalize terminology generated routes"
          git push origin HEAD:audit/terminology
