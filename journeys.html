<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journeys | Sports Passport</title><link rel="stylesheet" href="assets/site.css"></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Journeys</div><nav class="nav"><a href="index.html">Archive</a><a href="teams.html">Teams</a><a href="lifetime-analytics.html">Analytics</a></nav></header><section class="hero"><div class="kicker">Live life threads</div><h1>Sports,<br>across a life.</h1><div class="deck">Journey definitions live in data/journeys.json. As matching events are added, journey counts and timelines grow automatically.</div></section><div class="cards" id="cards"></div></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,[events,journeys]=await Promise.all([D.load("events"),D.load("journeys")]);const cards=document.querySelector("#cards");journeys.forEach(j=>{const ev=D.journeyEvents(events,j),yrs=ev.map(e=>e.year),a=document.createElement("a");a.className="card";a.href=`journey-profile.html?j=${encodeURIComponent(j.key)}`;a.innerHTML=`<div class="kicker">${ev.length} event${ev.length===1?"":"s"}</div><h3>${j.title}</h3><p>${j.description}${yrs.length?`<br>${Math.min(...yrs)}–${Math.max(...yrs)}`:""}</p>`;cards.appendChild(a)})})();</script></body></html>
