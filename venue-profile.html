<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Venue Profile | Sports Passport</title>
  <link rel="stylesheet" href="assets/site.css">
  <style>
    .coord{font-family:ui-monospace,monospace;color:var(--muted)}.confidence-note{margin-top:14px;padding:13px 15px;border:1px solid var(--line);border-left:5px solid #725b86;border-radius:14px;background:#fffaf0;color:var(--muted);line-height:1.45}.event-confidence{display:inline-block;margin-left:7px;padding:2px 6px;border-radius:999px;background:#eee8f2;color:#654875;font-size:.62rem;font-weight:900;text-transform:uppercase}.ranking-badges{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 2px}.ranking-badge{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:7px 11px;border-radius:999px;font-size:.78rem;font-weight:900;text-decoration:none;border:1px solid rgba(255,255,255,.44);background:rgba(255,255,255,.9);color:var(--ink);box-shadow:0 6px 18px rgba(20,30,45,.09)}.ranking-badge strong{font-size:.95rem}.ranking-badge.favorite{border-left:5px solid #1d4ed8}.ranking-badge.best{border-left:5px solid #0f766e}.ranking-badge:hover{text-decoration:underline}.ranking-context{margin-top:8px;font-size:.78rem;color:var(--muted)}.team-link,.event-link{color:inherit;text-decoration:none}.team-link:hover,.event-link:hover{text-decoration:underline}.signature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.signature{display:block;padding:18px;border:1px solid var(--line);border-top:5px solid #d6a928;border-radius:18px;background:#fffaf0;text-decoration:none}.signature .rank{font-size:.68rem;font-weight:950;letter-spacing:.1em;text-transform:uppercase;color:#8a6b00}.signature h3{margin:.35rem 0 .4rem}.signature p{margin:0;color:var(--muted);font-size:.86rem;line-height:1.5}@media(max-width:700px){.ranking-badges{display:grid;grid-template-columns:1fr}.ranking-badge{border-radius:14px;justify-content:flex-start}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top"><div class="brand">Sports Passport · Venue Profile</div><nav class="nav"><a href="venues.html">All Venues</a><a href="venue-map.html">Map</a><a href="favorites.html">Top Tens</a><a href="index.html">Archive</a></nav></header>
  <div id="app"></div>
</main>
<script src="assets/sports-passport-data.js"></script>
<script>
(async()=>{
  const D=window.SportsPassportData;
  const [events,venues,rankings]=await Promise.all([D.load('events'),D.load('venues'),D.load('curated-rankings')]);
  const slug=new URLSearchParams(location.search).get('v'),v=venues.find(x=>x.slug===slug),app=document.querySelector('#app');
  if(!v){app.innerHTML='<section class="hero"><h1>Venue not found.</h1></section>';return}
  document.title=`${v.display_name} | Sports Passport`;
  const ev=D.venueEvents(events,v.key).sort((a,b)=>b.date.localeCompare(a.date)),confirmed=ev.filter(D.isConfirmedEvent),notional=ev.filter(D.isNotionalEvent).length,sports=D.counts(ev.map(e=>e.sport)),teams=D.counts(ev.flatMap(D.eventTeams)),teamTop=Object.entries(teams).sort((a,b)=>b[1]-a[1]),yrs=ev.map(e=>e.year),span=yrs.length?`${Math.min(...yrs)}–${Math.max(...yrs)}`:'No visits yet';
  const experienceById=Object.fromEntries((rankings.sports_experiences||[]).map(x=>[x.event_id,x])),signatureEvents=ev.map(e=>({event:e,rank:experienceById[e.id]})).filter(x=>x.rank).sort((a,b)=>a.rank.rank-b.rank.rank);
  const rows=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="leader"><span><a class="team-link" href="team-profile.html?t=${encodeURIComponent(D.slug(k))}">${k}</a></span><strong>${n}</strong></div>`).join('');
  const timeline=ev.map(e=>{const rank=experienceById[e.id];return `<div class="event"><div class="event-year"><a class="event-link" href="year.html?y=${e.year}">${e.year}</a></div><div><b><a class="event-link" href="event.html?id=${encodeURIComponent(e.id)}">${D.matchup(e)} ${D.score(e)}</a></b>${rank?`<span class="event-confidence" style="background:#f6edc7;color:#775d00">Top 10 #${rank.rank}</span>`:''}${e.attendance_status==='notional'?'<span class="event-confidence">Notional</span>':''}<small>${e.date} · ${e.sport} · ${e.city}</small></div></div>`}).join('');
  const coord=(v.latitude!=null&&v.longitude!=null)?`${v.latitude.toFixed(5)}, ${v.longitude.toFixed(5)}`:'Coordinate not yet registered',confidenceNote=notional?`<div class="confidence-note"><strong>Confidence policy.</strong> ${notional} visit${notional===1?' is':'s are'} explicitly notional. Archive visit totals include those reconstructions; confirmed/documented visit counts do not.</div>`:'';
  const findRank=key=>Array.isArray(rankings?.[key])?rankings[key].find(x=>Array.isArray(x.venue_slugs)&&x.venue_slugs.includes(slug)):null,favoriteRank=findRank('favorite_venues'),bestRank=findRank('best_venues');
  const rankingBadges=[favoriteRank?`<a class="ranking-badge favorite" href="favorites.html#favorite-venues"><strong>#${favoriteRank.rank}</strong> Favorite Venue</a>`:'',bestRank?`<a class="ranking-badge best" href="favorites.html#best-venues"><strong>#${bestRank.rank}</strong> Best Venue Visited</a>`:''].filter(Boolean).join(''),rankingBlock=rankingBadges?`<div class="ranking-badges">${rankingBadges}</div><div class="ranking-context">Curated rankings are personal editorial lists and are intentionally separate from archive visit counts.</div>`:'';
  const signatures=signatureEvents.length?`<section class="section"><div class="kicker">Personal canon</div><h2>Signature moments here.</h2><div class="signature-grid">${signatureEvents.map(({event,rank})=>`<a class="signature" href="event.html?id=${encodeURIComponent(event.id)}"><div class="rank">Top 10 experience · #${rank.rank}</div><h3>${rank.title}</h3><p>${rank.detail}</p></a>`).join('')}</div></section>`:'';
  app.innerHTML=`<section class="hero"><div class="kicker">${v.city}</div><h1>${v.display_name}</h1><div class="deck">${ev.length} archive visit${ev.length===1?'':'s'}${yrs.length?` across ${span}`:''}. This page recalculates automatically from the central archive data.</div>${rankingBlock}${confidenceNote}<div class="stats"><div class="stat"><strong>${ev.length}</strong><span>Archive visits</span></div><div class="stat"><strong>${confirmed.length}</strong><span>Confirmed / documented</span></div><div class="stat"><strong>${span}</strong><span>Span</span></div><div class="stat"><strong>${Object.keys(sports).length}</strong><span>Sports</span></div><div class="stat"><strong>${signatureEvents.length}</strong><span>Top 10 moments</span></div></div></section>${signatures}<section class="section grid2"><div class="panel"><div class="kicker">Physical venue</div><h2>Location record</h2><p>${v.city}</p><p class="coord">${coord}</p>${v.aliases?.length?`<p>Archive aliases: ${v.aliases.join(', ')}</p>`:''}</div><div class="panel"><div class="kicker">Sport mix</div><h2>What you saw here</h2><div class="rank-list">${Object.entries(sports).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="leader"><span>${k}</span><strong>${n}</strong></div>`).join('')}</div></div></section><section class="section grid2"><div class="panel"><div class="kicker">Teams</div><h2>Most seen here</h2><p class="density-note">Team counts use canonical franchise and program identities. Team names open their full dossiers.</p><div class="rank-list" data-density="8">${rows(Object.fromEntries(teamTop))}</div></div><div class="panel"><div class="kicker">Visit history</div><h2>Every gate</h2><p class="density-note">Years open annual editions; game names open exact event passports.</p><div class="timeline-list" data-density="10">${timeline}</div></div></section>`;
  D.enhanceDensity(app);
})();
</script>
</body>
</html>
