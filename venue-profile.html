<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venue Profile | Sports Passport</title><link rel="stylesheet" href="assets/site.css"><style>.artifact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.artifact{min-height:180px;padding:20px;border:1px solid var(--line);border-radius:19px;background:repeating-linear-gradient(135deg,#fffdf8,#fffdf8 14px,#faf4e7 14px,#faf4e7 28px)}.coord{font-family:ui-monospace,monospace;color:var(--muted)}@media(max-width:700px){.artifact-grid{grid-template-columns:1fr}}</style></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Venue Profile</div><nav class="nav"><a href="venues.html">All Venues</a><a href="venue-map.html">Map</a><a href="index.html">Archive</a></nav></header><div id="app"></div></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,[events,venues]=await Promise.all([D.load("events"),D.load("venues")]);const slug=new URLSearchParams(location.search).get("v"),v=venues.find(x=>x.slug===slug),app=document.querySelector("#app");if(!v){app.innerHTML='<section class="hero"><h1>Venue not found.</h1></section>';return}document.title=`${v.display_name} | Sports Passport`;const ev=D.venueEvents(events,v.key).sort((a,b)=>b.date.localeCompare(a.date)),sports=D.counts(ev.map(e=>e.sport)),teams=D.counts(ev.flatMap(e=>e.teams)),teamTop=Object.entries(teams).sort((a,b)=>b[1]-a[1]),yrs=ev.map(e=>e.year);const rows=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="leader"><span>${k}</span><strong>${n}</strong></div>`).join(""),timeline=ev.map(e=>`<div class="event"><div class="event-year">${e.year}</div><div><b>${D.matchup(e)} ${D.score(e)}</b><small>${e.date} · ${e.sport} · ${e.city}</small></div></div>`).join(""),coord=(v.latitude!=null&&v.longitude!=null)?`${v.latitude.toFixed(5)}, ${v.longitude.toFixed(5)}`:"Coordinate not yet registered";app.innerHTML=`<section class="hero"><div class="kicker">${v.city}</div><h1>${v.display_name}</h1><div class="deck">${ev.length} documented visit${ev.length===1?"":"s"} across ${Math.min(...yrs)}–${Math.max(...yrs)}. This page recalculates automatically from the central archive data.</div><div class="stats"><div class="stat"><strong>${ev.length}</strong><span>Visits</span></div><div class="stat"><strong>${Math.min(...yrs)}–${Math.max(...yrs)}</strong><span>Span</span></div><div class="stat"><strong>${Object.keys(sports).length}</strong><span>Sports</span></div><div class="stat"><strong>${Object.keys(teams).length}</strong><span>Teams seen</span></div><div class="stat"><strong>${teamTop[0]?.[0]||"—"}</strong><span>Most seen here</span></div></div></section><section class="section grid2"><div class="panel"><div class="kicker">Physical venue</div><h2>Location record</h2><p>${v.city}</p><p class="coord">${coord}</p>${v.aliases?.length?`<p>Archive aliases: ${v.aliases.join(", ")}</p>`:""}</div><div class="panel"><div class="kicker">Sport mix</div><h2>What you saw here</h2><div class="rank-list">${rows(sports)}</div></div></section><section class="section grid2"><div class="panel"><div class="kicker">Teams</div><h2>Most seen here</h2><div class="rank-list" data-density="8">${rows(Object.fromEntries(teamTop))}</div></div><div class="panel"><div class="kicker">Visit history</div><h2>Every gate</h2><p class="density-note">Most recent first. Long venue histories open with the latest 10 visits.</p><div class="timeline-list" data-density="10">${timeline}</div></div></section><section class="section"><div class="kicker">Museum cases</div><h2>Artifacts to add.</h2><div class="artifact-grid"><div class="artifact"><h3>Ticket stub</h3><p>Ticket, credential, or parking pass.</p></div><div class="artifact"><h3>Seat view</h3><p>Photograph from the seats or concourse.</p></div><div class="artifact"><h3>Program or keepsake</h3><p>Programs, scorecards, giveaways, or autographs.</p></div></div></section>`;D.enhanceDensity(app)})();</script></body></html>
