<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venue Profile | Sports Passport</title><link rel="stylesheet" href="assets/site.css"><style>.artifact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.artifact{min-height:180px;padding:20px;border:1px solid var(--line);border-radius:19px;background:repeating-linear-gradient(135deg,#fffdf8,#fffdf8 14px,#faf4e7 14px,#faf4e7 28px)}.coord{font-family:ui-monospace,monospace;color:var(--muted)}.confidence-note{margin-top:14px;padding:13px 15px;border:1px solid var(--line);border-left:5px solid #725b86;border-radius:14px;background:#fffaf0;color:var(--muted);line-height:1.45}.event-confidence{display:inline-block;margin-left:7px;padding:2px 6px;border-radius:999px;background:#eee8f2;color:#654875;font-size:.62rem;font-weight:900;text-transform:uppercase}.ranking-badges{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 2px}.ranking-badge{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:7px 11px;border-radius:999px;font-size:.78rem;font-weight:900;text-decoration:none;border:1px solid rgba(255,255,255,.44);background:rgba(255,255,255,.9);color:var(--ink);box-shadow:0 6px 18px rgba(20,30,45,.09)}.ranking-badge strong{font-size:.95rem}.ranking-badge.favorite{border-left:5px solid #1d4ed8}.ranking-badge.best{border-left:5px solid #0f766e}.ranking-badge:hover{text-decoration:underline}.ranking-context{margin-top:8px;font-size:.78rem;color:var(--muted)}@media(max-width:700px){.artifact-grid{grid-template-columns:1fr}.ranking-badges{display:grid;grid-template-columns:1fr}.ranking-badge{border-radius:14px;justify-content:flex-start}}</style></head><body><main class="shell"><header class="top"><div class="brand">Sports Passport · Venue Profile</div><nav class="nav"><a href="venues.html">All Venues</a><a href="venue-map.html">Map</a><a href="favorites.html">Top Tens</a><a href="index.html">Archive</a></nav></header><div id="app"></div></main><script src="assets/sports-passport-data.js"></script><script>(async()=>{const D=window.SportsPassportData,[events,venues,rankings]=await Promise.all([D.load("events"),D.load("venues"),D.load("curated-rankings")]);const slug=new URLSearchParams(location.search).get("v"),v=venues.find(x=>x.slug===slug),app=document.querySelector("#app");if(!v){app.innerHTML='<section class="hero"><h1>Venue not found.</h1></section>';return}document.title=`${v.display_name} | Sports Passport`;const ev=D.venueEvents(events,v.key).sort((a,b)=>b.date.localeCompare(a.date)),confirmed=ev.filter(e=>Number(e.year)>=2006||e.attendance_status==="verified"),notional=ev.filter(e=>e.attendance_status==="notional").length,sports=D.counts(ev.map(e=>e.sport)),teams=D.counts(ev.flatMap(D.eventTeams)),teamTop=Object.entries(teams).sort((a,b)=>b[1]-a[1]),yrs=ev.map(e=>e.year),span=yrs.length?`${Math.min(...yrs)}–${Math.max(...yrs)}`:'No visits yet';const rows=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="leader"><span>${k}</span><strong>${n}</strong></div>`).join(""),timeline=ev.map(e=>`<div class="event"><div class="event-year">${e.year}</div><div><b>${D.matchup(e)} ${D.score(e)}</b>${e.attendance_status==="notional"?'<span class="event-confidence">Notional</span>':''}<small>${e.date} · ${e.sport} · ${e.city}</small></div></div>`).join(""),coord=(v.latitude!=null&&v.longitude!=null)?`${v.latitude.toFixed(5)}, ${v.longitude.toFixed(5)}`:"Coordinate not yet registered",confidenceNote=notional?`<div class="confidence-note"><strong>Confidence policy.</strong> ${notional} visit${notional===1?' is':'s are'} explicitly notional. Archive visit totals include those reconstructions; confirmed/documented visit counts do not.</div>`:'';const findRank=(key)=>Array.isArray(rankings?.[key])?rankings[key].find(x=>Array.isArray(x.venue_slugs)&&x.venue_slugs.includes(slug)):null;const favoriteRank=findRank('favorite_venues'),bestRank=findRank('best_venues');const rankingBadges=[favoriteRank?`<a class="ranking-badge favorite" href="favorites.html#favorite-venues"><strong>#${favoriteRank.rank}</strong> Favorite Venue</a>`:'',bestRank?`<a class="ranking-badge best" href="favorites.html#best-venues"><strong>#${bestRank.rank}</strong> Best Venue Visited</a>`:''].filter(Boolean).join('');const rankingBlock=rankingBadges?`<div class="ranking-badges">${rankingBadges}</div><div class="ranking-context">Curated rankings are personal editorial lists and are intentionally separate from archive visit counts.</div>`:'';app.innerHTML=`<section class="hero"><div class="kicker">${v.city}</div><h1>${v.display_name}</h1><div class="deck">${ev.length} archive visit${ev.length===1?"":"s"}${yrs.length?` across ${span}`:''}. This page recalculates automatically from the central archive data.</div>${rankingBlock}${confidenceNote}<div class="stats"><div class="stat"><strong>${ev.length}</strong><span>Archive visits</span></div><div class="stat"><strong>${confirmed.length}</strong><span>Confirmed / documented</span></div><div class="stat"><strong>${span}</strong><span>Span</span></div><div class="stat"><strong>${Object.keys(sports).length}</strong><span>Sports</span></div><div class="stat"><strong>${Object.keys(teams).length}</strong><span>Canonical teams seen</span></div></div></section><section class="section grid2"><div class="panel"><div class="kicker">Physical venue</div><h2>Location record</h2><p>${v.city}</p><p class="coord">${coord}</p>${v.aliases?.length?`<p>Archive aliases: ${v.aliases.join(", ")}</p>`:""}</div><div class="panel"><div class="kicker">Sport mix</div><h2>What you saw here</h2><div class="rank-list">${rows(sports)}</div></div></section><section class="section grid2"><div class="panel"><div class="kicker">Teams</div><h2>Most seen here</h2><p class="density-note">Team counts use canonical franchise and program identities.</p><div class="rank-list" data-density="8">${rows(Object.fromEntries(teamTop))}</div></div><div class="panel"><div class="kicker">Visit history</div><h2>Every gate</h2><p class="density-note">Most recent first. Notional early records are explicitly marked.</p><div class="timeline-list" data-density="10">${timeline}</div></div></section><section class="section"><div class="kicker">Museum cases</div><h2>Artifacts to add.</h2><div class="artifact-grid"><div class="artifact"><h3>Ticket stub</h3><p>Ticket, credential, or parking pass.</p></div><div class="artifact"><h3>Seat view</h3><p>Photograph from the seats or concourse.</p></div><div class="artifact"><h3>Program or keepsake</h3><p>Programs, scorecards, giveaways, or autographs.</p></div></div></section>`;D.enhanceDensity(app)})();</script></body></html>
